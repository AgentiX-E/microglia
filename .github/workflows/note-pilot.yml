name: note-pilot

# R206a — the pilot, in its own file because the arm is a different shape.
#
# The pack lane's driver (`packages/eval/src/bin/tau2-driver.ts`) builds a store, splits a corpus, pins a query
# and pairs two arms through a sidecar service. R206 runs `microglia_agent` with no facade at all, `--rounds 4`
# and one file the runner writes between rounds, so its argv is four words long and its reading is three blocks
# of counters. Teaching a 1,900-line driver a second shape would mean its own pair of arms could disagree about
# what "the same scaffold" means; running the phases here keeps this arm's control checkable by reading four
# lines of YAML.
#
# R207 changes the schedule, not the arm: **one task per `run_split.py` invocation**. The sidecar is the identity
# now (`scope: {kind: task, task: T}`) and a file holding two tasks would answer nothing, so an arm is one phase
# per task and the builder merges them. The cost is one τ² import per invocation, about ten seconds, which is
# cheaper than one wrong-note serving.
#
# Two jobs, and the split is the cost model:
#
#   contract  free, on every push that touches the material. Runs the four self-checks, then the *same* commands
#             the paid job runs, over a generated fixture pair, and requires the reading to come back `GRADED`;
#             then measures the four files the lane's instrument is made of and fails below 95% on any of them. A
#             push that breaks the task list, the path convention, the schema or the merge fails here rather than
#             on a dispatch that has already bought forty-eight simulations.
#   pilot     dispatch only. Two arms at one task per process, at the lane's measured ~26 s an episode: 6 tasks x
#             4 rounds x 2 arms = 48 simulations, about 25 minutes of model time, ~2 minutes of imports, and
#             roughly ¥0.7 at off-peak rates.
#
# The phases are separate processes on purpose. The agent's note counters live at module level, so two arms in
# one process would report one arm's lookups against the other's hits — and the arm's first gate is exactly
# whether the control saw a note at all.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'tau2 domain'
        required: false
        default: retail
      tasks:
        description: 'Comma-separated task ids. The pilot runs six; the fold runs forty.'
        required: false
        # R206a's grid, unchanged: R207 has to be comparable to it line for line, which it is only on the same
        # six tasks — the two tasks that share a scenario (5 and 9) are in it deliberately.
        default: '5,9,12,17,18,26'
      rounds:
        description: 'Attempts per task, scheduled as rounds (a note needs two)'
        required: false
        default: '4'
      max_steps:
        description: 'Steps per episode'
        required: false
        default: '100'
      concurrency:
        description: 'Tasks at a time. The provider limits requests, and one episode holds three.'
        required: false
        default: '1'
      note_verdict:
        description: 'Show the summariser the evaluator verdict as well as the attempt (R208)'
        required: false
        # Off, so a dispatch that does not name it runs R207's arm. Turning it on is a change to the material and
        # therefore to what the reading is comparable to: the fold refuses a corpus whose phases disagree.
        default: 'false'
  push:
    branches: [master]
    paths:
      - 'eval/drivers/tau2/notes.py'
      - 'eval/drivers/tau2/note_pilot.py'
      - 'eval/drivers/tau2/microglia_agent.py'
      - 'eval/drivers/tau2/run_split.py'
      - 'eval/verifiers/r206_readback.py'
      - 'eval/verifiers/opening_stability.py'
      - 'eval/tools/note_bank.py'
      - 'scripts/check-python-coverage.py'
      - '.github/workflows/note-pilot.yml'

permissions:
  contents: read

concurrency:
  # One pilot at a time. Two dispatches sharing a sidecar path would have the second reading the first's notes,
  # which is a treatment nobody registered and a reading that cannot be reproduced.
  group: note-pilot
  cancel-in-progress: false

jobs:
  contract:
    name: the two commands, over a fixture pair (no model calls)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Which interpreter the reading runs on
        run: |
          set -euo pipefail
          python3 --version
          # The builder and the verifier are standard library only, so they run on the system interpreter
          # rather than in tau2's virtualenv. That is not a detail: it is what lets the free half of this
          # workflow exist at all, and it is why a change to either file cannot be hidden behind a dependency.
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          PY

      - name: Both files agree with themselves
        run: |
          set -euo pipefail
          python3 eval/drivers/tau2/notes.py --self-test
          python3 eval/drivers/tau2/note_pilot.py --self-test
          python3 eval/verifiers/r206_readback.py --self-test
          python3 eval/verifiers/opening_stability.py --self-test
          python3 eval/tools/note_bank.py --self-test

      - name: The chain the paid job runs, end to end
        run: |
          set -euo pipefail
          FIXTURES="${RUNNER_TEMP}/note-pilot-fixtures"
          rm -rf "$FIXTURES"
          # The builder writes one phase per task and prints the six comma-separated path lists, so a rename fails
          # here instead of becoming a shell script that ran over nothing and a reading of an empty directory.
          python3 eval/drivers/tau2/note_pilot.py --fixtures "$FIXTURES" --rounds 4 > "${RUNNER_TEMP}/fixtures.json"
          eval "$(python3 - "${RUNNER_TEMP}/fixtures.json" <<'PY'
          import json, sys
          paths = json.load(open(sys.argv[1]))
          for key in ("control", "treatment", "controlResults", "treatmentResults", "notes", "out"):
              print(f'{key.upper()}="{paths[key]}"')
          PY
          )"
          python3 eval/drivers/tau2/note_pilot.py \
            --control "$CONTROL" --treatment "$TREATMENT" \
            --control-results "$CONTROLRESULTS" --treatment-results "$TREATMENTRESULTS" \
            --notes "$NOTES" \
            --domain retail --tasks 1,2,3,4,5,6 --rounds 4 --seeds 300,301,302,303 \
            --release v1.0.1 --out "$FIXTURES/note-pilot.json"
          # `ABANDONED` is a result and this step would accept it, so the fixture requires `GRADED`: the
          # fixture's mechanism demonstrably ran, and a reading that says otherwise is a broken grader.
          python3 eval/verifiers/r206_readback.py --dir "$FIXTURES" | tee "${RUNNER_TEMP}/reading.txt"
          tail -n 1 "${RUNNER_TEMP}/reading.txt" | grep -qx GRADED
          # R207: the merge is what the fold adds to the pilot, and it is only exercised by a fixture with more
          # than one task. The artefact must show one scope per task and a specificity recomputed over the corpus.
          python3 - "${FIXTURES}/note-pilot.json" <<'PY'
          import json, sys
          document = json.load(open(sys.argv[1]))
          notes = document["notes"]
          assert len(notes["scopeTasks"]) == 6, notes["scopeTasks"]
          assert notes["scopeProblems"] == [], notes["scopeProblems"]
          assert notes["specificity"]["share"] == 1.0, notes["specificity"]
          assert notes["taskHits"] > 0, notes["taskHits"]
          assert document["bill"]["controlUsd"] > 0, document["bill"]
          print("merge: 6 scopes, specificity 1.0, task hits", notes["taskHits"])
          PY

      - name: The instrument, measured
        # The four files this lane's evidence is made of had **no** coverage gate: the self-checks above say the
        # cases pass and nothing said how much of each file they reach. Measured before this step existed, the
        # lane stood at 89.4% with r206_readback.py at 86.6% and opening_stability.py at 80.0% — which is why the
        # R207 cases above are as many as they are, and why this floor is here rather than in a report.
        run: |
          set -euo pipefail
          # Installed here rather than assumed: the runner image does not carry `coverage`, and a gate that fails
          # on a missing package is a gate an operator learns to skip ("No module named coverage", first push).
          python3 -m pip install --disable-pip-version-check --quiet coverage
          INCLUDE="*/eval/drivers/tau2/notes.py,*/eval/drivers/tau2/note_pilot.py,*/eval/verifiers/r206_readback.py,*/eval/verifiers/opening_stability.py,*/eval/tools/note_bank.py"
          rm -f .coverage
          python3 -m coverage run --branch --include="$INCLUDE" eval/drivers/tau2/notes.py --self-test
          python3 -m coverage run --append --branch --include="$INCLUDE" eval/drivers/tau2/note_pilot.py --self-test
          python3 -m coverage run --append --branch --include="$INCLUDE" eval/verifiers/r206_readback.py --self-test
          python3 -m coverage run --append --branch --include="$INCLUDE" eval/verifiers/opening_stability.py --self-test
          python3 -m coverage run --append --branch --include="$INCLUDE" eval/tools/note_bank.py --self-test
          python3 -m coverage json -o "${RUNNER_TEMP}/coverage-notes.json" --include="$INCLUDE"
          # `--expect-files 5`: a run that measured nothing reports 100% of nothing, which is the one failure mode
          # a percentage cannot express. Five since R208 added the bank reader, which is the instrument the next
          # round's population is counted with.
          python3 scripts/check-python-coverage.py "${RUNNER_TEMP}/coverage-notes.json" --min 95 --expect-files 5

  pilot:
    name: pilot — the note carried from attempt k to attempt k+1
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Install (8 min) plus the episodes divided by the concurrency plus one τ² import per invocation plus the
    # reading. Generous rather than tight: a step killed mid-phase writes no artefact, which is the one outcome
    # this job cannot afford — and R210 found the previous ninety minutes too short for a fifty-task grid by a
    # factor of two.
    timeout-minutes: 180
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # The release a pass^k is comparable to. R92: v0.2.0 and v1.0.1 share no retail task ids, so a number
      # without this cannot be ranked against the board or against an earlier fold of this lane.
      TAU_VERSION: ${{ vars.TAU_VERSION }}
      TAU_MODEL: ${{ vars.TAU_MODEL || 'deepseek/deepseek-flash' }}
      TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
      PILOT_DOMAIN: ${{ github.event.inputs.domain || 'retail' }}
      PILOT_TASKS: ${{ github.event.inputs.tasks || '1,2,3,4,5,6' }}
      PILOT_ROUNDS: ${{ github.event.inputs.rounds || '4' }}
      PILOT_MAX_STEPS: ${{ github.event.inputs.max_steps || '100' }}
      PILOT_CONCURRENCY: ${{ github.event.inputs.concurrency || '1' }}
      # R208. Empty unless the dispatch asked for it, so the shell can append the flag conditionally rather than
      # passing `--note-verdict false`, which argparse would refuse for a `store_true` option.
      PILOT_NOTE_VERDICT: ${{ github.event.inputs.note_verdict || 'false' }}
      # The base seed, named once. `run_split.py` derives round i's seed as `base + i`, and the artefact states
      # the same list so a reader can re-run the fold without guessing what "four rounds" meant.
      PILOT_SEED: '300'
      PILOT_DIR: eval/results/note-pilot
    steps:
      - uses: actions/checkout@v4

      - name: Require the provider key before the first call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::DEEPSEEK_API_KEY is not configured for this repository"
            exit 1
          fi

      - name: Does the whole job fit in the off-peak window?
        # Before the installation, not after it: the guard's question is about the *job*, and eight minutes of `uv
        # sync` between the question and the first call is exactly the gap in which a run starting at 00:50 crosses
        # into the 01:00 band with its bill already doubled. R58's evaluation crossed 06:00 UTC and priced
        # ninety-three minutes at the closing band; this step exists so that crossing is a refusal rather than a
        # line in an artefact.
        run: |
          set -euo pipefail
          MINUTES="$(python3 -c "
          tasks = len([entry for entry in '${PILOT_TASKS}'.split(',') if entry])
          rounds = int('${PILOT_ROUNDS}')
          # 26 s a simulation, measured in R206's pilot (48 in 21 minutes), plus 10 s of τ² import per invocation
          # — R207 runs one task per process, so two per task — plus eight for the install and one for the
          # reading. Rounded up: a guard that under-estimates is a guard that refuses nothing.
          concurrency = max(1, int('${PILOT_CONCURRENCY}'))
          print(int((tasks * rounds * 2 * 26 + tasks * 2 * 10) / concurrency / 60) + 9 + 1)
          ")"
          echo "estimated ${MINUTES} min for this pilot" >> "$GITHUB_STEP_SUMMARY"
          python3 eval/drivers/tau2/note_pilot.py --window-minutes "${MINUTES}"

      - name: Cache the tau2 environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tau2-bench
          key: tau2-${{ vars.TAU_VERSION }}-${{ runner.os }}

      - name: Install tau2-bench at the pinned ref
        run: |
          set -euo pipefail
          REF="${TAU_VERSION:-v1.0.1}"
          if [ ! -d .tau2-bench/.git ]; then
            git clone --depth 1 --branch "$REF" https://github.com/sierra-research/tau2-bench .tau2-bench \
              || { echo "tau2-clone-failed:$REF"; exit 21; }
          fi
          cd .tau2-bench
          python -m pip install --upgrade pip uv
          uv sync || { echo "tau2-sync-failed:$REF"; exit 22; }
          # litellm imports its MCP handler eagerly on the first completion and does not declare `mcp` as a
          # hard dependency, so every model call raises ModuleNotFoundError before a request is sent.
          uv pip install mcp || { echo "tau2-mcp-missing:$REF"; exit 24; }
          uv run tau2 check-data || { echo "tau2-data-missing:$REF"; exit 23; }

      - name: The two arms, one task per process, with the seeds written down
        env:
          # The summariser's own environment. `run_split.py` reads the model through `TAU_MODEL` and derives
          # the note writer's model from it, so there is one string rather than two that can disagree.
          # The same number the guard divided by, so the estimate and the wall clock cannot disagree.
          TAU_CONCURRENCY: ${{ github.event.inputs.concurrency || '1' }}
          TAU_RETRIES: '4'
        run: |
          set -euo pipefail
          PYTHON="${GITHUB_WORKSPACE}/.tau2-bench/.venv/bin/python"
          test -x "$PYTHON" || { echo "tau2-venv-missing"; exit 25; }
          mkdir -p "${PILOT_DIR}/control" "${PILOT_DIR}/treatment"
          SEEDS="$(python3 -c "print(','.join(str(int('${PILOT_SEED}') + index) for index in range(int('${PILOT_ROUNDS}'))))")"
          echo "seeds ${SEEDS}" >> "$GITHUB_STEP_SUMMARY"
          echo "PILOT_SEEDS=${SEEDS}" >> "$GITHUB_ENV"

          # R207: one task per invocation, because the sidecar is the identity. `--tasks "$TASK"` is what makes the
          # scope a single task; `--notes` names the file this task's notes live in, and the runner declares the
          # scope in it before the first episode rather than leaving the agent to recognise the opening text.
          #
          # R210: the invocations run `TAU_CONCURRENCY` at a time. The loop was sequential and a fifty-task grid at
          # four rounds and two arms is 400 episodes — 173 minutes of simulation against a 90-minute job, which
          # would have been killed mid-run with a half-written grid and the money spent. The two passes stay
          # ordered: every control invocation finishes before the first treatment one starts, so a control that
          # fails still costs nothing downstream.
          cat > "${RUNNER_TEMP}/run_task.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          # One invocation: an arm and a task, in its own process, writing its own results and its own log.
          set -uo pipefail
          arm="$1"; task="$2"
          extra=()
          if [ "$arm" = "treatment" ]; then
            extra=(--notes "${PILOT_DIR}/notes-${task}.json")
            # R208. The verdict is treatment-only: the control has no summariser and so nothing to show it to, and
            # a control that carried the material would be the defect N1 exists for.
            if [ "${PILOT_NOTE_VERDICT}" = "true" ]; then
              extra+=(--note-verdict)
            fi
          fi
          # `--require-off-peak` on both arms: the same workload costs exactly double inside the provider's peak
          # windows. The guard refuses before the first call rather than reporting a bill after it.
          "${PYTHON}" eval/drivers/tau2/run_split.py \
            --phase eval --agent microglia_agent \
            --domain "${PILOT_DOMAIN}" --tasks "${task}" --rounds "${PILOT_ROUNDS}" \
            --max-steps "${PILOT_MAX_STEPS}" --seed "${PILOT_SEED}" --require-off-peak \
            --out "${PILOT_DIR}/${arm}/results-${task}.json" "${extra[@]}" \
            > "${PILOT_DIR}/${arm}-${task}.log" 2>&1
          SCRIPT
          chmod +x "${RUNNER_TEMP}/run_task.sh"
          export PILOT_DIR PILOT_DOMAIN PILOT_ROUNDS PILOT_MAX_STEPS PILOT_SEED PILOT_NOTE_VERDICT PYTHON

          run_arm () {
            local arm="$1"
            echo "${PILOT_TASKS}" | tr ',' '\n' \
              | xargs -P "${TAU_CONCURRENCY}" -n 1 "${RUNNER_TEMP}/run_task.sh" "$arm"
          }

          # Control first. If it fails, nothing has been spent on a treatment whose comparison would have no
          # other side; if the treatment fails, the control's artefact is still a pass^k on this grid.
          run_arm control
          run_arm treatment

      - name: Assemble the pilot's document
        run: |
          set -euo pipefail
          # One flag per arm, comma-separated: the builder merges the phases and refuses two documents that hold
          # the same task or the same attempt, which is the shape a half-finished loop leaves behind.
          CONTROL_LOGS=""; TREATMENT_LOGS=""; CONTROL_RESULTS=""; TREATMENT_RESULTS=""; SIDECARS=""
          for task in $(echo "${PILOT_TASKS}" | tr ',' ' '); do
            CONTROL_LOGS="${CONTROL_LOGS}${CONTROL_LOGS:+,}${PILOT_DIR}/control-${task}.log"
            TREATMENT_LOGS="${TREATMENT_LOGS}${TREATMENT_LOGS:+,}${PILOT_DIR}/treatment-${task}.log"
            CONTROL_RESULTS="${CONTROL_RESULTS}${CONTROL_RESULTS:+,}${PILOT_DIR}/control/results-${task}.json"
            TREATMENT_RESULTS="${TREATMENT_RESULTS}${TREATMENT_RESULTS:+,}${PILOT_DIR}/treatment/results-${task}.json"
            SIDECARS="${SIDECARS}${SIDECARS:+,}${PILOT_DIR}/notes-${task}.json"
          done
          python3 eval/drivers/tau2/note_pilot.py \
            --control "$CONTROL_LOGS" --treatment "$TREATMENT_LOGS" \
            --control-results "$CONTROL_RESULTS" --treatment-results "$TREATMENT_RESULTS" \
            --notes "$SIDECARS" \
            --domain "${PILOT_DOMAIN}" --tasks "${PILOT_TASKS}" --rounds "${PILOT_ROUNDS}" \
            --seeds "${PILOT_SEEDS}" --release "${TAU_VERSION:-v1.0.1}" \
            --out "${PILOT_DIR}/note-pilot.json"

      - name: Grade the pilot against the gates that can grade it
        run: |
          set -euo pipefail
          # `ABANDONED` keeps this step green and is the pilot's answer for a material that cannot be bought:
          # the state is in the outcome and in the summary, and a red job would teach an operator to re-dispatch
          # rather than to read. `NO_MEASUREMENT` and `DISCARDED` are the two that fail, because both mean the
          # document cannot answer — and both cost nothing to fix compared with another dispatch.
          #
          # One exception, and it is R207's own result: a **saturated grid** (`no-distilled-failure`) is a
          # `NO_MEASUREMENT` that a red job would misdescribe. Nothing about the document is broken — the task set
          # is too easy for the arm, so there was no failure to distil and N1-N3 were never testable. The step
          # warns, keeps the artefact, and stays green, because the repair is a harder dispatch and not a fix.
          set +e
          python3 eval/verifiers/r206_readback.py --dir "${PILOT_DIR}" | tee "${PILOT_DIR}/reading.txt"
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -q "reason: no-distilled-failure" "${PILOT_DIR}/reading.txt"; then
            echo "::warning::the grid produced no failure after round 1 — a saturated grid, not a refuted mechanism"
            STATUS=0
          fi
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi
          {
            echo "### R207 — the note, bound to its task by the file"
            echo
            echo '```'
            cat "${PILOT_DIR}/reading.txt"
            echo '```'
            echo
            python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["PILOT_DIR"], "note-pilot.json")
          document = json.load(open(path))
          arms, notes = document["arms"], document["notes"]
          k = document["configuration"]["rounds"]

          def share(value, digits=3):
              # A null is a state, not a zero: a coverage of `None` is a fold that failed nothing, and a
              # specificity of `None` is a fold whose sidecars were not read. Printing either as 0.000 would be the
              # absence-as-zero defect this lane has paid for twice.
              return "absent" if value is None else f"{value:.{digits}f}"

          print("| reading | value |")
          print("|---|---|")
          print(f"| pass^{k} control | {share(arms['control']['passK'])} |")
          print(f"| pass^{k} treatment | {share(arms['treatment']['passK'])} |")
          print(f"| delta (withheld) | {document['comparison']['passK']['deltaPp']} pp "
                f"over {document['comparison']['passK']['paired']} task(s) |")
          print(f"| note coverage | {share(notes['coverage'])} of {notes['failed']} failure(s) |")
          print(f"| refusals / truncated | {notes['refused']} / {notes.get('truncated', 0)} |")
          print(f"| specificity | {share((notes.get('specificity') or {}).get('share'))} |")
          print(f"| hits: file / text | {notes['taskHits']} / {notes['keyHits']} of {notes['lookups']} lookup(s) |")
          print(f"| material | attempt{' + verdict' if notes.get('verdict') else ' only'} "
                f"({notes.get('verdicts', 0)} failure(s) explained) |")
          print(f"| scopes | {len(notes['scopeTasks'])} task(s), {len(notes['scopeProblems'])} problem(s) |")
          print(f"| collisions | {notes['collisions']} |")
          print(f"| bill | ${document['bill']['controlUsd']} + ${document['bill']['treatmentUsd']} |")
          print(f"| material tokens | {document['bill']['materialTokens']} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Did the openings identify their tasks?
        # R206's pilot answered this with a number for the first time, and the answer was no: 0.006 exact reuse and
        # two tasks whose paraphrases are closer to each other than to their own siblings. Every future pilot of this
        # material carries the measurement, because a zero hit rate has two explanations and only one of them is
        # about the material.
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Can an opening message identify its task?"
            echo
            echo '```'
            # Exit 2 is `NO_MEASUREMENT` — fewer than two attempts at any task, so there is nothing to compare and
            # nothing to say. It is echoed rather than propagated: a pilot that ran one round is a wiring run, and
            # a red job would report the grid as broken.
            if ! python3 eval/verifiers/opening_stability.py --dir "${PILOT_DIR}"; then
              echo "opening stability: not measurable on this grid"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pilot
        # `always()`: the artefact of a pilot that abandoned its material is the evidence for not buying the
        # fold, and it is worth more than the log that says the job ended.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-pilot
          # The per-task pattern rather than a list: R207 writes one log, one results file and one sidecar per
          # task, and a hand-written list of forty paths is a list that silently misses the forty-first.
          path: |
            eval/results/note-pilot/**/*.json
            eval/results/note-pilot/*.log
            eval/results/note-pilot/reading.txt
          if-no-files-found: warn

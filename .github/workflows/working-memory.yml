name: working-memory

# R216 — the set rule, and a block placed behind the conversation.
#
# R215 changed the supply rule and the harm went away: asks from the request took the list from 10.6 a turn to 1.96,
# the block stopped moving on every turn (23.9%), and -5.3 pp became +4.4 pp. Two things it could not fix by asking
# for less:
#
#   * **the board could not see its own successes.** Only 32.7% of writing episodes ended with a tick, against a 60%
#     bar. R215's diagnosis was a set phras ("return everything from my two most recent orders"), and re-parsing the
#     round's own episodes before spending anything says that was worth **two settlements in a hundred and seven**.
#     The bulk is three other things: an ask one word short of the product it names (28 episodes), a contract sealed
#     on a greeting that contained no ask (14), and the account families, whose receipts carry no item id at all
#     (AUDIT 34.227). All four are repaired here; `--replay` is what found them.
#   * **the address was the bill.** A block in the system message sits in front of every token the episode will send,
#     so each of the round's 247 changes re-bought a 4,756-token prompt; 114 of them were first turns, which no
#     per-turn block can avoid. The arm cost 37% more for a 200-character list (AUDIT 34.226).
#
# So this round moves the block **behind the conversation** — appended when a receipt changes it, left exactly where
# it was written when nothing does — and teaches the parser the third settlement shape: a **set** ask, one ask over
# several products, settled by its family and absorbing the calls that belong to it.
#
# Endpoints, checked in this order: the mechanism (a set is settled and absorbs; the block is written on at most half
# the turns; the arm's bill per episode is within 20% of the control's — the design's derivation puts it at ~15% and
# R215's front placement at 37%), then attribution (60% of writing episodes ticked), then the rate (+10 pp paired).

on:
  workflow_dispatch:
    inputs:
      arms:
        description: "three (control, front, tail — R216), placement (front, tail — R216b), pair (control, front — R218b), interleave (control-a, control-b — R218c), admission (tail, policy — R219), both (control, tail), board, control, policy"
        required: false
        default: 'placement'
      tasks:
        description: 'Comma-separated task ids. Empty means every task the bank holds.'
        required: false
        # Empty on purpose: the population is the bank's, and a second copy of 114 ids in this file is the copy
        # that goes stale the day the bank is re-read.
        default: ''
      trials:
        description: 'Attempts per task. One is the registered grid; two turns the pairing into a best-of.'
        required: false
        default: '1'
      seed:
        description: 'The seed world both arms share'
        required: false
        default: '400'
      k:
        description: 'Attempts a task must survive to count as passed. 1 for pass^1; 4 for the reliability reading'
        required: false
        default: '1'
      max_steps:
        description: 'Steps per episode'
        required: false
        default: '100'
      concurrency:
        description: 'Episodes at a time, inside one invocation'
        required: false
        default: '3'
  # R219. No `schedule:` trigger, and the removal is the repair rather than the tidy-up. A cron armed for 25 November
  # at 10:02 UTC fired at **19:41 UTC** — nine hours late — and started a `placement` dispatch (front, board, 228
  # episodes, ≈$1.3) for a round that had been read that morning. The job-level guard compares `github.event.schedule`
  # against the cron string, which *any* firing of that entry satisfies, so a guard written to stop a stale cron from
  # spending money could not see lateness; it also held the concurrency group, keeping R219b pending behind it
  # (AUDIT 34.260). A paid grid is dispatched with a date, an arm set and a registered bar. It is not armed and hoped
  # for.
  push:
    branches: [master]
    paths:
      - 'eval/tools/goal_board.py'
      - 'eval/manifests/retail-goals.json'
      - 'eval/drivers/tau2/microglia_agent.py'
      - 'eval/drivers/tau2/run_split.py'
      - 'eval/drivers/tau2/selfcheck_agent.py'
      - '.github/workflows/working-memory.yml'

permissions:
  contents: read

concurrency:
  # One working-memory run at a time: the two arms are one measurement, and a second dispatch overlapping the first
  # would have the control of one world paired against the board of another.
  group: working-memory
  cancel-in-progress: false

jobs:
  contract:
    name: the parser and the agent, over documents whose answer is known (no model calls)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The parser agrees with itself
        run: |
          set -euo pipefail
          python3 eval/tools/goal_board.py --self-test

      - name: The agent that serves the board still behaves
        # R214. `selfcheck_agent.py` is the only suite about the agent every paid dispatch loads, and until R214
        # **no workflow ran it**: the tau2 drivers were outside `ci.yml`'s coverage source and no job named them. A
        # suite nobody runs is a suite that protects nothing, so the gate for the arm that changed the agent is the
        # gate that runs the agent's own suite — and measures how much of the agent it reaches.
        run: |
          set -euo pipefail
          python3 eval/drivers/tau2/selfcheck_agent.py --self-test
          python3 eval/drivers/tau2/selfcheck_usage.py --self-test
          python3 -m pip install --disable-pip-version-check --quiet coverage
          INCLUDE="*/eval/drivers/tau2/microglia_agent.py"
          rm -f .coverage
          python3 -m coverage run --branch --include="$INCLUDE" \
            eval/drivers/tau2/selfcheck_agent.py --self-test
          python3 -m coverage json -o "${RUNNER_TEMP}/coverage-agent.json" --include="$INCLUDE"
          # 98 rather than 95: the suite reaches 99% of the module's lines, and a rung two points under the
          # measurement is a rung a two-point regression climbs over.
          python3 scripts/check-python-coverage.py "${RUNNER_TEMP}/coverage-agent.json" --min 98 --expect-files 1

      - name: The census, and the numbers it was quoted at
        # The extractor's licence is a measurement, so the measurement is a gate. These are the numbers this round
        # registered: 176 of 226 required objects found, 150 of 180 required families mentioned, 235 asks no
        # required object accounts for, and 84 of 114 tasks fully covered. The bounds are tight on purpose — a
        # parser change that moves the material has to be registered as one, and R215's own negation repair moved
        # recall by nothing and noise by three, which is the size of change this gate is meant to notice.
        run: |
          set -euo pipefail
          python3 eval/tools/goal_board.py --census --json | tee "${RUNNER_TEMP}/census.json"
          python3 - "${RUNNER_TEMP}/census.json" <<'PY'
          import json, sys

          reading = json.load(open(sys.argv[1]))
          assert reading["tasks"] == 114, reading["tasks"]
          assert reading["required"] == 226, reading["required"]
          assert reading["found"] >= 174, reading["found"]
          assert reading["familyRecall"] >= 0.82, reading["familyRecall"]
          assert reading["spurious"] <= 240, reading["spurious"]
          assert reading["tasksCovered"] >= 82, reading["tasksCovered"]
          print(f"ok  {reading['found']}/{reading['required']} objects, {reading['familyRecall']:.1%} of families, "
                f"{reading['spurious']} spurious, {reading['tasksCovered']}/{reading['tasks']} tasks covered")
          PY

      - name: The interleaved placebo's driver, measured
        # R218c. This is the module that decides which arm runs first, which tasks share a block, and whether the
        # pair is readable at all — so its defect would be a reading about the instrument published as a reading
        # about the memory. It needs no provider (a fake runner writes the documents), which is why this gate can
        # sit in the cheap job rather than in the one that spends.
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet coverage
          INCLUDE="*/eval/drivers/tau2/interleave.py"
          rm -f .coverage
          python3 -m coverage run --branch --include="$INCLUDE" eval/drivers/tau2/interleave.py --self-test
          python3 -m coverage json -o "${RUNNER_TEMP}/coverage-interleave.json" --include="$INCLUDE"
          # 95 rather than the measured 99.8: the same rung the rest of the tree uses, so a two-point regression
          # is caught and a refactor that moves a line is not a build failure.
          python3 scripts/check-python-coverage.py "${RUNNER_TEMP}/coverage-interleave.json" --min 95 --expect-files 1

      - name: The parser, measured
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet coverage
          INCLUDE="*/eval/tools/goal_board.py"
          rm -f .coverage
          python3 -m coverage run --branch --include="$INCLUDE" eval/tools/goal_board.py --self-test
          python3 -m coverage json -o "${RUNNER_TEMP}/coverage-board.json" --include="$INCLUDE"
          python3 scripts/check-python-coverage.py "${RUNNER_TEMP}/coverage-board.json" --min 95 --expect-files 1

      - name: The paired reader, over grids whose answer is known
        # A reader is only worth the numbers it refuses. Four fixtures: a clean sweep of thirty must clear the bar
        # and be `BOARD_UP`, the same thirty inverted must be `BOARD_DOWN`, three moves must be a `MOVED` that does
        # not clear it, and two arms with no task in common must be `UNPAIRED` rather than a rate over nothing.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path

          TOOL = "eval/tools/goal_board.py"

          def grid(passes: int, total: int = 114) -> dict:
              return {"simulations": [
                  {"task_id": str(index), "trial": 0, "reward_info": {"reward": 1.0 if index < passes else 0.0}}
                  for index in range(total)
              ]}

          def read(left: dict, right: dict):
              with tempfile.TemporaryDirectory() as temporary:
                  a = Path(temporary) / "control.json"
                  b = Path(temporary) / "board.json"
                  a.write_text(json.dumps(left))
                  b.write_text(json.dumps(right))
                  done = subprocess.run(["python3", TOOL, "--compare", str(a), str(b)],
                                        capture_output=True, text=True)
              return done.returncode, done.stdout + done.stderr

          cases = [
              ("a sweep of thirty clears the bar", grid(84), grid(114), "BOARD_UP"),
              ("a drop of thirty is a loss", grid(114), grid(84), "BOARD_DOWN"),
              ("three moves are real and short of the bar", grid(111), grid(114), "NO_LIFT"),
          ]
          for name, left, right, state in cases:
              returned, output = read(left, right)
              assert returned == 0, f"{name}: exit {returned}\n{output}"
              assert state in output, f"{name}: {state} not in\n{output}"
              print(f"ok  {name}")

          left = {"simulations": [{"task_id": "0", "trial": 0, "reward_info": {"reward": 1.0}}]}
          right = {"simulations": [{"task_id": "1", "trial": 0, "reward_info": {"reward": 1.0}}]}
          returned, output = read(left, right)
          assert "UNPAIRED" in output, output
          print("ok  two arms with no task in common are unpaired")
          PY

  board:
    name: board — one attempt over the whole population, two arms, the same seed world
    needs: contract
    # A dispatch, or the one scheduled opening this round armed. Anything else — a push, a cron from another date —
    # runs the contract job and stops there, which is the cheap half.
    if: github.event_name == 'workflow_dispatch' 
    runs-on: ubuntu-latest
    # Install (8 min) plus 228 episodes divided by the concurrency plus two imports plus the reading. Generous
    # rather than tight: a step killed mid-grid writes no document and the money is spent.
    timeout-minutes: 150
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAU_VERSION: ${{ vars.TAU_VERSION }}
      TAU_MODEL: ${{ vars.TAU_MODEL || 'deepseek/deepseek-flash' }}
      TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
      BOARD_ARMS: ${{ github.event.inputs.arms || 'placement' }}
      BOARD_TASKS: ${{ github.event.inputs.tasks }}
      BOARD_TRIALS: ${{ github.event.inputs.trials || '1' }}
      BOARD_K: ${{ github.event.inputs.k || '1' }}
      BOARD_SEED: ${{ github.event.inputs.seed || '400' }}
      BOARD_MAX_STEPS: ${{ github.event.inputs.max_steps || '100' }}
      BOARD_CONCURRENCY: ${{ github.event.inputs.concurrency || '3' }}
      BOARD_DIR: eval/results/working-memory
    steps:
      - uses: actions/checkout@v4

      - name: Require the provider key before the first call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::DEEPSEEK_API_KEY is not configured for this repository"
            exit 1
          fi

      - name: The population this dispatch will run
        # Every task the bank holds, read from the bank rather than retyped. `114` is the number the floor of the
        # grid is computed from, so it is printed here and asserted in the reading.
        run: |
          set -euo pipefail
          TASKS="${BOARD_TASKS}"
          if [ -z "${TASKS}" ]; then
            TASKS="$(python3 -c "
          import json
          simulations = json.load(open('eval/manifests/note-bank-baseline.json'))['simulations']
          print(','.join(sorted({str(entry['task_id']) for entry in simulations}, key=int)))
          ")"
          fi
          COUNT="$(python3 -c "print(len([t for t in '${TASKS}'.split(',') if t]))")"
          echo "BOARD_TASK_LIST=${TASKS}" >> "$GITHUB_ENV"
          echo "${COUNT} task(s) in this population" >> "$GITHUB_STEP_SUMMARY"

      - name: Does the whole job fit in the off-peak window?
        run: |
          set -euo pipefail
          MINUTES="$(python3 -c "
          tasks = len([entry for entry in '${BOARD_TASK_LIST}'.split(',') if entry])
          trials = int('${BOARD_TRIALS}')
          # `interleave` is two arms as well, and its own driver is what divides the grid: an estimate that read it
          # as one arm would arm the window guard with half the run it is guarding.
          arms = {'three': 3, 'both': 2, 'pair': 2, 'interleave': 2, 'admission': 2}.get('${BOARD_ARMS}', 1)
          concurrency = max(1, int('${BOARD_CONCURRENCY}'))
          # R218e. `dose` is one arm run **twice**: `--rounds 2` is what makes the attempt index recoverable, so the
          # grid is two passes and an estimate that read the dispatch's name as one arm would arm the window guard
          # with half the run it is guarding.
          passes = 2 if '${BOARD_ARMS}' == 'dose' else 1
          print(int((arms * passes * tasks * trials * 26) / concurrency / 60) + 9 + 1)
          ")"
          echo "estimated ${MINUTES} min for this grid" >> "$GITHUB_STEP_SUMMARY"
          python3 eval/drivers/tau2/note_pilot.py --window-minutes "${MINUTES}"

      - name: Cache the tau2 environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tau2-bench
          key: tau2-${{ vars.TAU_VERSION }}-${{ runner.os }}

      - name: Install tau2-bench at the pinned ref
        run: |
          set -euo pipefail
          REF="${TAU_VERSION:-v1.0.1}"
          if [ ! -d .tau2-bench/.git ]; then
            git clone --depth 1 --branch "$REF" https://github.com/sierra-research/tau2-bench .tau2-bench \
              || { echo "tau2-clone-failed:$REF"; exit 21; }
          fi
          cd .tau2-bench
          python -m pip install --upgrade pip uv
          uv sync || { echo "tau2-sync-failed:$REF"; exit 22; }
          uv pip install mcp || { echo "tau2-mcp-missing:$REF"; exit 24; }
          uv run tau2 check-data || { echo "tau2-data-missing:$REF"; exit 23; }

      - name: The provider accepts a block behind the conversation, on a history it produced itself
        # R216. The tail placement is the first change in this lane that puts a message of *its own* into
        # `state.messages` rather than the system block, and a provider that refuses it would fail every episode of
        # the grid — 114 chances to learn something one call can say.
        #
        # **This step has now been wrong three times, and the three failures were three different lessons.**
        #
        # R216-1: it built the conversation out of *user* turns — `system, user, system, user` — and passed minutes
        # before the tail arm died on 94 of 114 episodes with `An assistant message with 'tool_calls' must be
        # followed by tool messages`. A τ² episode is almost entirely `assistant(tool_calls)` then `tool(result)`.
        #
        # R216b, first attempt: rebuilt on that shape with a hand-written assistant turn, it failed with `The
        # reasoning_content in the thinking mode must be passed back to the API` — `deepseek-flash` answers in
        # thinking mode unless told otherwise, and a fabricated turn has no `reasoning_content` to give back. **A
        # history the provider did not produce is a history the provider will not accept.**
        #
        # R216b, second attempt: rebuilt on a *real* turn, it failed with `Thinking mode does not support this
        # tool_choice` — so the tool could not be forced either.
        #
        # The shape that survives all three constraints is the one the dispatch actually uses: thinking on, tool
        # choice left to the model, history produced by the provider. And because a smoke test that is all-or-nothing
        # cannot say what it verified, this one **reports which placement it covered**. If the model declines to
        # call the tool, the step still checks the placement a τ² conversation spends most of its turns in — a
        # `system` turn after an assistant turn — and says in its own output that the tool-call adjacency was not
        # covered, so a reader is never told more than was tested.
        run: |
          set -euo pipefail
          PYTHON="${GITHUB_WORKSPACE}/.tau2-bench/.venv/bin/python"
          MODEL="${TAU_MODEL}"
          "${PYTHON}" - "$MODEL" <<'PY'
          import sys

          import litellm

          model = sys.argv[1]
          block = "<microglia-board>\nOpen asks from the request:\n[ ] return: desk lamp\n</microglia-board>"
          tools = [{
              "type": "function",
              "function": {
                  "name": "get_order",
                  "description": "Look one order up by id.",
                  "parameters": {"type": "object", "properties": {"id": {"type": "string"}}, "required": ["id"]},
              },
          }]
          head = [
              {"role": "system", "content": "You are a support agent. You must use the get_order tool; do not answer "
                                            "from memory."},
              {"role": "user", "content": "Where is order 42? Call get_order with id 42 before saying anything."},
          ]

          first = litellm.completion(model=model, messages=head, tools=tools, max_tokens=128, temperature=0)
          assert first.choices, first
          turn = first.choices[0].message
          # Keep every field the provider returned: `reasoning_content` is one of them, and dropping it is exactly
          # the failure this step spent an attempt discovering.
          assistant = {k: v for k, v in turn.model_dump().items() if v is not None}

          if getattr(turn, "tool_calls", None):
              call_id = assistant["tool_calls"][0]["id"]
              result = {"role": "tool", "tool_call_id": call_id, "content": "{\"status\": \"shipped\"}"}
              placed = head + [assistant, result, {"role": "system", "content": block}]
              split = head + [assistant, {"role": "system", "content": block}, result]
              covered = "a tool result"
          else:
              # The model answered in text. The placement is still checked, on the turn it did produce.
              placed = head + [assistant, {"role": "system", "content": block},
                               {"role": "user", "content": "And the desk lamp?"}]
              split = head + [{"role": "user", "content": "And the desk lamp?"}]
              covered = None

          reply = litellm.completion(model=model, messages=placed, tools=tools, max_tokens=32, temperature=0)
          assert reply.choices, reply
          print(f"ok  {model} accepted the block behind the conversation: {reply.choices[0].message.content!r}")
          if covered:
              print("ok  the placement was covered with a real tool call and its result")
          else:
              print("NOTE the model answered without calling the tool, so tool-call adjacency was NOT covered; "
                    "the placement was still checked after a real assistant turn")

          if covered:
              try:
                  litellm.completion(model=model, messages=split, tools=tools, max_tokens=32, temperature=0)
                  print("note  the provider tolerated a system turn between a call and its result; tail_index is "
                        "then belt and braces rather than load-bearing")
              except Exception as error:
                  print(f"note  as expected, the block between a call and its result is refused: "
                        f"{type(error).__name__}")
          PY

      - name: One invocation per arm, the whole population, the same seeds
        # The sidecar's identity was why earlier rounds ran one task per process. This arm has no sidecar: the board
        # is computed from the episode, so the population runs inside one `run_tasks` call and the 114 imports
        # earlier rounds paid for are one. What must not change between the arms is the seed, the task order and the
        # model — all three are arguments here and not defaults.
        env:
          TAU_CONCURRENCY: ${{ github.event.inputs.concurrency || '3' }}
          TAU_RETRIES: '4'
        run: |
          set -euo pipefail
          PYTHON="${GITHUB_WORKSPACE}/.tau2-bench/.venv/bin/python"
          test -x "$PYTHON" || { echo "tau2-venv-missing"; exit 25; }
          mkdir -p "${BOARD_DIR}"

          run_arm () {
            local arm="$1"; shift
            "${PYTHON}" eval/drivers/tau2/run_split.py \
              --phase eval --agent microglia_agent --domain retail \
              --tasks "${BOARD_TASK_LIST}" --trials "${BOARD_TRIALS}" \
              --max-steps "${BOARD_MAX_STEPS}" --seed "${BOARD_SEED}" --require-off-peak \
              --out "${BOARD_DIR}/${arm}.json" "$@" \
              > "${BOARD_DIR}/${arm}.log" 2>&1
          }

          case "${BOARD_ARMS}" in
            interleave)
              # R218c. Two arms that are the same code, run **block by block**: block 0 on `control-a`, then block 0
              # on `control-b`, then block 1. Thirty invocations of eight tasks, each its own process — a shared
              # process would make the two arms share one token counter and one client, and the preregistration
              # names "a delta of exactly zero on every task" as the state that would prove it.
              #
              # `--resume` is on because a transient provider failure at block 11 must not re-buy blocks 0 to 10:
              # an invocation writes its document at the end, so a part on disk is a part that completed.
              "${PYTHON}" eval/drivers/tau2/interleave.py --run \
                --tasks "${BOARD_TASK_LIST}" --chunk 8 \
                --dir "${BOARD_DIR}" \
                --python "${PYTHON}" \
                --seed "${BOARD_SEED}" --trials "${BOARD_TRIALS}" --max-steps "${BOARD_MAX_STEPS}" \
                --concurrency "${BOARD_CONCURRENCY}" \
                --require-off-peak --resume
              ;;
            three)
              # R216. Three arms, in this order and for this reason: the control is the world nobody has touched,
              # `front` is the **parser** under R215's placement, and `tail` adds the placement. The two contrasts
              # are then one change each — front − control is what the three parser repairs are worth, tail − front
              # is what moving the block buys — which is the decomposition this round exists to make. A two-arm
              # grid would have reported their sum and nothing about which half it came from.
              run_arm control
              run_arm front --note-source board-front
              run_arm board --note-source board
              ;;
            placement)
              # R216b. **The contrast that is new, and only it.** `front` is R216's parser under R215's placement;
              # `board` moves the block behind the conversation. `tail - front` is the price of the move, which is
              # the one number R216's first dispatch could not read because the tail arm died at the provider.
              #
              # No control arm, and the reason is arithmetic rather than taste: `control -> front` is the price of
              # the three parser repairs, it was measured inside R216's first dispatch (+7.9 pp), and a second
              # measurement of it is 114 episodes bought to confirm a number this round does not read. Cross-
              # dispatch comparison is not available either - R216 found the same arm turning over 22% of its tasks
              # between two dispatches, so the confirmation would not be one.
              run_arm front --note-source board-front
              run_arm board --note-source board
              ;;
            pair)
              # R218b. The two arms the reliability question needs, at whatever `trials` the dispatch asks for: the
              # control is the world nobody touched, `front` is the repaired parser under R215's placement. No tail —
              # the placement has its own price from R216, and paying for it again would be paying for a number this
              # round does not read.
              run_arm control
              run_arm front --note-source board-front
              ;;
            both)
              # Control first. The two arms are one measurement, and a control written after the board would be a
              # control run in a world the board had already spent forty minutes in.
              run_arm control
              run_arm board --note-source board
              ;;
            admission)
              # R219. **One variable.** `board` is the shipped configuration — the tail placement, the block as R218b
              # measured it — and `policy` is that same block under the admission rule: the asks and their ticks,
              # and neither refusal line. The contrast is the rule and nothing else, which is why the placement, the
              # parser, the model and the grid are held fixed by construction rather than by argument.
              #
              # The reason the rule exists is a measurement, not a preference: over R218b's 456 episodes the two
              # refusal lines name a family the task requires a write in on 1,808 of 1,965 entries (92.0%), so the
              # block spends nine tenths of its accusations telling the agent it did something nobody asked for on a
              # task where somebody did. `goal_board.py --accusations` reads that off an artefact for free.
              run_arm board --note-source board
              run_arm policy --note-source board-policy
              ;;
            board) run_arm board --note-source board ;;
            policy) run_arm policy --note-source board-policy ;;
            dose)
              # R218e. **One arm, two rounds, and the rounds are the treatment.** The question is inside one task:
              # did the attempt that received more material pass more often than the sibling that received less? A
              # single round answers it with `NO_PAIRS` by construction — one attempt a task leaves nothing to
              # compare — so the grid is 114 tasks × 2 rounds, and `--rounds` is not an economy: it is what makes
              # the attempt index recoverable (`merge_rounds` writes the round as `trial`, and the agent's recording
              # is partitioned by the runner's snapshot after each round). `--trials 2` would have run both attempts
              # concurrently in one `run_tasks` call, and the join would then have had to guess which of two
              # simultaneous episodes made which record (AUDIT 34.262).
              run_arm board --note-source board --rounds 2
              ;;
            *)     run_arm control ;;
          esac

      - name: The mechanism, before the rate
        # R218c's grid is two arms of the same code: it has no board, no parser arm and no contrast to take, and
        # the placebo's own step reads it. Gated on the dispatch rather than on a filename that would not exist.
        if: env.BOARD_ARMS != 'interleave'
        # R216. Four readings, in the order that decides whether an accuracy number is about the treatment at all:
        # the cadence (how often the block is re-written), the placement (how often the prompt is written at all), the
        # price (the bill per episode), and the attribution (does a tick ever happen). R215's 3-point cache bar was a
        # bar no correct implementation could clear — 114 of its 247 changes were cold starts — so the price is
        # asserted on the bill, which is the quantity the bar was a proxy for.
        run: |
          set -euo pipefail
          python3 - "${BOARD_DIR}" <<'PY'
          import json, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          summary = {}
          for path in sorted(root.glob("*.log")):
              for line in path.read_text(errors="replace").splitlines():
                  if line.startswith('{"phase"'):
                      summary[path.stem] = json.loads(line)
          per_episode = {}
          episodes = usd = 0.0
          alive = {}
          for path in sorted(root.glob("*.json")):
              document = json.loads(path.read_text())
              simulations = document.get("simulations") or []
              count = len(simulations)
              arm_usd = sum((s.get("agent_cost") or 0) + (s.get("user_cost") or 0) for s in simulations)
              episodes += count
              usd += arm_usd
              per_episode[path.stem] = arm_usd / count if count else 0.0
              # Liveness: an episode with no messages never reached the model. R216's first dispatch reported 94 of
              # 114 like that in one arm and the counters looked *healthy* — because a broken arm is a cheap one.
              alive[path.stem] = sum(1 for s in simulations if s.get("messages"))
              print(f"{path.stem}: {count} episode(s), {alive[path.stem]} with messages, ${arm_usd:.4f}")
          print(f"total {int(episodes)} episode(s), ${usd:.4f} ≈ ¥{usd * 7.2:.1f}")
          for arm, live in alive.items():
              assert live >= 0.95 * max(alive.values()), (
                  f"{arm} reached the model on {live} of {max(alive.values())} episode(s): the arm did not run")

          board = (summary.get("board") or {}).get("diagnostics", {}).get("memory", {}).get("board") or {}
          front = (summary.get("front") or {}).get("diagnostics", {}).get("memory", {}).get("board") or {}
          # R218b dispatches `pair`, which has no tail arm: the assertions below belong to the arm that was run, so
          # they are gated on its presence rather than on the dispatch's name. A grid that contains both arms runs
          # both blocks exactly as before.
          assert board or front, "no arm wrote counters: the mechanism did not run"
          if board:
            renders = board.get("renders") or 0
            assert renders > 0, "the board was served on no turn"
            share = (board.get("changes") or 0) / renders
            mean_chars = board.get("charsMean") or 0
            mean_open = (board.get("open") or 0) / renders
            appends, held = board.get("tailAppends") or 0, board.get("tailHeld") or 0
            print(f"board: {renders} render(s), {board.get('changes')} change(s) ({share:.0%}), "
                  f"{appends} append(s), {held} held, {mean_chars:.0f} chars a turn, {mean_open:.1f} open ask(s)")
            assert board.get("placement") == "tail", f"the arm ran the {board.get('placement')!r} placement"
            assert mean_chars <= 500, f"the block is {mean_chars:.0f} characters a turn"
            assert mean_open <= 3.0, f"{mean_open:.1f} open asks a turn: this is a list of everything, not a contract"
            # The cadence bar belongs to the **front** arm and only to it: a block in the system message that moves
            # re-buys the prompt, so a change rate above a third is a prefix that cannot survive. Behind the
            # conversation a change costs the messages after the old position, so applying that bar here would fail a
            # mechanism working as specified — R215's 3-point cache bar, one round later (AUDIT 34.226).
            # The placement's own reading: a write per change at most, and at least one turn that found the block
            # already in place. An arm with `held == 0` re-wrote the block on every turn — R215's bill with a smaller
            # constant — and an arm with no appends served nothing at all.
            assert appends > 0, "the block was never written into the prompt"
            assert appends <= (board.get("changes") or 0), (appends, board.get("changes"))
            assert held > 0, "no turn found the block already in place: it is being re-written every turn"

          policy = (summary.get("policy") or {}).get("diagnostics", {}).get("memory", {}).get("board") or {}
          if board and policy:
            # R219. The one variable this round changed, asserted on the counters rather than trusted from the flag
            # that was passed. A policy arm reporting `all` is the rule never having been applied, and the reading
            # would then be a null about a treatment that did not run — the wiring defect this lane has counted six
            # times, and the one an accuracy delta cannot distinguish from a real null.
            assert policy.get("admission") == "state", policy.get("admission")
            assert board.get("admission") == "all", board.get("admission")
            assert policy.get("placement") == "tail", policy.get("placement")
            assert (policy.get("renders") or 0) > 0, "the policy arm served no turn"
            # A rule that removes two lines cannot lengthen the block. This is an invariant rather than the registered
            # prediction (5-25% shorter): it fails only if the renderer kept the lines, which is a different defect.
            assert (policy.get("charsMean") or 0) <= (board.get("charsMean") or 0), (
                f"the rule made the block longer: {policy.get('charsMean')} against {board.get('charsMean')}")
            print(f"policy: {policy.get('renders')} render(s), {policy.get('charsMean')} chars a turn against "
                  f"board's {board.get('charsMean')}, admission {policy.get('admission')!r}")

          if front:
              # The parser arm's own counters, which must show the other placement: a run where both arms report
              # the same placement is a dispatch that passed the same flag twice.
              assert front.get("placement") == "front", front.get("placement")
              front_renders = front.get("renders") or 0
              assert front_renders > 0, "the parser arm served no turn"
              front_share = (front.get("changes") or 0) / front_renders
              front_chars = front.get("charsMean") or 0
              print(f"front: {front_renders} render(s), {front.get('changes')} change(s) ({front_share:.0%}), "
                    f"{front_chars:.0f} chars a turn")
              assert front_chars <= 500, front_chars
              # Here, and only here, the cadence is the price: this arm writes into the system message, so every
              # change re-buys the prompt behind it.
              assert front_share <= 1 / 3, (
                  f"the parser arm's block changed on {front_share:.0%} of turns: at the front of the prompt that "
                  "re-bills every token after it")
          # The baseline is the control when one was run and the parser arm when it was not. R216b dispatches
          # `placement`, whose baseline is `front`: the question there is what moving the block costs **the parser
          # arm**, and comparing it to a control that was never run would have been an assertion that silently did
          # not execute - a cost bar that passes by not looking.
          # R219. The contrast this dispatch prices: the rule against the arm it is a rule about, both behind the
          # conversation at the same seed and the same 114 tasks. It is written as its own branch rather than by
          # renaming the baseline, because `board` is the treated arm in one dispatch and the baseline in the other
          # and a name that means both is how a bill gets compared to itself.
          if per_episode.get("policy") and per_episode.get("board"):
              ratio = per_episode["policy"] / per_episode["board"]
              print(f"bill per episode: board ${per_episode['board']:.5f}, policy ${per_episode['policy']:.5f} "
                    f"({100 * (ratio - 1):+.0f}%)")
              assert 0.80 <= ratio <= 1.20, (
                  f"the policy arm's bill is {100 * (ratio - 1):+.0f}% of the board's; a block with two lines fewer "
                  "behind the conversation cannot cost 20% more, and a large negative is a run that did not happen")
          baseline_name = "control" if per_episode.get("control") else "front"
          baseline, treated = per_episode.get(baseline_name), per_episode.get("board")
          if baseline and treated and baseline_name != "board":
              ratio = treated / baseline
              print(f"bill per episode: {baseline_name} ${baseline:.5f}, board ${treated:.5f} ({100 * (ratio - 1):+.0f}%)")
              # A **band**, not a ceiling. R216's first dispatch passed a one-sided bar at 0.16 of the control's
              # bill, which is not a cheap arm but an arm that stopped early (AUDIT 34.231). A cost bar has to be
              # two-sided or it rewards the failure it was written to price.
              assert 0.80 <= ratio <= 1.20, (
                  f"the arm's bill is {100 * (ratio - 1):+.0f}% of the {baseline_name}'s; the registered band is -20% to "
                  "+20%, and a large negative is a run that did not happen")
          PY

      - name: The attribution, which is the mechanism and not the accuracy
        # R218c's grid is two arms of the same code: it has no board, no parser arm and no contrast to take, and
        # the placebo's own step reads it. Gated on the dispatch rather than on a filename that would not exist.
        if: env.BOARD_ARMS != 'interleave'
        # R216. A board that lists asks and ticks none is a static list, and R215 shipped exactly that: **32.7%** of
        # its writing episodes ended with a tick against a 60% bar. The parser's replay over R215's own document says
        # the three repairs in this round take it to **69.2%** — measured before the dispatch, for free, which is what
        # `--replay` exists for (PROGRESS 245.3). This step is the same measurement on the new artefact, and it is a
        # gate because a ratio quoted from a document is a number nobody re-ran.
        run: |
          set -euo pipefail
          # R218b dispatches `pair`, whose parser arm is `front`; R216's grid has both. The replay runs on the arm
          # that exists rather than on a filename the dispatch name implies.
          TARGET="${BOARD_DIR}/board.json"
          [ -f "${TARGET}" ] || TARGET="${BOARD_DIR}/front.json"
          python3 eval/tools/goal_board.py --replay "${TARGET}"
          python3 eval/tools/goal_board.py --replay "${TARGET}" --json \
            > "${RUNNER_TEMP}/replay.json"
          python3 - "${RUNNER_TEMP}/replay.json" <<'PY'
          import json, sys

          reading = json.load(open(sys.argv[1]))
          assert reading["writing"] > 0, "no episode made a state-changing call: this is not a board reading"
          assert reading["skipped"] == 0, (
              f"{reading['skipped']} episode(s) carried no messages: the arm did not reach the model")
          share = reading["tickShare"]
          assert share is not None and share >= 0.60, (
              f"{share:.1%} of writing episodes ended with a tick; the registered bar is 60%")
          # The grades, so the reading says which rule produced its ticks. A run whose ticks are mostly loose is a
          # reading about a looser rule than the registered one, and it has to be visible rather than inferred.
          print(f"ok  {reading['ticked']}/{reading['writing']} ticked ({share:.1%}), "
                f"{reading['loose']} loose of {reading['settled']} settled, {reading['absorbed']} absorbed, "
                f"{reading['unrequested']} unrequested, {reading['unattributed']} unattributed")
          PY

      - name: The paired reading
        # R218c's grid is two arms of the same code: it has no board, no parser arm and no contrast to take, and
        # the placebo's own step reads it. Gated on the dispatch rather than on a filename that would not exist.
        # R218e's `dose` dispatch has one arm and no contrast either: its reading is the recording, below.
        if: env.BOARD_ARMS != 'interleave' && env.BOARD_ARMS != 'dose'
        # Three contrasts, one change each. `tail − control` is the round's registered endpoint; `front − control` is
        # what the three parser repairs are worth under R215's placement; `tail − front` is what the placement buys.
        # A two-arm grid could only have reported the sum, and the sum is the number that cannot be acted on.
        run: |
          set -euo pipefail
          TREATED="${BOARD_DIR}/board.json"
          [ -f "${TREATED}" ] || TREATED="${BOARD_DIR}/front.json"
          # The left arm is the control when the dispatch has one. R216b's `placement` grid starts at the parser
          # arm, because its question is `tail - front`; naming a control file that was never written would have
          # made `set -e` kill the reading after the money was spent.
          BASE="${BOARD_DIR}/control.json"
          [ -f "${BASE}" ] || BASE="${BOARD_DIR}/front.json"
          # R219. The `admission` grid has neither: its contrast is `policy - board`, the shipped arm against the
          # same arm under the rule. The first dispatch of it died **here**, after the money was spent and the
          # documents were uploaded — the fifth place in this file where an arm was named rather than looked for, and
          # the reason this branch exists instead of a comment saying the fallback is safe. `policy.json` is looked
          # for by name because it is the one arm whose absence would make the reading a comparison of an arm with
          # itself.
          if [ -f "${BOARD_DIR}/policy.json" ]; then
            BASE="${BOARD_DIR}/board.json"
            TREATED="${BOARD_DIR}/policy.json"
          fi
          python3 eval/tools/goal_board.py \
            --compare "${BASE}" "${TREATED}" --k "${BOARD_K}" | tee "${RUNNER_TEMP}/reading.txt"
          python3 eval/tools/goal_board.py \
            --compare "${BASE}" "${TREATED}" --k "${BOARD_K}" --json \
            > "${RUNNER_TEMP}/reading.json"
          if [ -f "${BOARD_DIR}/front.json" ] && [ -f "${BOARD_DIR}/board.json" ]; then
            # The parser's own price needs a control, and a `placement` grid does not run one. R216b found this the
            # expensive way: the guard above fell back to `front` and the reading worked, then this block opened
            # `control.json` **by name** and the step died after $1.3007 had been spent — the third place in this
            # file where an arm was named rather than looked for.
            if [ -f "${BOARD_DIR}/control.json" ]; then
              echo "--- the parser, under R215's placement ---"
              python3 eval/tools/goal_board.py --compare "${BOARD_DIR}/control.json" "${BOARD_DIR}/front.json" \
                --k "${BOARD_K}"
            else
              echo "--- no control arm in this dispatch: the parser's price is R216-1's reading, not this one's ---"
            fi
            echo "--- the placement, with the parser held ---"
            python3 eval/tools/goal_board.py --compare "${BOARD_DIR}/front.json" "${BOARD_DIR}/board.json" \
              --k "${BOARD_K}"
          fi
          python3 - "${RUNNER_TEMP}/reading.json" <<'PY'
          import json, sys

          reading = json.load(open(sys.argv[1]))
          # The grid is the claim. A reading over half the population is a reading about a different experiment, and
          # the floor it is quoted against is a function of the count.
          assert reading["tasks"] >= 100, reading["tasks"]
          assert reading["unpaired"] == 0, reading["unpaired"]
          print(f"ok  paired over {reading['tasks']} task(s)")
          PY

      - name: The dose, which is the whole round
        # R218e. Three claims, and they are ordered by what they are about: the **recording** exists and covers the
        # grid, the **recording agrees with the phase's own counters**, and only then what the pairs say. The first
        # two are invariants and gate the build; the third is a prediction and is printed, because R216's one-sided
        # cost bar taught this lane what a red job for a refuted prediction costs — an operator who reruns until the
        # grid is green. `NO_PAIRS` here is a refutation of the premise (a dose that does not vary inside a task) and
        # it is reported as a warning with the number that would have been hidden by a pass.
        if: env.BOARD_ARMS == 'dose'
        run: |
          set -euo pipefail
          TARGET="${BOARD_DIR}/board.json"
          SIDECAR="${BOARD_DIR}/board.dose.jsonl"
          python3 - "${BOARD_DIR}" <<'PY'
          import json, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          lines = [line for line in (root / "board.log").read_text(errors="replace").splitlines()
                   if line.startswith('{"phase"')]
          assert lines, "the phase wrote no census: the run did not finish"
          phase = json.loads(lines[-1])
          dose = (phase.get("diagnostics") or {}).get("dose")
          board = ((phase.get("diagnostics") or {}).get("memory") or {}).get("board") or {}
          assert dose is not None, "no dose block: the arm served no board, or the recording was not written"
          # The join, before the numbers it produces. A refusal means the recording could not be attributed, and an
          # accuracy-shaped reading taken over a refused join is the defect this step exists to make impossible.
          assert dose["refused"] is None, f"the join refused: {dose['refused']}"
          assert dose["identity"] == "round", f"the attempts were {dose['identity']!r}, not one a round"
          # 114 tasks twice: a short grid is a different experiment and its floor is a function of the count.
          assert dose["rows"] == dose["episodes"], (dose["rows"], dose["episodes"])
          assert dose["rows"] >= 220, dose["rows"]
          # The recording against the counters that were produced independently of it. These three are the reason
          # the sidecar is worth a round: a recording that disagrees with the census describes an episode that is not
          # the one it says it describes, and every per-episode attribution downstream would inherit the error.
          assert dose["agreesRenders"], (dose["totals"]["renders"], board.get("renders"))
          assert dose["agreesChars"], (dose["totals"]["chars"], board.get("charsTotal"))
          assert dose["agreesChanges"], (dose["totals"]["changes"], board.get("changes"))
          # A block held rather than re-written cannot be carried twice, so carried <= served on any placement, and
          # the two are equal only on the front one.
          assert dose["totals"]["written"] <= dose["totals"]["chars"], dose["totals"]
          assert board.get("placement") == "tail", board.get("placement")
          print(f"ok  {dose['rows']} row(s) over {phase['tasks']} task(s) in {phase['trials']} round(s), "
                f"{dose['totals']['chars']} characters served, {dose['totals']['written']} carried "
                f"({dose['writtenOfServed']:.0%}), {dose['totals']['changes']} change(s) over "
                f"{dose['totals']['renders']} render(s)")
          PY
          python3 eval/verifiers/board_dose.py --document "${TARGET}" --sidecar "${SIDECAR}" \
            | tee "${RUNNER_TEMP}/dose.txt"
          python3 eval/verifiers/board_dose.py --document "${TARGET}" --sidecar "${SIDECAR}" --json \
            > "${RUNNER_TEMP}/dose.json"
          python3 - "${RUNNER_TEMP}/dose.json" <<'PY'
          import json, sys

          reading = json.load(open(sys.argv[1]))
          # The recording arrived: this is the state R218d could not reach on any artefact, because a τ² transcript
          # holds no system message for a block to be in.
          assert reading["state"] != "NO_SYSTEM", reading["state"]
          assert reading["source"] == "sidecar", reading["source"]
          coverage = reading.get("coverage") or {}
          assert coverage.get("rows", 0) >= 220, coverage
          # Every row met its episode: a row the document does not score, or a trial the join withheld, is a row
          # that cannot be paired and the reading would be over a population nobody chose.
          assert coverage.get("unscored") == 0, coverage
          assert coverage.get("unordered") == 0, coverage
          print(f"::notice title=R218e dose::{reading['state']}, {reading['episodesWithDose']} of "
                f"{reading['episodes']} episode(s) carried a block, {reading['doseCharsMean']:.0f} characters an "
                f"episode, {reading.get('pairs', 0)} task(s) split into a higher and a lower dose")
          if reading["state"] != "DOSE_READ":
              # A finding, not a build failure: the material does not vary inside a task, or it varies and no task
              # produced an attempt on each side. Both refute the premise rather than the recording.
              print(f"::warning title=R218e::the recording is complete and agrees with the census, and it reads "
                    f"{reading['state']} — there is no within-task comparison to make")
          PY

      - name: The placebo reading
        # R218c. Four endpoints, in the order the preregistration lists them: the delta inside five points, the
        # moved and broke counts within two tasks of each other, the bill per episode inside ten percent, and — the
        # one that is a failure of the *instrument* rather than of the treatment — at least one task where the two
        # arms disagree, because two processes on one grid always do.
        #
        # The **invariants** are gates and the **prediction** is printed. That split is deliberate and it is the
        # lesson of R216's one-sided cost bar (AUDIT 34.231): a red job for a refuted prediction teaches an operator
        # to rerun until the grid is green, which is the opposite of what a placebo is for. So an unpaired arm, a
        # short grid or a grid whose arms never disagree fails the build; "GRID_ORDERED" is a finding.
        if: env.BOARD_ARMS == 'interleave'
        run: |
          set -euo pipefail
          python3 eval/drivers/tau2/interleave.py --read --dir "${BOARD_DIR}" | tee "${RUNNER_TEMP}/reading.txt"
          python3 eval/drivers/tau2/interleave.py --read --dir "${BOARD_DIR}" --json \
            > "${RUNNER_TEMP}/placebo.json"
          python3 - "${RUNNER_TEMP}/placebo.json" <<'PY'
          import json, sys

          reading = json.load(open(sys.argv[1]))
          # Every task twice. A grid of 106 that reads like a grid of 114 is the failure every reader downstream is
          # built to trust: `unpaired == 0` says the arms agree, not that the plan was met.
          assert reading["tasks"] >= 100, reading["tasks"]
          assert reading["unpaired"] == 0, reading["unpaired"]
          for arm in ("control-a", "control-b"):
              assert reading["episodes"][arm] >= 100, reading["episodes"]
          # The gap is what the round buys, so a run that did not measure one did not do the round. It is the
          # **separation** — how far apart the two readings of a task began — and not the handover between one
          # invocation and the next, which is zero by construction: the first version of this gate read the handover
          # and reported 0.0 s over 15 blocks (AUDIT 34.256).
          assert reading["gapSeconds"]["blocks"] >= 10, reading["gapSeconds"]
          separation = reading["gapSeconds"]["separation"]["median"]
          assert separation is not None and separation >= 30, (
              f"the two readings of a task began {separation} s apart: a block that ran in under thirty seconds "
              "means the population was not the one the plan named"
          )
          assert reading["moved"] + reading["broke"] > 0, "the arms disagree on no task at all"
          print(f"ok  {reading['tasks']} task(s) twice, {reading['moved']} moved and {reading['broke']} broke, "
                f"median gap {reading['gapSeconds']['median']}s")
          seen = reading.get("resolution") or {}
          print(f"::notice title=R218c placebo::{reading['state']}, delta {reading['deltaPp']:+.2f} pp, "
                f"bills {reading['billLeft']:.5f} against {reading['billRight']:.5f} an episode, "
                f"{seen.get('discordanceRate', 0):.1%} turnover, resolves {seen.get('detectablePp')} pp at 80% power")
          if reading["state"] != "PLACEBO_HELD":
              # A finding, and the loudest one this lane can produce: every contrast measured on this grid is then
              # a contrast about the order rather than about the material.
              print(f"::warning title=R218c::the two identical arms read {reading['state']} — no contrast measured "
                    "inside one dispatch of this grid is publishable until the interleave is the default")
          PY

      - name: Upload the documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: working-memory
          path: |
            eval/results/working-memory/*.json
            eval/results/working-memory/*.jsonl
            eval/results/working-memory/*.log
            eval/results/working-memory/parts/*.json
            eval/results/working-memory/parts/*.log
          if-no-files-found: warn

      # R218b lost its reading twice at the transport: the artifact is served only through a redirect to a blob host
      # that rejects a forwarded `Authorization` (401), and the job-log endpoint answers 403 for this token. A $4.68
      # result that can only be read by someone who knows to strip a header is a result one person can read.
      #
      # So the round's numbers are also published as **annotations**, which `api.github.com` serves directly
      # (`GET /repos/{owner}/{repo}/check-runs/{id}/annotations`) with no redirect and no extra permission. The
      # upload above stays: it carries the documents, this carries the sentence.
      - name: Publish the reading where the API can read it
        if: always()
        run: |
          set -euo pipefail
          READING="${RUNNER_TEMP}/reading.txt"
          if [ -f "${READING}" ]; then
            # One annotation, 60 lines at most: a notice is a summary, and the document is the evidence.
            head -c 20000 "${READING}" | while IFS= read -r line; do
              [ -n "${line}" ] && echo "::notice title=working-memory reading::${line}"
            done
          else
            echo "::warning title=working-memory reading::no reading was written; the documents are the artifact"
          fi
          python3 - "${BOARD_DIR}" <<'PY'
          import json, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          for path in sorted(root.glob("*.json")):
              document = json.loads(path.read_text())
              simulations = document.get("simulations") or []
              usd = sum((s.get("agent_cost") or 0) + (s.get("user_cost") or 0) for s in simulations)
              print(f"::notice title={path.stem} bill::{len(simulations)} episode(s), ${usd:.4f}")
          PY

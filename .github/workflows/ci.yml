name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, test, audit, study
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

      - name: Typecheck the lane CLIs
        # The lanes' entry points are excluded from the composite build — `packages/*/tsconfig.json`
        # lists `src/bin` under `exclude`, because they are processes rather than library surface and
        # they resolve with `nodenext` rather than through the path aliases — so `pnpm build` above
        # does not see them and coverage does not either. `pnpm typecheck` chains this second compiler
        # run, which is why the local entry point and these two steps now check the same files: a
        # `metrics` field typed as a number and written as a string passed every local gate and failed
        # here twice (`9f63398`), and the difference was this line.
        run: pnpm typecheck:lanes

      - name: Tests with coverage gates
        run: pnpm test

      - name: Repository audit (source rules, manifests, published dependencies)
        run: pnpm audit:repo

      - name: Ablation study and gates
        run: pnpm bench

      # The library's "no runtime dependency" promise, measured on the artefact a
      # host bundles. The probe halves a ceiling and must be rejected: a budget
      # that cannot be exceeded is not a gate.
      - name: Bundle size (and the probe that proves it rejects)
        run: |
          set -euo pipefail
          pnpm bundle:size
          pnpm bundle:size -- --probe

      - name: Integrity lane (POC-28 order, determinism, schema drift)
        run: pnpm eval:integrity

      - name: Attack lane (POC-29 five formation routes)
        run: pnpm eval:memform

      - name: Pragmatics lane (L0 1,300-case rule-derived adjudication)
        run: pnpm eval:l0

      - name: Pair contrast lane (L2b single vs pair)
        run: pnpm eval:pairs

      # R110: the retrospection program itself, on a committed store. Its reader is covered to
      # 100/100/100/100, and `bin/` is excluded from coverage — so the wiring between the two is
      # checked by running it. The fixture's numbers are asserted by a test, which is what keeps this
      # step from passing on a fixture that stopped meaning what it says.
      - name: Retrospection lane (store dump → review batch)
        run: pnpm eval:retrospect-fixture

      # The L4 reader is exercised without the tau2 environment: a full grid must
      # score and a short grid must be refused rather than averaged. Both fixtures
      # are synthetic and say so in their `info` block.
      - name: Delivery lane (POC-19 signed, ordered, at-least-once)
        run: pnpm eval:delivery

      # The gate that re-derives instead of quoting: every pre-registration's declared gates must
      # equal the gates its artefact emitted, and every published cell is recomputed from the
      # committed run rather than trusted. It is what found a dev artefact named after the split
      # alone being overwritten by a second design on that split, which no schema check could see.
      - name: Protocol (pre-registrations, artefacts, published cells)
        run: pnpm eval:protocol

      - name: L4 reader (scores a full grid, refuses a short one)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/l4-score" TAU_RESULTS=eval/fixtures/tau2-synthetic-60x4.json pnpm eval:l4
          grep -q '"pass4": 1' "${RUNNER_TEMP}/l4-score/poc-l4.json"
          if POC_RESULT_DIR="${RUNNER_TEMP}/l4-refuse" TAU_RESULTS=eval/fixtures/tau2-synthetic-60x2.json pnpm eval:l4; then
            echo "the L4 reader scored a grid it must refuse"
            exit 1
          fi
          grep -q '"status_refused": 1' "${RUNNER_TEMP}/l4-refuse/poc-l4.json"
          # A driver variable that names a module which is not there is an absent
          # environment, not a failed measurement: exit 0, and say which variable.
          POC_RESULT_DIR="${RUNNER_TEMP}/l4-missing" TAU_DRIVER=./does-not-exist.mjs pnpm eval:l4
          grep -q '"status_driver_missing": 1' "${RUNNER_TEMP}/l4-missing/poc-l4.json"
          # A workflow variable that does not exist expands to the empty string, and
          # that must read as absent rather than as a path named ''.
          POC_RESULT_DIR="${RUNNER_TEMP}/l4-empty" TAU_RESULTS= TAU_DRIVER= pnpm eval:l4
          grep -q '"status_not_run": 1' "${RUNNER_TEMP}/l4-empty/poc-l4.json"

      # The second scenario, measured by the shared protocol rather than by three gates of its own.
      #
      # R52 changed what this step can assert, and the change is the point rather than a casualty.
      # τ²'s paired comparison at n = 68 resolves 21.41pp at 80% power, so the old gate — "the sample
      # must resolve 6pp" — failed here forever, for a reason no mechanism could fix. The gate now
      # grades the *claim*, and this pair claims nothing: it reports `UNRESOLVED` and `V5-resolution`
      # passes while still printing 21.41pp against the 6pp target.
      #
      # So the assertion moved from "the step exits non-zero" to "the run says which state it is in,
      # and the state it is in refuses the direction". A run that went green by claiming something it
      # could not resolve would still fail here, because the claim and the resolution are both read
      # out of the artefact and compared; a run that went green by *omitting* the claim would fail
      # too, since `claim: null` is a value the artefact has to carry.
      - name: τ² lane measured by the protocol (second-scenario conformance)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/tau2-protocol" \
            L4_FIRST=eval/results/history/l4-arm-reference-67.json \
            L4_SECOND=eval/results/history/l4-arm-memory-67.json \
            pnpm eval:l4-pair
          node -e "
            const a = require('${RUNNER_TEMP}/tau2-protocol/poc-l4-pair.json');
            const ids = a.protocol.evaluable;
            const resolution = a.gates.find((g) => g.id === 'V5-resolution');
            const resolved = a.gates.find((g) => g.id === 'l4-effect-resolved');
            const checks = [
              ['four gates fire', ids.length === 4],
              ['two of them are vacuous', a.protocol.vacuous.length === 2],
              ['thirty-six are absent', a.protocol.absent.length === 36],
              ['fourteen supplyable', a.protocol.supplyable === 14],
              ['twenty-six arm-indexed', a.protocol.armIndexed === 26],
              ['the resolution gate fired', resolution !== undefined],
              ['and it blocks', resolution.blocking === true],
              ['and it names the minimum detectable difference', resolution.actual.includes('21.41pp')],
              // R52: green here means the pair claimed nothing, and the artefact has to say so in
              // words. A run cannot pass by staying silent: silence is an absent field, and an
              // absent field is graded by the 6pp bar this sample cannot meet.
              ['and it passes because no direction was claimed', resolution.pass === true],
              ['which the sentence states', resolution.actual.includes('the run claims no direction')],
              ['the pair states its verdict', a.verdict.state === 'UNRESOLVED'],
              ['and carries a null claim rather than an absent one', a.verdict.claim === null],
              ['the readout still refuses the direction it cannot resolve', resolved !== undefined],
              ['and that refusal does not block', resolved.blocking === false && resolved.pass === false],
              ['and the effect did not move', Math.abs(a.comparison.deltaPp - 1.4706) < 0.001],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) {
              console.error('τ² protocol conformance failed: ' + bad.join(', '));
              process.exit(1);
            }
          "

      # The audit the record never ran on itself: every published paired delta beside the smallest
      # effect its own sample could have resolved. The arithmetic is re-derived here rather than
      # trusted, because the whole point of the table is that the numbers in it were never put on a
      # common scale — a row that disagreed with its own tally would be the defect it audits.
      - name: Power audit (every published delta against its own resolution)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/power" pnpm eval:power
          diff -u eval/results/poc-power-audit.json "${RUNNER_TEMP}/power/poc-power-audit.json"
          node -e "
            const a = require('${RUNNER_TEMP}/power/poc-power-audit.json');
            const bad = [];
            for (const r of a.rows) {
              const d = r.helped + r.harmed;
              const se = (Math.sqrt(d) / r.n) * 100;
              if (Math.abs(r.deltaPp - ((r.helped - r.harmed) / r.n) * 100) > 1e-9) bad.push(r.artefact + ': delta');
              if (Math.abs(r.halfWidthPp - 1.96 * se) > 1e-9) bad.push(r.artefact + ': half-width');
              if (Math.abs(r.minDetectablePp - 2.802 * se) > 1e-9) bad.push(r.artefact + ': resolution');
              if (r.resolvable && !r.significant95) bad.push(r.artefact + ': resolvable but not within 95%');
            }
            if (a.rows.length !== a.total) bad.push('row count disagrees with the total');
            if (a.resolvable > a.significant95) bad.push('the stricter bar counted more rows than the looser one');
            if (bad.length > 0) { console.error('power audit failed: ' + bad.join(', ')); process.exit(1); }
            console.log('power audit: ' + a.rows.length + ' artifacts, ' + a.resolvable + ' above 80% power, ' +
              a.significant95 + ' above the 95% half-width');
          "

      # R28: the harm stratification, recomputed from the committed run rather than trusted.
      #
      # The artefact is a pure function of one committed file, so the check is a byte comparison —
      # which is only possible because it records no clock of its own. The assertions beside it are
      # there so that a change in the bucketing shows up as a named failure rather than as a diff
      # nobody reads: the four buckets must still cover the whole corpus, the minimum must still sit
      # where the reading says, and the criteria must still come out as they are published.
      - name: Harm stratification (recomputed, and its verdict asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/harm" pnpm eval:harm
          diff -u eval/results/poc-harm-strata.json "${RUNNER_TEMP}/harm/poc-harm-strata.json"
          node -e "
            const a = require('${RUNNER_TEMP}/harm/poc-harm-strata.json');
            const codes = a.criteria.map((c) => c.code).join(',');
            const checks = [
              ['four buckets', a.buckets.length === 4],
              ['covering every question once', a.buckets.reduce((sum, b) => sum + b.n, 0) === a.n],
              ['all 1,534 of them', a.n === 1534],
              ['the paired delta is the artefact it re-reads', Math.abs(a.paired.deltaPp - 0.3259) < 0.001],
              ['five criteria, always', codes === 'S1,S2,S3,S4,S5'],
              ['the registration is refuted', a.refuted === true],
              ['with the minimum at the top bucket', a.minimum === 3],
              ['and a gap below its own resolution', a.gapPp < a.gapMinDetectablePp],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('harm stratification failed: ' + bad.join(', ')); process.exit(1); }
            console.log('harm stratification: ' + checks.length + ' checks pass');
          "

      # R30 stage 1: what the pack did to the query, recomputed from the committed run.
      #
      # The artefact is a pure function of one committed file — no model, no database, no clock — so
      # the check is a byte comparison. The assertions beside it pin the five registered verdicts: a
      # change in the classifier that flipped one of them would otherwise arrive as a diff nobody
      # reads, and this round's entire claim is that those five numbers separate help from harm.
      - name: Query diff (recomputed, and its verdict asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/query-diff" pnpm eval:query-diff
          diff -u eval/results/poc-query-diff.json "${RUNNER_TEMP}/query-diff/poc-query-diff.json"
          node -e "
            const a = require('${RUNNER_TEMP}/query-diff/poc-query-diff.json');
            const f1 = a.features.find((f) => f.code === 'F1');
            const f2 = a.features.find((f) => f.code === 'F2');
            const strict = a.gates.find((g) => g.mode === 'strict');
            const total = a.kinds.reduce((sum, k) => sum + k.cell.n, 0);
            const unchanged = a.kinds.find((k) => k.kind === 'unchanged').cell;
            const codes = a.criteria.map((c) => c.code).join(',');
            const checks = [
              ['every case lands in exactly one kind', total === a.n],
              ['all 1,534 of them', a.n === 1534],
              ['692 queries the pack did not touch', unchanged.n === 692],
              ['not one of them flipped', unchanged.helped === 0 && unchanged.harmed === 0],
              ['the paired delta is the artefact it re-reads', Math.abs(a.gates[0].measured.deltaPp - 0.3259) < 0.001],
              ['the identifier covariate separates', f1.gapPp < 0 && Math.abs(f1.gapPp) > f1.gapHalfWidthPp],
              ['and it separates under the looser rule too', f2.gapPp < 0 && Math.abs(f2.gapPp) > f2.gapHalfWidthPp],
              ['both exact tests agree at 0.05', f1.fisherP < 0.05 && f2.fisherP < 0.05],
              ['the clustered interval excludes zero', f1.clusterHighPp < 0],
              ['the gate raises the delta', strict.gated.deltaPp > strict.measured.deltaPp],
              ['the gate does not reach 80% power', strict.resolvable === false],
              ['five criteria, always', codes === 'Q1,Q2,Q3,Q4,Q5'],
              ['the registration is not refuted', a.refuted === false],
              ['the pruned-name category is reported as unmeasured', a.unmeasured.length === 1 && a.unmeasured[0].category === 'pruned-name'],
              ['one hypothesis out of five survives the multiplicity correction', a.multiplicity.familySize === 5 && a.multiplicity.survivors.join(',') === 'F1'],
              ['and the corrected threshold is 0.05 over five', Math.abs(a.multiplicity.bonferroniAlpha - 0.01) < 1e-12],
              ['the pre-treatment version of the gate has the wrong sign', a.ruleLevel.present.deltaPp > 0],
              ['and it does not find what F1 finds', a.ruleLevel.agreement.recall < 0.5 && a.ruleLevel.agreement.precision < 0.5],
              ['most rules name nothing a detector can see', a.ruleLevel.namingShare < 0.2],
              ['the pool is five folds of fewer sentences than rows', a.ruleLevel.rules === 1066 && a.ruleLevel.sentences === 271],
              ['and both counts give the same naming share', Math.abs(a.ruleLevel.namingShare - a.ruleLevel.sentencesNaming / a.ruleLevel.sentences) < 0.01],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('query diff failed: ' + bad.join(', ')); process.exit(1); }
            console.log('query diff: ' + checks.length + ' checks pass, F1 gap ' + f1.gapPp.toFixed(2) +
              'pp over ' + f1.present.n + ' questions at p=' + f1.fisherP.toFixed(4));
          "

      # R31: where the imported name came from, recomputed from the same committed run.
      #
      # The reading decides whether the product statement §140 licensed survives, so the assertions
      # pin the withdrawal itself rather than only the arithmetic: if a later change to the tokeniser
      # or the detector flipped the verdict, this step is where it would have to be argued for.
      - name: Pack mediation (recomputed, and the withdrawal asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/mediation" pnpm eval:mediation
          diff -u eval/results/poc-pack-mediation.json "${RUNNER_TEMP}/mediation/poc-pack-mediation.json"
          node -e "
            const a = require('${RUNNER_TEMP}/mediation/poc-pack-mediation.json');
            const p = a.primary;
            const code = (c) => p.criteria.find((e) => e.code === c);
            const bucket = (s) => p.strata.find((e) => e.source === s).cell.n;
            const sum = p.contribution.pack + p.contribution.schema + p.contribution.unverifiable;
            const checks = [
              ['the corpus is the dev run', a.corpus.cases === 1534],
              ['155 of them import an ungrounded name', p.importing === 155 && p.notImporting === 1379],
              ['the pack names the identifier in 60 of them', bucket('pack') === 60],
              ['and says nothing alike in 94', bucket('schema') === 94],
              ['one statement never ran', bucket('unverifiable') === 1],
              ['the two buckets are damaged equally', Math.abs(p.split.gapPp - 1.24) < 0.02],
              ['so the mechanism does not clear its own half-width', p.split.resolves === false],
              ['four criteria, always', p.criteria.map((c) => c.code).join(',') === 'M1,M2,M3,M4'],
              ['availability holds at 38.7%', code('M1').ok === true],
              ['and fails the generous detector', code('M2').ok === false],
              ['the mechanism is not shown', code('M3').ok === false],
              ['the pack carries a third of the gate, not half', code('M4').ok === false],
              ['so the product statement is withdrawn', p.statementWithdrawn === true],
              ['the gate it refuses is worth +0.98pp', Math.abs(p.contribution.total - 0.98) < 0.01],
              ['of which a third comes from questions the pack named', Math.abs(p.contribution.pack - 0.33) < 0.01],
              ['and 60% from questions it never named', Math.abs(p.contribution.schema - 0.59) < 0.01],
              ['the parts add up to the whole', Math.abs(sum - p.contribution.total) < 1e-9],
              ['285 names, 79 of them spelled out by a rule', p.byName.total === 285 && p.byName.exact === 79],
              ['the generous detector is reported too', a.generous.detector === 'flattened' && a.generous.statementWithdrawn === true],
              ['the pack text was read, not reconstructed', a.corpus.reconstructedPackText === 0 && a.corpus.withoutPackText === 0],
              ['the vocabulary of unattributed names is not empty', a.unattributed.length > 0],
              ['the synonym gap is reported as unmeasured', a.unmeasured.some((u) => u.category === 'synonym')],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('mediation failed: ' + bad.join(', ')); process.exit(1); }
            console.log('mediation: ' + checks.length + ' checks pass, pack supplies ' + (60 / 155 * 100).toFixed(1) +
              '% of the flagged names, damage equal in both buckets (' + p.split.gapPp.toFixed(2) + 'pp +/- ' +
              p.split.gapHalfWidthPp.toFixed(2) + ')');
          "

      # R31b: the gate's estimate taken apart three ways, recomputed from the same committed run.
      - name: Gate stability (recomputed, and the estimate asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/stability" pnpm eval:stability
          diff -u eval/results/poc-gate-stability.json "${RUNNER_TEMP}/stability/poc-gate-stability.json"
          node -e "
            const a = require('${RUNNER_TEMP}/stability/poc-gate-stability.json');
            const s = a.strict;
            const checks = [
              ['the corpus is the dev run', a.n === 1534],
              ['the gate discards 155', s.discarded === 155],
              ['and is worth +0.98pp', Math.abs(s.observedPp - 0.98) < 0.01],
              ['eleven databases, one removed at a time', s.jackknife.length === 11],
              ['no single database carries it', s.jackknifeMinPp > 0],
              ['the placement beats random subsets', s.permutation.p < 0.001],
              ['five thousand draws', s.permutation.resamples === 5000],
              ['both halves keep the improvement', s.halves.length === 2 && s.halves.every((h) => h.improvementPp > 0)],
              ['three readings, always', s.criteria.map((c) => c.code).join(',') === 'S1,S2,S3'],
              ['all three pass', s.unstable === false],
              ['the looser grounding rule discards fewer', a.loose.discarded === 114],
              ['and the split-half limitation is stated', a.unmeasured.some((u) => u.category === 'out-of-sample')],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('stability failed: ' + bad.join(', ')); process.exit(1); }
            console.log('stability: ' + checks.length + ' checks pass, leave-one-out ' + s.jackknifeMinPp.toFixed(2) +
              'pp to ' + s.jackknifeMaxPp.toFixed(2) + 'pp, permutation p=' + s.permutation.p.toFixed(4));
          "

      # R32 prediction 2: whether the second-closest feature is a second cause or the first one
      # counted twice. The assertions pin the finding — two `inert` verdicts — rather than only the
      # arithmetic, because the verdicts are what the registration asked for and a change in the
      # tokeniser that moved them would have to be argued for here.
      - name: Feature overlap (recomputed, and both verdicts asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/overlap" pnpm eval:feature-overlap
          diff -u eval/results/poc-feature-overlap.json "${RUNNER_TEMP}/overlap/poc-feature-overlap.json"
          node -e "
            const a = require('${RUNNER_TEMP}/overlap/poc-feature-overlap.json');
            const v = Object.fromEntries(a.verdicts.map((x) => [x.pair, x]));
            const p = Object.fromEntries(a.pairs.map((x) => [x.pair, x.reading]));
            const checks = [
              ['the corpus is the dev run', a.n === 1534],
              ['two pairs, always', a.verdicts.length === 2 && a.verdicts.map((x) => x.pair).join(',') === 'F1/F4,F1/F5'],
              ['F1 and F4 share 70 questions', p['F1/F4'].both === 70],
              ['85 carry F1 alone and 7 carry F4 alone', p['F1/F4'].leftOnly === 85 && p['F1/F4'].rightOnly === 7],
              ['the overlap is 45.2%, inside the 50% bar', Math.abs(v['F1/F4'].overlapShare - 0.452) < 0.001 && v['F1/F4'].criterionMet === true],
              ['but F4 is worth exactly nothing outside F1', p['F1/F4'].rightOutsideLeft.deltaPp === 0],
              ['so the table-set axis is inert, not a second cause', v['F1/F4'].kind === 'inert'],
              ['F5 overlaps F1 by only 7.7%', Math.abs(v['F1/F5'].overlapShare - 0.0774) < 0.001],
              ['and is worth -3.57pp on the 28 it adds', Math.abs(p['F1/F5'].rightOutsideLeft.deltaPp + 3.571) < 0.01],
              ['which does not resolve, so it is inert too', p['F1/F5'].rightOutsideLeft.n === 28 && v['F1/F5'].kind === 'inert'],
              ['the four cells partition the corpus', a.pairs.every((x) => x.reading.both + x.reading.leftOnly + x.reading.rightOnly + x.reading.neither === 1534)],
              ['and the criterion quotes its own bar', p['F1/F4'].criterion.includes('50%')],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('overlap failed: ' + bad.join(', ')); process.exit(1); }
            console.log('overlap: ' + checks.length + ' checks pass, F1/F4 ' + (v['F1/F4'].overlapShare * 100).toFixed(1) +
              '% overlap and ' + v['F1/F4'].kind + ', F1/F5 ' + (v['F1/F5'].overlapShare * 100).toFixed(1) + '% and ' + v['F1/F5'].kind);
          "

      # R32 axis 1: whether a corpus can tell a procedural rule from a declarative one. The
      # assertions pin the two things the reading found rather than only its arithmetic — the census
      # that refused the axis, and the pool counts that made an id-keyed lookup impossible to miss.
      - name: Rule form (recomputed, and the axis verdict asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/rule-form" pnpm eval:rule-form
          diff -u eval/results/poc-rule-form.json "${RUNNER_TEMP}/rule-form/poc-rule-form.json"
          node -e "
            const a = require('${RUNNER_TEMP}/rule-form/poc-rule-form.json');
            const c = a.census.strict;
            const r = a.census.relaxed;
            const cov = a.coverage;
            const whole = a.residual.whole;
            const outside = a.residual.withoutImportedName;
            const db = a.residual.perDatabase;
            const checks = [
              ['the corpus is the dev run', a.n === 1534],
              ['the pool is rows, and rows are folds', a.pool.rows === 1066],
              ['a rule id is a slot reused across folds, so sentences are fewer', a.pool.sentences === 271 && a.pool.slots === 229 && a.pool.sentences < a.pool.rows],
              ['220 of the slots are cited by a question', a.pool.cited === 220],
              ['most sentences carry both marker kinds', c.both === 157 && Math.abs(c.bothShare - 0.5793) < 0.001],
              ['which is over the registered bar, so the axis is refused', c.bothShare > a.bar && a.axisUsable === false && a.verdict === 'unmeasurable'],
              ['and a looser marker set does not save it', Math.abs(r.bothShare - 0.6568) < 0.001 && r.bothShare > a.bar],
              ['the two censuses are over the same sentences', c.n === 271 && r.n === 271],
              ['the four pack forms partition the corpus', cov.procedural + cov.declarative + cov.mixed + cov.none === a.n],
              ['487 procedural and 330 declarative packs', cov.procedural === 487 && cov.declarative === 330 && cov.mixed === 100 && cov.none === 617],
              ['both groups span every database, so neither is a single-cluster artefact', whole.proceduralClusters === 11 && whole.declarativeClusters === 11],
              ['the residual points the opposite way to prediction 3', whole.gapPp > 0 && whole.declarative.deltaPp < 0],
              ['and is larger where no name was imported', outside.gapPp > whole.gapPp],
              ['the interval brackets its own point estimate', whole.gapLowPp <= whole.gapPp && whole.gapPp <= whole.gapHighPp],
              ['four of eleven databases disagree with the pooled sign', db.databases === 11 && db.negative === 4 && db.positive === 6],
              ['two reasons are recorded for the refusal', a.reasons.length === 2],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('rule form failed: ' + bad.join(', ')); process.exit(1); }
            console.log('rule form: ' + checks.length + ' checks pass, ' + c.both + '/' + c.n + ' sentences carry both (' +
              (c.bothShare * 100).toFixed(1) + '% against a ' + (a.bar * 100) + '% bar), residual gap ' +
              whole.gapPp.toFixed(2) + 'pp with ' + db.negative + ' of ' + db.databases + ' databases against it');
          "

      # R32 axis 3: whether the damage is a property of an ambiguous question. The assertion that
      # matters is the one that refuses the prediction — the band naming none of its columns is
      # destroyed least, and both difficulty strata that can be read say so independently.
      - name: Referent coverage (recomputed, and the refutation asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/referent" pnpm eval:referent
          diff -u eval/results/poc-referent.json "${RUNNER_TEMP}/referent/poc-referent.json"
          node -e "
            const a = require('${RUNNER_TEMP}/referent/poc-referent.json');
            const o = a.overall;
            const sum = a.buckets.reduce((total, b) => total + o[b].n, 0);
            const strata = (name) => a.byDifficulty.find((d) => d.difficulty === name).strata;
            const checks = [
              ['the corpus is the dev run', a.n === 1534],
              ['the four bands partition it', sum === a.n],
              ['nothing is named in 131 questions', o.none.n === 131],
              ['everything is named in 181', o.all.n === 181],
              ['the band that names nothing starts most correct than the middle band', o.none.baselineAccuracy > o.most.baselineAccuracy],
              ['and is destroyed least of all four', o.none.harmedPerCorrectPp < Math.min(o.few.harmedPerCorrectPp, o.most.harmedPerCorrectPp, o.all.harmedPerCorrectPp)],
              ['so the ambiguity axis is refuted', a.verdict === 'refuted'],
              ['the simple stratum says the same', strata('simple').none.harmedPerCorrectPp < strata('simple').most.harmedPerCorrectPp],
              ['and so does the moderate one', strata('moderate').none.harmedPerCorrectPp < strata('moderate').most.harmedPerCorrectPp],
              ['the reading names the direction rather than only the verdict', a.reading.includes('least damaged')],
              ['four bands, always', a.buckets.join(',') === 'none,few,most,all'],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('referent failed: ' + bad.join(', ')); process.exit(1); }
            console.log('referent: ' + checks.length + ' checks pass, destroyed ' + o.none.harmedPerCorrectPp.toFixed(2) +
              '% where nothing is named against ' + o.all.harmedPerCorrectPp.toFixed(2) + '% where everything is');
          "

      - name: Out of sample (recomputed, the registrations adjudicated, and the filter priced)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/oos" pnpm eval:out-of-sample
          diff -u eval/results/poc-out-of-sample.json "${RUNNER_TEMP}/oos/poc-out-of-sample.json"
          node -e "
            const a = require('${RUNNER_TEMP}/oos/poc-out-of-sample.json');
            const verdict = (id) => a.verdicts.find((v) => v.id === id);
            const checks = [
              ['both corpora are the ones registered', a.datasets.dev === 'BIRD dev' && a.datasets.train === 'BIRD train (out-of-sample)'],
              ['the out-of-sample corpus is the 7,000-question run over 58 databases', a.train.clustered.questions === 7000 && a.train.clustered.clusters === 58],
              ['the memory arm is negative there', Math.abs(a.train.deltaPp + 0.7142857142857143) < 1e-9],
              ['and stays negative when the interval is resampled over databases', a.train.clustered.resolved === true && a.train.clustered.highPp < 0],
              ['which is the check that closed R32s first axis and this headline survives', a.train.clustered.lowPp > -1.4 && a.train.clustered.lowPp < -1.1],
              ['all five folds point the same way', a.train.folds.negative === 5 && a.train.folds.positive === 0],
              ['and five folds cannot reach p < 0.05 however unanimous they are', Math.abs(a.train.folds.p - 0.0625) < 1e-12],
              ['on dev the same arm is positive and unresolved', a.dev.deltaPp > 0 && a.dev.clustered.resolved === false],
              ['the gate recovered about half of what dev promised', Math.abs(a.dev.gate.improvementPp - 0.9778) < 0.001 && Math.abs(a.train.gate.improvementPp - 0.5143) < 0.001],
              ['so the product is not better than no memory out of sample', a.train.gate.gatedDeltaPp < 0 && Math.abs(a.train.gate.gatedDeltaPp + 0.2) < 1e-9],
              ['the statement says exactly that, from the numbers', a.statement.includes('not distinguishable from no memory') && a.statement.includes('0.71pp') && a.statement.includes('0.51pp')],
              ['the arm clears the 95% interval and misses the 80% bar', a.train.resolution.significant95 === true && a.train.resolution.resolvable === false],
              ['and is filed under the name the power audit prints for it', a.train.resolution.label === 'within 95% but under 80% power'],
              ['the resolution it misses is the 0.82pp one this sample was sized for', Math.abs(a.train.resolution.minDetectablePp - 0.8242) < 0.001],
              ['the dev arm is filed as underpowered, which it always was', a.dev.resolution.label === 'underpowered'],
              ['and the statement carries both bars rather than only the interval', a.statement.includes('80%-power resolution')],
              ['P1 holds: the run was measurable', verdict('P1').holds === true],
              ['P2 is refuted: it is significantly different from the none arm', verdict('P2').holds === false],
              ['P3 holds: the gate is inside the registered wide band', verdict('P3').holds === true && a.train.gate.improvementPp >= 0.2 && a.train.gate.improvementPp <= 2.0],
              ['P4 holds: shrinkage of less than half, inside [0.49, 0.98]', verdict('P4').holds === true],
              ['P5 holds: an imported name is still negative', verdict('P5').holds === true && a.train.imported.deltaPp < 0],
              ['the imported cohort is 548 questions and carries most of the harm', a.train.imported.n === 548],
              ['nothing in the table compares an accuracy across splits', a.table.some((row) => /accuracy/i.test(row.label)) === false],
              ['seven rows, one per comparable quantity', a.table.length === 7],
            ];
            // The discordance block, asserted for the same reason the verdicts are: it is the reading
            // the product decision rests on, and a corpus that moved under it would change the decision
            // without failing anything else. Both splits, because the finding is the difference.
            const d = a.discordance;
            checks.push(
              ['the out-of-sample corpus splits 2,925 that could only be helped against 4,075 that could only be harmed', d.train.attempted.n === 2925 && d.train.correct.n === 4075],
              ['the pack repairs 6.39% of the wrong answers', Math.abs(d.train.attempted.ratePp - 6.3931623931623935) < 1e-9],
              ['and breaks 5.82% of the right ones', Math.abs(d.train.correct.ratePp - 5.815950920245399) < 1e-9],
              ['so help is likelier per question and harm is likelier per corpus', d.train.attempted.ratePp > d.train.correct.ratePp && Math.abs(d.train.helpPerHarm - 0.7890295358649789) < 1e-9],
              ['a filter that saw every break would be worth 3.39pp', Math.abs(d.train.ceilingPp - 3.3857142857142857) < 1e-9],
              ['this one discards 548 questions, catching 76 breaks and 40 repairs', d.train.filter.discarded === 548 && d.train.filter.caughtOfBroken === 76 && d.train.filter.caughtOfRepaired === 40],
              ['which is 15.2 questions per net error and 15.2% of the ceiling', Math.abs(d.train.filter.discardedPerNetError - 15.222222222222221) < 1e-9 && Math.abs(d.train.shareOfCeiling - 0.15189873417721517) < 1e-9],
              ['the filter reading and the gate reading are one number computed twice', Math.abs(d.train.realisedPp - a.train.gate.improvementPp) < 1e-9 && Math.abs(d.dev.realisedPp - a.dev.gate.improvementPp) < 1e-9],
              ['dev sits the other side of one repair per break', d.dev.helpPerHarm > 1 && Math.abs(d.dev.helpPerHarm - 1.0806451612903225) < 1e-9],
              ['and its filter was already weak in sample', Math.abs(d.dev.shareOfCeiling - 0.24193548387096775) < 1e-9 && Math.abs(d.dev.filter.discardedPerNetError - 10.333333333333334) < 1e-9],
              ['the statement quotes both sides of the asymmetry', d.statement.includes('0.79 repairs per break') && d.statement.includes('base is not symmetric')],
              ['and its ceiling, its realisation and the share between them', d.statement.includes('3.39pp') && d.statement.includes('0.51pp') && d.statement.includes('15.2% of the ceiling')],
            );
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('out-of-sample failed: ' + bad.join(', ')); process.exit(1); }
            console.log('out-of-sample: ' + checks.length + ' checks pass, delta ' + a.train.deltaPp.toFixed(2) +
              'pp [' + a.train.clustered.lowPp.toFixed(2) + ', ' + a.train.clustered.highPp.toFixed(2) +
              '], gate +' + a.train.gate.improvementPp.toFixed(2) + 'pp, net ' + a.train.gate.gatedDeltaPp.toFixed(2) +
              'pp, filter realises ' + (d.train.shareOfCeiling * 100).toFixed(1) + '% of a ' + d.train.ceilingPp.toFixed(2) + 'pp ceiling');
          "

      # R33 stage 0: whether the filter survives being pointed at one query instead of at a
      # difference. The assertions pin the finding the product decision rests on — the flag fires on
      # almost everything and its Youden index is a quarter of the filter's — rather than only the
      # arithmetic, because a tokeniser change that moved any of it would have to be argued for here.
      - name: Validity without a baseline (recomputed, and all six registrations adjudicated)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/validity" pnpm eval:validity
          diff -u eval/results/poc-validity.json "${RUNNER_TEMP}/validity/poc-validity.json"
          node -e "
            const a = require('${RUNNER_TEMP}/validity/poc-validity.json');
            const v = (id) => a.verdicts.find((x) => x.id === id);
            const g = Object.fromEntries(a.gates.map((x) => [x.id, x.pass]));
            const t = a.train;
            const d = a.dev;
            const checks = [
              ['the artefact names the registration it was written before', a.registered === 'prereg/R33.md'],
              ['both corpora are the ones the earlier rounds paid for', a.datasets.dev === 'BIRD dev' && a.datasets.train === 'BIRD train (out-of-sample)'],
              ['ten train rows carry no bare query and two carry no served one', t.bare.excluded === 10 && t.served.excluded === 2 && t.bare.n === 6990],
              ['and none of those absences claims to be an answer', g['V53-validity-queries-present'] === true],
              ['both rules were read on both arms of both splits', g['V54-validity-rules-reported'] === true],
              ['the strict rule flags 94.8% of bare attempts', Math.abs(t.bare.flagged.share - 0.9476394849785408) < 1e-12],
              ['so the clean group is 366 questions, 5.2% of the corpus', t.bare.clean.n === 366],
              ['the flagged group is 12.58pp less accurate, on an interval that excludes zero', Math.abs(t.bare.gapPp + 12.579690346083794) < 1e-9 && t.bare.clustered.resolves === true],
              ['it catches 96.3% of failures by flagging 94.8% of everything', Math.abs(t.bare.sensitivity - 0.962607204116638) < 1e-12 && Math.abs(t.bare.specificity - 0.06306748466257668) < 1e-12],
              ['which is a Youden index of 0.0257 against the memory filters 0.1068', Math.abs(t.bare.youdenJ - 0.02567468877921475) < 1e-12],
              ['the morphological rule fires less and separates no better', Math.abs(t.bareLoose.flagged.share - 0.7577968526466381) < 1e-12 && t.bareLoose.youdenJ < 0.1068],
              ['a 20pp lower flag rate buys 0.044 of Youden, which is not the tokeniser story', Math.abs(t.bareLoose.youdenJ - 0.07003883025181779) < 1e-12],
              ['dev separates more than train, by 9.1pp, so P4 fails on distance rather than sign', Math.abs(d.bare.gapPp + 21.695060145325755) < 1e-9 && d.bare.gapPp < 0],
              ['the pack adds 0.42pp of flag rate, which is not measurable under a 94.8% ceiling', Math.abs(t.served.flagged.share - t.bare.flagged.share - 0.004203898845408949) < 1e-12],
              ['P1, P2 and P3 hold', v('P1').holds === true && v('P2').holds === true && v('P3').holds === true],
              ['P4, P5 and P6 are refuted', v('P4').holds === false && v('P5').holds === false && v('P6').holds === false],
              ['the statement quotes the flag rate, the gap and the bar', a.statement.includes('94.8%') && a.statement.includes('12.58pp') && a.statement.includes('0.1068')],
              ['and says the check does not clear it', a.statement.includes('does not clear')],
              ['what the flag rate cannot show is visible on the questions it passes', t.addedByPack.clean === 1693 && t.addedByPack.flaggedAfter === 99],
              ['the pack imports a name on 5.8% of the questions that were clean', Math.abs(t.addedByPack.share - 0.05847607796810396) < 1e-12],
              ['and on 6.1% of devs, which is the same finding on the in-sample split', Math.abs(d.addedByPack.share - 0.060759493670886074) < 1e-12],
              ['which the statement quotes', a.statement.includes('5.8%')],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('validity failed: ' + bad.join(', ')); process.exit(1); }
            console.log('validity: ' + checks.length + ' checks pass, strict flags ' + (t.bare.flagged.share * 100).toFixed(1) +
              '%, gap ' + t.bare.gapPp.toFixed(2) + 'pp, J ' + t.bare.youdenJ.toFixed(4) + ' against ' + 0.1068);
          "

      - name: Admission, not dose (recomputed, and all seven registrations adjudicated)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/admission" pnpm eval:admission
          diff -u eval/results/poc-admission.json "${RUNNER_TEMP}/admission/poc-admission.json"
          node -e "
            const a = require('${RUNNER_TEMP}/admission/poc-admission.json');
            const v = (id) => a.verdicts.find((x) => x.id === id);
            const g = Object.fromEntries(a.gates.map((x) => [x.id, x.pass]));
            const e = a.exchange.all;
            const c = a.control;
            const checks = [
              ['the artefact names the registration it was written before', a.registered === 'prereg/R34-admission.md'],
              ['the corpus is the one R30 stage 2 paid for', a.corpus.questions === 7000 && a.corpus.databases === 58],
              ['the split deals 29 databases to each half and shares none', g['V56-admission-split-disjoint'] === true && a.corpus.discovery.databases === 29 && a.corpus.confirmation.databases === 29],
              ['2,925 questions could only be repaired and 4,075 only broken', e.repairable === 2925 && e.breakable === 4075],
              ['memory repaired 187 of them and broke 237', e.repaired === 187 && e.broken === 237],
              ['which is 6.39% and 5.82% on bases that are not symmetric', Math.abs(e.repairRatePp - 6.3931623931623935) < 1e-12 && Math.abs(e.breakRatePp - 5.815950920245399) < 1e-12],
              ['an exchange of 0.789 against a hurdle of 1.393, which is the bare odds rather than parity', Math.abs(e.helpPerHarm - 0.7890295358649789) < 1e-12 && Math.abs(e.hurdle - 1.393162393162393) < 1e-12],
              ['so the clearance is 0.566 and the memory is 43% short of paying', Math.abs(e.clearance - 0.5663586239030831) < 1e-12],
              ['the repair rate that would break even is 8.10pp and the break rate 4.59pp', Math.abs(e.requiredRepairRatePp - 8.102564102564102) < 1e-12 && Math.abs(e.requiredBreakRatePp - 4.588957055214724) < 1e-12],
              ['so a gate needs 47.64% of its admitted questions to be repairable, against a 41.79% base rate', Math.abs(a.precisionBar - 0.4763614499226937) < 1e-12],
              ['admitting only the repairable questions is worth the whole 2.67pp repair rate with no breaks', Math.abs(a.ceiling.admissionPp - 2.6714285714285713) < 1e-12 && a.oracle.repairable.broken === 0 && a.oracle.repairable.repaired === 187],
              ['and removing every break is worth 3.39pp, so the oracle is the sum', Math.abs(a.ceiling.removalPp - 3.3857142857142857) < 1e-12 && Math.abs(a.ceiling.combinedPp - 6.057142857142857) < 1e-12],
              ['the two oracle identities hold, so the counts are the corpus counts', g['V57-admission-oracle'] === true && v('P4').holds === true],
              ['random admission scales with coverage at every share, which is what makes the estimator usable', g['V58-admission-control'] === true && v('P3').holds === true && c.length === 6],
              ['the widest deviation is 0.186pp at the smallest share, inside its own 0.264pp half-width', Math.abs(c[5].deviationPp - 0.18567639257294427) < 1e-9 && Math.abs(c[5].halfWidthPp - 0.2638641472929123) < 1e-6],
              ['P1 and P2 hold: the halves carry the discords and the hurdle reproduces', v('P1').holds === true && v('P2').holds === true],

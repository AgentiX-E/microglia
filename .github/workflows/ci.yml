              ['a difference of +4.03pp on [+0.76, +6.62], clustered by database', Math.abs(p.differencePp - 4.031315249089748) < 1e-12 && Math.abs(p.lowPp - 0.7633587786259541) < 1e-12 && Math.abs(p.highPp - 6.6228840821271495) < 1e-12 && p.excludesZero === true],

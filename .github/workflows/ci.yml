              ['135 rules were shown five times in each half', r.rules === 135 && g['V59-ledger-corpus'] === true],
              ['the rules are not interchangeable: chi2 293.3 against a null of 209.6', Math.abs(d.repairStatistic - 293.2849546219891) < 1e-9 && Math.abs(d.nullMean - 209.57290886139242) < 1e-9],

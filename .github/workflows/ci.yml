      - name: The ledger does not travel (recomputed, and all seven registrations adjudicated)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/ledger" pnpm eval:ledger
          diff -u eval/results/poc-ledger.json "${RUNNER_TEMP}/ledger/poc-ledger.json"
          node -e "
            const a = require('${RUNNER_TEMP}/ledger/poc-ledger.json');
            const v = (id) => a.verdicts.find((x) => x.id === id);
            const g = Object.fromEntries(a.gates.map((x) => [x.id, x.pass]));
            const c = a.corpus;
            const d = a.dispersion;
            const r = a.replication;
            const s = a.screening;
            const p = a.packSize;
            const checks = [
              ['the artefact names the registration it was written before', a.registered === 'prereg/R35-ledger.md'],

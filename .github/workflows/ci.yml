      - name: The definitional grain renders on 8.6% of questions (R37, and that is the finding)
        run: |
          set -euo pipefail
          node -e "
            const a = require('./eval/results/poc-sota-bird-dev-R37-lexicon-grain.json');
            const arm = (name) => a.arms.find((x) => x.arm === name);
            const lex = arm('full-lexicon');
            const full = arm('full');
            const pair = a.arm_pairs.find((x) => x.arm === 'full-lexicon');
            const gate = Object.fromEntries(a.gates.map((x) => [x.id, x.pass]));
            const folds = a.per_fold.map((f) => f.lexicon);
            const covered = a.per_case.filter((c) => (c.injectedLexicon || []).length > 0);
            // The licence, re-checked here from the rendered lines rather than trusted from the gate:
            // a term shown on a question that does not contain it is the one thing this grain cannot do.
            // Token match rather than a regex with a Unicode property class, because this file is a
            // shell double-quoted string long before it is JavaScript, and a backslash-escaped class
            // reaches node as a different expression than the one that was written. Tokens are the
            // same rule the module enforces, reached without a backslash.
            const tokens = (text) => text.toLowerCase().split(/[^a-z0-9]+/).filter((x) => x !== '');
            const occurs = (term, text) => {
              const t = tokens(term);
              const w = tokens(text);
              if (t.length === 0) return false;
              return w.some((_, i) => t.every((x, j) => w[i + j] === x || (j === t.length - 1 && w[i + j] === x + 's')));
            };
            const unlicensed = covered.flatMap((c) => (c.injectedLexicon || [])
              .map((line) => ({ line, term: (line.match(/^- \"([^\"]+)\":/) || [])[1], q: c.question }))
              .filter((x) => x.term === undefined || !occurs(x.term, x.q)));
            const helped = covered.filter((c) => c.arms['full-lexicon'] && !c.withoutMemoryCorrect).length;
            const harmed = covered.filter((c) => !c.arms['full-lexicon'] && c.withoutMemoryCorrect).length;
            const checks = [
              ['the artefact names the registration it executes', a.config.prereg === 'prereg/R37-lexicon-grain.md'],
              ['the corpus is the dev split: 1,534 questions over 11 databases, 280 learned per fold', a.n.total === 1534 && a.n.databases === 11 && a.n.learn_mean === 280],
              ['both treated arms ran in one dispatch, so the two grains share a store draw', a.arms.length === 2 && full !== undefined && lex !== undefined],
              ['the rule grain is the anchor the record has measured five times before', Math.abs(full.delta_pp - 0.7170795306388527) < 1e-12 && full.gained === 78 && full.lost === 67],
              ['the definitional block is 12 characters against the rule block 1,062, so it is not a dose', Math.abs(lex.mean_pack_chars - 11.855280312907432) < 1e-12 && Math.abs(full.mean_pack_chars - 1061.8878748370273) < 1e-12],
              ['and it renders on 132 of 1,534 questions, 8.6%, so P1 is refuted by feasibility', covered.length === 132 && Math.abs(lex.mean_pack_ids - 0.08604954367666232) < 1e-12],
              ['the store learned 34, 33, 37, 38 and 37 entries across the five folds', folds.map((f) => f.entries).join(',') === '34,33,37,38,37'],
              ['and rendered 16, 26, 24, 32 and 34 lines from them', folds.map((f) => f.lines).join(',') === '16,26,24,32,34'],
              ['every line was read back and every term licensed, so V64 passes', gate['V64-lexicon-is-licensed'] === true && folds.every((f) => f.unlicensed === 0 && f.checked === f.lines)],
              ['each line is licensed against its own question, re-checked here', unlicensed.length === 0],
              ['the only refusal was a candidate with no term at all: 12 of them, and none for a term the question lacked', folds.reduce((s, f) => s + (f.refused['lexicon-no-term'] || 0), 0) === 12 && folds.every((f) => (f.refused['lexicon-term-not-in-question'] || 0) === 0)],
              ['on the 132 questions it reached, it repaired 5 and broke 4', helped === 5 && harmed === 4],
              ['and against the rule grain the grain costs 0.59pp on an interval that spans zero', Math.abs(pair.deltaPp + 0.5867014341590613) < 1e-12 && pair.ciLowPp < 0 && pair.ciHighPp > 0 && pair.gained === 65 && pair.lost === 74],
              ['so the round is inconclusive by feasibility, not a refutation of the grain', covered.length / a.n.total < 0.25 && pair.p > 0.05],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('lexicon failed: ' + bad.join(', ')); process.exit(1); }
            console.log('lexicon: ' + checks.length + ' checks pass, ' + covered.length + '/' + a.n.total +
              ' questions reached (' + (100 * covered.length / a.n.total).toFixed(1) + '%), ' +

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, test, audit, study
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

      - name: Typecheck the lane CLIs
        # The lanes' entry points are excluded from the composite build — `packages/*/tsconfig.json`
        # lists `src/bin` under `exclude`, because they are processes rather than library surface and
        # they resolve with `nodenext` rather than through the path aliases — so `pnpm build` above
        # does not see them and coverage does not either. `pnpm typecheck` chains this second compiler
        # run, which is why the local entry point and these two steps now check the same files: a
        # `metrics` field typed as a number and written as a string passed every local gate and failed
        # here twice (`9f63398`), and the difference was this line.
        run: pnpm typecheck:lanes

      - name: Tests with coverage gates
        run: pnpm test

      # Pinned to the lane's own interpreter rather than the runner's default: a suite that passes on 3.12 and fails
      # on 3.10 is the drift this whole step exists to catch, and running it on the wrong one would reproduce it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # The ALFWorld lane's drivers are Python and its tests are not part of `pnpm test`, so until this step existed
      # a green `ci.yml` said nothing about them — and `ci.yml` is the workflow the lane's dispatcher reads before it
      # spends money. Three drifts arrived through that gap in one round (a test that needed a package the job does
      # not install, a 3.11 API on a 3.10 interpreter, and a shard that drove the wrong games). The interpreter is
      # pinned to the workflow's own floor, and the checker refuses a construct newer than it.
      - name: The lane's python drivers, on the interpreter the lane runs
        run: |
          set -euo pipefail
          # Three packages, each named because its absence is silent. Without PyYAML the workflow checker answers
          # "clean" for every structural rule it has, and its self-test used to pass in that mode. Without coverage
          # the floor below measures nothing. Without matplotlib the *figure* suites do not fail — they skip the
          # drawing and report a green run — which is how `scripts/budget.py` first arrived here: its self-test drew a
          # real cascade, the runner had no matplotlib, and the step that was supposed to gate a deliverable failed on
          # an import instead. A chart is a deliverable, so its renderer is a dependency of the build.
          python3 -m pip install --disable-pip-version-check --quiet pyyaml coverage matplotlib
          python3 scripts/check-python-floor.py --self-test
          python3 scripts/check-python-floor.py
          for suite in test_agent test_aggregate test_banks test_cli test_cycles test_distill test_floor test_selfcheck test_wait; do
            echo "== $suite"
            python3 "eval/drivers/alfworld/$suite.py"
          done
          # The dispatcher's guards are the only code in the tree whose failure costs money, and three of them
          # exist to stop a payment. It sits in `scripts/` rather than beside the operator so that this step can
          # import it: a guard exercised only by paying is a guard nobody has tested.
          echo "== test_alf_dispatch"
          python3 scripts/test_alf_dispatch.py
          # The split table is read by every `--expect` and every tiling check, and it is a hand-written constant.
          # This suite holds the checker that holds the table, so a checker that stopped rejecting anything fails
          # here rather than in a dispatch whose denominator silently moved (AUDIT 34.251).
          echo "== test_check_split_sizes"
          python3 scripts/test_check_split_sizes.py
          # The offline admission scorer. It spends nothing, which is exactly why it needs a suite: a defect
          # in a free experiment is a wrong answer that no bill ever contradicts (R190).
          echo "== test_score_bank"
          python3 scripts/test_score_bank.py
          python3 scripts/check-workflows.py --self-test

      # The same suites again, measured. Until this step existed the Python lane had a coverage *number* in the
      # reports and no gate under it: `pnpm test` floors the TypeScript packages and nothing floored these, so a
      # refactor could take a driver from 99% to 88% and every job stayed green. The floor is checked per module
      # on lines and branches together, and the checker refuses a report that measured almost nothing — a
      # coverage run that discovers no tests reports 100% of nothing.
      - name: The lane's python drivers, measured
        # The step's output is only readable from the job log, and the log is served through a storage redirect that a
        # restricted client cannot authenticate against — which is how a red build sat here with the word "exit code 1"
        # as its whole diagnosis. `::error::` annotations are readable through the API, so the last lines of this step's
        # output are republished as annotations when it fails: the gate's own sentence, where the gate is.
        run: |
          set -euo pipefail
          exec > >(tee /tmp/python-gates.log) 2>&1
          trap 'code=$?; if [ "$code" -ne 0 ]; then echo "::error title=python gate::$(tail -n 12 /tmp/python-gates.log | tr "\n" "/" | cut -c1-1200)"; fi; exit "$code"' EXIT
          python3 -m coverage run --branch --source=eval/drivers/alfworld -m unittest discover \
            -s eval/drivers/alfworld -p "test_*.py"
          # Each suite puts its own directory on `sys.path` rather than relying on the interpreter to do it, and
          # `test_cli.py` refuses a suite that does not: `python3 scripts/x.py` inserts the script's directory on
          # 3.11 and not on 3.10, so a suite that imported a sibling module by bare name passed on the development
          # interpreter and raised ModuleNotFoundError here.
          python3 -m coverage run --append --branch scripts/test_alf_dispatch.py
          # The second script under the same floor: it is the one that reads the corpus and decides whether the
          # lane's table of section sizes is still true, so it is code and not a convenience.
          python3 -m coverage run --append --branch scripts/test_check_split_sizes.py
          # The scorer the round after this one will read: a module under the same floor as the drivers, because
          # "it only computes numbers" is how a number nobody re-derived ends up in a report (R190).
          python3 -m coverage run --append --branch scripts/test_score_bank.py
          # R218. The submission builder decides what number this project may claim and against which rows, so it
          # is the one tool in the lane whose defect would be published: a metric read off one attempt and placed
          # in a pass^4 column is a wrong claim with a plausible shape. Measured under the same floor.
          python3 -m coverage run --append --branch eval/tools/submission.py --self-test
          # R216b. The clock. Two dispatches were armed on a `schedule:` trigger and neither fired, so the debt a
          # round owes is now a file CI asserts on rather than a date in a roadmap: a registered round past its
          # date fails the build on the next commit. Measured under the same floor for the same reason - a clock
          # that silently returns zero is a clock that certifies nothing is owed.
          python3 -m coverage run --append --branch eval/tools/round_clock.py --self-test
          # R220. The driver's half of one manifest, two readers: the placement the workflow hands an arm is a
          # command-line argument, so nothing type-checks it. This binds it to eval/manifests/serving-defaults.json,
          # whose TypeScript half core/memory/__tests__/serving.test.ts binds on the product side.
          python3 -m coverage run --append --branch eval/tools/serving_defaults.py --self-test
          # R219. The parser the shipped block is rendered by. Its suite has always run in `working-memory.yml`, which
          # means the module was gated **only on a dispatch** — and R219 added to it the instrument (`false_accusations`)
          # and the admission switch the next paid reading is about. A tool that changes what every arm serves is code
          # on every push, not code on the days a dispatch is armed, so it is measured here as well: same suite, same
          # floor, and `--include` so the run records this module and nothing else's 11%.
          python3 -m coverage run --append --branch --include="*/eval/tools/goal_board.py" \
            eval/tools/goal_board.py --self-test
          # R218c. The interleaved placebo's driver: it decides the order two arms run in and whether the pair is
          # readable at all, so a defect here would be a reading about the *instrument* printed as a reading about
          # the memory. Its self-test drives a real subprocess with a fake runner, so the round's whole path is
          # measured without a provider.
          # `--include` on this one and the next, and the reason is a gate rather than tidiness: both modules import
          # `goal_board`/`notes`, and a run without `--include` records **every** module under the working directory.
          # goal_board's own suite lives in `working-memory.yml`, so here it arrives at 11% and fails the floor for a
          # file this step is not about. The first push of these two lines failed CI for exactly that reason.
          python3 -m coverage run --append --branch --include="*/eval/drivers/tau2/interleave.py" \
            eval/drivers/tau2/interleave.py --self-test
          # R218d. The dose reader: it asks whether an attempt that received more material passed more often than its
          # own task's attempts that received less. Its first real answer was `NO_DOSE` on a treated arm, because a
          # front-placement block never enters the transcript — a measurement of the instrument, and the kind that
          # has to be under a gate rather than in a paragraph.
          python3 -m coverage run --append --branch --include="*/eval/verifiers/board_dose.py" \
            eval/verifiers/board_dose.py --self-test
          # R218e. The join that turns the agent's recording into one row an episode. It is the only place in this
          # lane where a dose is attached to a *reward*, and its failure mode is silent: a join off by one episode
          # produces a table that looks complete and pairs each dose with somebody else's verdict. So it is measured
          # on every push, not on the days a dispatch is armed — a reader that only runs for money is a reader whose
          # refusals nobody has seen.
          python3 -m coverage run --append --branch --include="*/eval/drivers/tau2/dose.py" \
            eval/drivers/tau2/dose.py --self-test
          # R218e amendment 2. The power estimate a registration quotes before it spends money: how many of a grid's
          # pairs can be read without the length confound, and what the sign test can see at that count. It is
          # measured on an artefact that cost ¥8.8 and it decides whether a ¥8.8 round returns a verdict or a bound, so
          # the arithmetic that turns one into the other is under the floor on every push rather than recomputed by
          # hand on the day a registration is written.
          python3 -m coverage run --append --branch --include="*/eval/tools/dose_power.py" \
            eval/tools/dose_power.py --self-test
          # R218e's stratification. Where a memory arm's deficit comes from: the tasks the control already solved or
          # the ones it never did. R216b answered that across dispatches, and cross-dispatch is where this lane's
          # numbers go to die — so the tool reads a grid that holds both arms with four attempts each, and it refuses
          # to print a delta when the strata are borrowed from another dispatch. That refusal is the reason it is under
          # a floor rather than in a notebook: the mode that looks most like the paired one is the one that cannot
          # support a sign test.
          python3 -m coverage run --append --branch --include="*/eval/tools/solve_strata.py" \
            eval/tools/solve_strata.py --self-test
          # R223. The serving decision, priced before it is armed. Every arm in this lane served every episode, so the
          # only question the dispatches have answered is what the block should say — and the stratified reading says
          # the question worth more is *whether* to serve. This module replays a policy over the one grid that holds
          # both arms and both placements, so a proxy can be refused for nothing instead of for ¥9, and its value is
          # exactly that it can refuse: it already killed two candidates on artefacts that were already on disk. Under
          # the floor for the same reason as the rest — the arithmetic that turns a policy into two sign tests is what
          # decides whether money is spent, and arithmetic in a paragraph is arithmetic nobody re-ran.
          python3 -m coverage run --append --branch --include="*/eval/tools/serve_policy.py" \
            eval/tools/serve_policy.py --self-test
          # R223's other half: what a dispatch can buy, in points, before it is dispatched. A grid's resolution
          # is a property of the domain and not of the budget — repeating a task lowers only the measurement half
          # of the error, so past a floor no amount of money resolves a smaller effect. This module fits that
          # floor from a grid already on disk and prices any effect against it. It is under the floor for the same
          # reason as the rest: it is the file that decides whether money is spent, and a spending rule that lives
          # in a paragraph is a rule nobody re-ran.
          python3 -m coverage run --append --branch --include="*/eval/tools/resolution.py" \
            eval/tools/resolution.py --self-test
          # …and the plan's ladder, re-derived rather than trusted. R242 replaced a product (278 x 2 x 4 as one
          # number) with nine rungs, and a rung is a figure in a document unless the build recomputes it from its
          # own factors. This is the same rule R240 established for manifests: verified against a re-derivation,
          # never against its own history.
          python3 eval/tools/resolution.py --check-tiers eval/manifests/plan-costs.json
          # R227. Does the request name the record its write touches? This is the census the round's bar is written
          # over, and its ground truth is the domain's own database rather than a call name. It is under the floor
          # because it is the file that decides whether ¥16 is spent: an arithmetic in a paragraph is arithmetic
          # nobody re-ran, and this lane has already bought one instrument it turned out could not report.
          python3 -m coverage run --append --branch --include="*/eval/tools/record_census.py" \
            eval/tools/record_census.py --self-test
          # R228/R229. Which anchor settles an item: the request's words, the record the episode read, or an ask bound
          # to that record. The tool is under the same floor as the rest because the round's claims are its numbers.
          python3 -m coverage run --append --branch --include="*/eval/tools/read_anchor.py" \
            eval/tools/read_anchor.py --self-test
          # The projection the census reads: the 50 tasks' users, their reservations, and the evaluator's own writes.
          # It carries the source's sha256 because a manifest without one is a table of claims.
          python3 -m coverage run --append --branch --include="*/scripts/build_airline_records.py" \
            scripts/build_airline_records.py --self-test
          # R236/R237. What the two external replications cost, priced before they are run. The plan carried twenty
          # dollars for them for four rounds; the arithmetic over one rate card and three integers - questions,
          # context length, and how many questions share a prefix - puts the pair at under three, and the gap is the
          # provider's cache rate, which is one fiftieth of its miss rate. A budget that lives in a roadmap is a
          # number nobody re-derived, which is exactly how the twenty dollars survived four readings of this lane.
          python3 -m coverage run --append --branch --include="*/eval/tools/bench_budget.py" \
            eval/tools/bench_budget.py --self-test
          # R236/R237's figure. It reads the plan's four lines and refuses to draw them when they do not agree with the
          # manifests that own the numbers, because a waterfall that re-derives a cost is a second source for it - and
          # this repository has already audited what a second source costs (AUDIT 34.329).
          python3 -m coverage run --append --branch --include="*/scripts/budget.py" \
            scripts/budget.py --self-test
          # R236. The reader the round's bars are taken with, which did not exist when the round was registered: B1 and
          # B2 are per-episode proportions over a dispatched transcript, and `--replay` reads ticks over the request
          # board while `--compare` pairs rewards. Under the floor for the reason this whole step exists - the tool
          # that decides whether a ¥2.5 dispatch passed is arithmetic, and arithmetic in a paragraph is arithmetic
          # nobody re-ran.
          python3 -m coverage run --append --branch --include="*/eval/tools/board_mechanism.py" \
            eval/tools/board_mechanism.py --self-test
          # …and the reading it took for nothing, on the 456 control transcripts, re-checked so the numbers the
          # amendment quotes cannot drift from the tool that produced them.
          python3 eval/tools/board_mechanism.py --check eval/manifests/r236-replay.json
          # R237. The two MemTrapBench families, read off our own transcripts with no model call: `settled`, `unused`,
          # `fixation`, and the family-level quantity that was computed and then refuted. Under the floor because the
          # number the refutation rests on has to be recomputable - an argument that a rate is over the wrong unit is
          # worth nothing if the rate cannot be re-derived.
          python3 -m coverage run --append --branch --include="*/eval/tools/memory_traps.py" \
            eval/tools/memory_traps.py --self-test
          python3 eval/tools/memory_traps.py --check eval/manifests/r237-traps.json
          # R240/R241. The third domain's records, and the question that decides whether the record grade can reach
          # them: a telecom request names its line by a phone number, and in this database a customer's phone number
          # is also one of their lines'. Under the floor for the reason R227's census is - the file reports readings
          # that nothing else in the suite would notice going wrong (0 of 8 writes reachable by identifier against 8
          # by the record the episode read, crediting one line of nine against the ambiguity-blind rule's three) and
          # a reading is only a reading if the rule that produced it can be re-run. `--verify` re-derives the whole
          # block from the two source files, whose digests are in the manifest and whose bytes are in this repository:
          # without it the manifest can only check its own arithmetic, which is what R240 shipped.
          python3 -m coverage run --append --branch --include="*/scripts/build_telecom_records.py" \
            scripts/build_telecom_records.py --self-test
          python3 scripts/build_telecom_records.py --check eval/manifests/telecom-records.json
          python3 scripts/build_telecom_records.py --verify eval/manifests/telecom-records.json
          # R242. The third domain's ask vocabulary, measured and mostly refused. Six cues reach almost nothing and
          # two are harmful (refuel reads a concession as a request, credit fires on retail "credit card"), so none
          # ships; the one repair is a return-cue guard that clears forty spurious telecom asks and moves neither
          # retail nor airline. Both commands re-derive the reading from the three sources whose digests the manifest
          # carries — arithmetic alone cannot tell whether it was ever about these tasks.
          python3 scripts/build_telecom_records.py --check-asks eval/manifests/telecom-asks.json
          python3 scripts/build_telecom_records.py --verify-asks eval/manifests/telecom-asks.json
          # R243. Gate 1's affected subset, enumerated at ¥0 before any episode is bought. A precision dispatch can
          # move only a write in the candidate set that no shipped grade serves and whose ask the cap hides; telecom
          # has none of the three in combination, so gate 1 and the two paid gates above it cancel. Both commands
          # re-derive the reading from the database and task bytes the manifest digests name.
          python3 scripts/build_telecom_records.py --check-precision eval/manifests/gate1-subset.json
          python3 scripts/build_telecom_records.py --verify-precision eval/manifests/gate1-subset.json --sources eval/fixtures/telecom
          # R244. The assembly step the store never exposed: a read-time state role (current/historical/transition)
          # and a deterministic serial-max over claim revisions, priced at ¥0 with no model called. The store keeps a
          # world-time-expired rule `active`; the old renderer showed it in the same six fields as a live one. This
          # reader re-derives every role from the bitemporal slice's bytes; --verify refuses a manifest that drifted
          # from them, and the product's own functions are bound to the same reading by state-role-manifest.test.ts.
          python3 -m coverage run --append --branch --include="*/state_role.py" \
            eval/tools/state_role.py --self-test
          # check and verify run under coverage too: the self-test drives check()/verify() as functions but not the
          # argparse branches of main(), so leaving these two as plain python would count 93% locally-passing code as
          # the reader's floor and fail here — the local-pass/CI-fail drift this gate exists to end.
          python3 -m coverage run --append --branch --include="*/state_role.py" \
            eval/tools/state_role.py --check --manifest eval/manifests/state-role.json
          python3 -m coverage run --append --branch --include="*/state_role.py" \
            eval/tools/state_role.py --verify --manifest eval/manifests/state-role.json --fixture eval/fixtures/state-role-store.json
          # R245. A 429 is a family, not a verdict: BigModel's 403 INSUFFICIENT_BALANCE is the real out-of-credit
          # case, while rate limits retry, spend windows wait and NO_RETRY key/subscription codes stop. The old
          # embed probe retried every non-2xx four times. This reader re-derives each family from the fixture bytes;
          # --verify refuses a manifest that drifted, and quota-disposition-manifest.test.ts binds the TS product
          # to the same reading. All three commands run under coverage so main()'s argparse branches are counted.
          python3 -m coverage run --append --branch --include="*/quota_disposition.py" \
            eval/tools/quota_disposition.py --self-test
          python3 -m coverage run --append --branch --include="*/quota_disposition.py" \
            eval/tools/quota_disposition.py --check --manifest eval/manifests/quota-disposition.json
          python3 -m coverage run --append --branch --include="*/quota_disposition.py" \
            eval/tools/quota_disposition.py --verify --manifest eval/manifests/quota-disposition.json --fixture eval/fixtures/quota-replies.json
          # R246. SPLICE's write-side rule: keep only a correction whose utility gain is consistent across
          # independent views of the same experience. A sign-flipping candidate is a fragile abstraction that
          # would regenerate as a contradiction (Anti-Persistence); this reader re-derives every verdict from the
          # readings' bytes, --verify refuses a drifted manifest, and view-consistency-manifest.test.ts binds the
          # TS product to the same reading. All three run under coverage so main()'s argparse branches are counted.
          python3 -m coverage run --append --branch --include="*/view_consistency.py" \
            eval/tools/view_consistency.py --self-test
          python3 -m coverage run --append --branch --include="*/view_consistency.py" \
            eval/tools/view_consistency.py --check --manifest eval/manifests/view-consistency.json
          python3 -m coverage run --append --branch --include="*/view_consistency.py" \
            eval/tools/view_consistency.py --verify --manifest eval/manifests/view-consistency.json --fixture eval/fixtures/view-consistency.json
          # R247. Anti-Persistence' experience/abstraction separation: an exemplar is accumulated, a claim is
          # temporary guidance unless its own observed outcomes license persisting it. This reader re-derives each
          # disposition from the item's bytes, --verify refuses a drifted manifest, and
          # abstraction-lifecycle-manifest.test.ts binds the TS product to the same reading. All three run under
          # coverage so main()'s argparse branches are counted.
          python3 -m coverage run --append --branch --include="*/abstraction_lifecycle.py" \
            eval/tools/abstraction_lifecycle.py --self-test
          python3 -m coverage run --append --branch --include="*/abstraction_lifecycle.py" \
            eval/tools/abstraction_lifecycle.py --check --manifest eval/manifests/abstraction-lifecycle.json
          python3 -m coverage run --append --branch --include="*/abstraction_lifecycle.py" \
            eval/tools/abstraction_lifecycle.py --verify --manifest eval/manifests/abstraction-lifecycle.json --fixture eval/fixtures/abstraction-lifecycle.json
          # R248. Scope boundary: microglia competes in memory-augmented task success; NL2SQL / chart / data-viz
          # belong to nl2charts, where microglia is only the memory amplifier. This reader re-derives each domain
          # from a candidate's bytes, --verify refuses a drifted manifest, and competition-domain-manifest.test.ts
          # binds the TS product to the same reading. All three run under coverage so main()'s branches are counted.
          python3 -m coverage run --append --branch --include="*/competition_domain.py" \
            eval/tools/competition_domain.py --self-test
          python3 -m coverage run --append --branch --include="*/competition_domain.py" \
            eval/tools/competition_domain.py --check --manifest eval/manifests/competition-domain.json
          python3 -m coverage run --append --branch --include="*/competition_domain.py" \
            eval/tools/competition_domain.py --verify --manifest eval/manifests/competition-domain.json --fixture eval/fixtures/competition-domain.json
          # R249. Revision integrity: a revision is only as good as its worst derived site. Deploy-Time Memory's
          # Forgetting Residual Score shows that deleting only the raw record leaves derived copies recoverable, and
          # LongMemEval shows augment-not-replace preserves provenance. This reader re-derives each verdict, reason
          # and count from an input's bytes, --verify refuses a drifted manifest, and
          # revision-integrity-manifest.test.ts binds the TS product to the same reading. All three run under
          # coverage so main()'s argparse branches are counted.
          python3 -m coverage run --append --branch --include="*/revision_integrity.py" \
            eval/tools/revision_integrity.py --self-test
          python3 -m coverage run --append --branch --include="*/revision_integrity.py" \
            eval/tools/revision_integrity.py --check --manifest eval/manifests/revision-integrity.json
          python3 -m coverage run --append --branch --include="*/revision_integrity.py" \
            eval/tools/revision_integrity.py --verify --manifest eval/manifests/revision-integrity.json --fixture eval/fixtures/revision-integrity.json
          # R250. Stale revocation: new evidence must displace the old memories it invalidates before they reach
          # retrieval. TEPA (arXiv 2608.07429) bounds append-only excess risk by q*eta and shows stale exposure falls
          # below the no-memory baseline; STALE (arXiv 2605.06527) classifies co-reference and propagation conflicts.
          # This reader re-derives each verdict, reason and count from an episode's bytes, --verify refuses a drifted
          # manifest, and stale-revocation-manifest.test.ts binds the TS product to the same reading. All three run
          # under coverage so main()'s argparse branches are counted.
          python3 -m coverage run --append --branch --include="*/stale_revocation.py" \
            eval/tools/stale_revocation.py --self-test
          python3 -m coverage run --append --branch --include="*/stale_revocation.py" \
            eval/tools/stale_revocation.py --check --manifest eval/manifests/stale-revocation.json
          python3 -m coverage run --append --branch --include="*/stale_revocation.py" \
            eval/tools/stale_revocation.py --verify --manifest eval/manifests/stale-revocation.json --fixture eval/fixtures/stale-revocation.json
          # R251. Evidence-linked admission: after retrieval, withhold task-boundary traps and check any lesson that
          # lacks detail, conflicts, or comes from a failed task. WikiTrace (arXiv 2611.14320) links each insight to
          # its trajectory for that check; MemTrapBench (arXiv 2608.20202) measures trap history scoring 31.05 vs
          # 94.39 trap-free. This reader re-derives each verdict, reason and count from a candidate set's bytes,
          # --verify refuses a drifted manifest, and memory-admission-manifest.test.ts binds the TS product to the
          # same reading. All three run under coverage so main()'s argparse branches are counted.
          python3 -m coverage run --append --branch --include="*/memory_admission.py" \
            eval/tools/memory_admission.py --self-test
          python3 -m coverage run --append --branch --include="*/memory_admission.py" \
            eval/tools/memory_admission.py --check --manifest eval/manifests/memory-admission.json
          python3 -m coverage run --append --branch --include="*/memory_admission.py" \
            eval/tools/memory_admission.py --verify --manifest eval/manifests/memory-admission.json --fixture eval/fixtures/memory-admission.json
          python3 -m coverage json -o coverage-python.json
          python3 scripts/check-python-coverage.py --self-test
          python3 scripts/check-python-coverage.py coverage-python.json --min 95 --expect-files 38

      - name: The rounds this project owes, and the date each one was registered for
        # The failure this prevents is not a wrong number, it is a round that quietly stops being planned: R216b's
        # 10:02 UTC cron produced no run at all and nothing said so for four hours. A registry read on every push
        # makes the debt visible at the next commit. It is a separate step from the coverage floor because its
        # subject is the plan rather than the code.
        run: |
          python3 eval/tools/round_clock.py
          python3 eval/tools/serving_defaults.py

      - name: The seven readings the anchor rounds were judged on, and whether their parts add up
        # R228 asked whether binding an item to the record the episode **read** settles more of the work than binding it
        # to the request's words; R229 asked whether the two can be joined; R230 asked whether a later turn can be
        # admitted by its position alone; R231 asked whether the requirement can be reached inside the turn that
        # answers a question. No reading is recomputed here — the grid they were taken over is a 32 MB
        # artefact from a paid dispatch and is not in this repository — so what is gated is the arithmetic: every board
        # agrees with its own parts, the taxonomy sums to the writes it explains, and a bar is the one its numbers
        # imply. That is the class of defect this repository has audited three rounds running (AUDIT 34.311, 34.315,
        # 34.317), and it is the one a document can introduce without touching code. The numbers are pinned as well,
        # because R230's refusal is a result: a later round that moves 16.1% recovery has to move a line on purpose.
        run: |
          set -euo pipefail
          python3 eval/tools/read_anchor.py --check eval/manifests/r228-reading.json
          python3 eval/tools/read_anchor.py --check eval/manifests/r229-reading.json
          python3 eval/tools/read_anchor.py --check eval/manifests/r230-reading.json
          python3 eval/tools/read_anchor.py --check eval/manifests/r231-reading.json
          python3 eval/tools/read_anchor.py --check eval/manifests/r232-reading.json
          python3 eval/tools/read_anchor.py --check eval/manifests/r233-reading.json
          python3 eval/tools/read_anchor.py --check eval/manifests/r234-reading.json
          # The figure's own loader, over the same file: a rendering of a reading that does not add up is a figure
          # nobody should publish, and this is the only place the two are read together.
          python3 scripts/display.py --self-test
          # The budget, re-derived from the rate card it names rather than trusted: a saved line whose total no
          # longer matches the card is refused here instead of quoted in a plan.
          python3 eval/tools/bench_budget.py --check eval/manifests/bench-budget.json
          # The plan's four cost lines, added up against the two manifests that own them. A total that stops matching
          # its lines is refused here rather than quoted in a roadmap, which is how a twenty-dollar line survived four
          # readings of this lane.
          python3 scripts/budget.py
          python3 - <<'CHECK'
          import json

          r228 = json.load(open("eval/manifests/r228-reading.json"))
          r229 = json.load(open("eval/manifests/r229-reading.json"))
          r230 = json.load(open("eval/manifests/r230-reading.json"))
          r231 = json.load(open("eval/manifests/r231-reading.json"))
          r232 = json.load(open("eval/manifests/r232-reading.json"))
          r233 = json.load(open("eval/manifests/r233-reading.json"))
          r234 = json.load(open("eval/manifests/r234-reading.json"))
          assert (r228["scope"], r229["scope"], r230["scope"], r231["scope"], r232["scope"], r233["scope"],
                  r234["scope"]) == ("strict", "ask", "admitted", "clause", "displayed", "ordered", "grouped"), (
                      r228["scope"], r229["scope"], r230["scope"], r231["scope"], r232["scope"], r233["scope"],
                      r234["scope"])
          reading = r228["reading"]
          boards = reading["boards"]
          # The reading R228 was refused on: the read board settles 98.5% of the discharged writes and opens 2.53
          # items per episode that no required write needs, against 1.79 required per episode. A later round that
          # moves either number has to move this line on purpose.
          assert boards["strict"]["covered"] == 644, boards["strict"]["covered"]
          assert boards["strict"]["unaccounted"] == 0, boards["strict"]["unaccounted"]
          assert boards["request"]["covered"] == 416, boards["request"]["covered"]
          assert boards["request"]["unaccounted"] == 232, boards["request"]["unaccounted"]
          assert reading["bar"]["B1_settlement"]["holds"] is True
          assert reading["bar"]["B2_accusation"]["holds"] is True
          assert reading["bar"]["B3_openTax"]["holds"] is False, "R228 was refused on its open-tax bar"
          assert reading["replication"]["bar"]["B3_openTax"]["holds"] is False, "and so it was on the second grid"
          # R229: the conjunction keeps relevance and pays for it with attribution, so it fails B1 by one write on the
          # control grid and holds on the replication. Both are pinned, because a bar that passes on one grid and not
          # the other is a finding about the grids and not a pass.
          second = r229["reading"]
          assert second["boards"]["ask"]["covered"] == 415, second["boards"]["ask"]["covered"]
          assert second["boards"]["ask"]["unaccounted"] == 232, second["boards"]["ask"]["unaccounted"]
          assert second["bar"]["B1_settlement"]["holds"] is False, "R229 was refused on its settlement bar"
          assert second["replication"]["bar"]["B1_settlement"]["holds"] is True
          # The diagnostic the next round is registered on: of the 232 writes the turn-one contract cannot account for,
          # two thirds are asks the conversation states after the first turn.
          assert second["boards"]["ask"]["unaccountedBy"]["disclosedLater"] == 155
          assert second["boards"]["ask"]["unaccountedBy"]["consumed"] == 61
          assert second["boards"]["ask"]["unaccountedBy"]["neverStated"] == 16
          # R230: the turn-level filter. It passes the noise bar and fails the other two, and the failure is the
          # finding — 77.2% of user turns follow a question, so the answer and the requirement share a turn.
          third = r230["reading"]
          admitted = third["boards"]["admitted"]
          assert admitted["covered"] == 410, admitted["covered"]
          assert admitted["items"] == 1110, admitted["items"]
          assert admitted["unaccounted"] == 237, admitted["unaccounted"]
          assert third["bar"]["B1_recovery"]["holds"] is False
          assert (third["bar"]["B1_recovery"]["recovered"], third["bar"]["B1_recovery"]["against"]) == (25, 155)
          assert third["bar"]["B2_noise"]["holds"] is True
          assert third["bar"]["B3_coverage"]["holds"] is False, "R230 was refused on coverage as well as recovery"
          assert (third["turns"], third["skippedTurns"]) == (2453, 1893)
          assert (third["contractLater"], third["contractLost"]) == (52, 50)
          # The replication has to repeat the refusal, because a bar that fails on one grid and holds on the other is
          # a finding about the grids. R230 fails all three ways on both.
          assert third["replication"]["boards"]["admitted"]["covered"] == 411
          assert third["replication"]["bar"]["B1_recovery"]["holds"] is False
          assert (third["replication"]["lateWrites"], third["replication"]["recovered"]) == (156, 20)
          # R231: the round that reached the accuracy target and was refused on its price. Both halves are pinned,
          # because the halves are the result — a later round that quotes 95.4% without 17.72 would be quoting the
          # favourable one, and a round that moves either has to move this line on purpose.
          fourth = r231["reading"]
          clause = fourth["boards"]["clause"]
          assert clause["covered"] == 624, clause["covered"]
          assert clause["items"] == 3699, clause["items"]
          assert clause["unaccounted"] == 20, clause["unaccounted"]
          assert abs(clause["coverage"] - 0.9541) < 1e-3, clause["coverage"]
          assert fourth["bar"]["B1_recovery"]["holds"] is True
          assert (fourth["bar"]["B1_recovery"]["recovered"], fourth["bar"]["B1_recovery"]["against"]) == (154, 155)
          assert fourth["bar"]["B3_coverage"]["holds"] is True
          assert fourth["bar"]["B2_efficiency"]["holds"] is False, "R231 was refused on its efficiency bar"
          assert fourth["bar"]["B2_efficiency"]["added"] == 2729
          assert round(fourth["bar"]["B2_efficiency"]["perWrite"], 2) == 17.72
          # The boundary's own price: what it dropped, and what it cost. One covered write, against askAll's 625.
          assert (fourth["clauseOffered"], fourth["clauseKept"]) == (5311, 4158)
          assert fourth["boards"]["askAll"]["covered"] - clause["covered"] == 1
          assert fourth["replication"]["boards"]["clause"]["covered"] == 611
          assert fourth["replication"]["bar"]["B2_efficiency"]["holds"] is False
          # R232: the rendered block. Two bars hold and the third fails on its reference quantity, and all three
          # numbers are pinned because the round's finding is the *difference* between them: 622 shown, 636 reached,
          # 461 shown against 416 covered uncut. A later round that quotes 95.1% without the 14 hidden, or the +45
          # without the 461 reached beside it, would be quoting the favourable half of a trade. R239 moved the
          # contract's request board from 463 to 461 by settling on the serving rule; the clause column and both
          # registered verdicts are unchanged.
          fifth = r232["reading"]
          shown_clause = fifth["display"]["clause"]
          assert shown_clause["required"] == 654, shown_clause["required"]
          assert (shown_clause["reached"], shown_clause["displayed"], shown_clause["hidden"]) == (636, 622, 14)
          assert abs(shown_clause["hiddenShare"] - 14 / 636) < 1e-9
          shown_request = fifth["display"]["request"]
          assert (shown_request["reached"], shown_request["displayed"]) == (461, 461), shown_request
          assert fifth["bar"]["B1_displayed"]["holds"] is True
          assert fifth["bar"]["B1_displayed"]["passers"] == ["clause"]
          assert fifth["bar"]["B2_hidden"]["holds"] is True
          assert fifth["bar"]["B2_hidden"]["scope"] == "clause"
          assert fifth["bar"]["B3_displayTax"]["holds"] is False, "R232 was refused on its display tax"
          assert fifth["bar"]["B3_displayTax"]["tax"] == 45
          assert fifth["bar"]["B3_displayTax"]["against"] == 416
          # The attribution that makes the refusal readable: the cap costs the contract nothing, so the +47 is a
          # settlement-rule difference and not a display tax.
          assert fifth["bar"]["B3_displayTax"]["moment"] == shown_request["displayed"]
          assert fifth["replication"]["display"]["clause"]["displayed"] == 602
          assert fifth["replication"]["display"]["clause"]["hidden"] == 19
          assert fifth["replication"]["bar"]["B3_displayTax"]["holds"] is False
          # R233: the ordering. It removes ten of the fourteen hidden writes and costs the contract nothing, and it
          # still fails its own bar by three writes — which is the round, so all four numbers are pinned: the ordered
          # clause level (632), the shipped level beside it (622), the residue (4) and the floor (461 = 461).
          # R239 moved both sides of that floor from 463 to 461; the comparison it makes is unchanged.
          sixth = r233["reading"]
          ordered_clause = sixth["display"]["clause"]
          assert (ordered_clause["reached"], ordered_clause["displayed"], ordered_clause["hidden"]) == (636, 632, 4)
          assert abs(ordered_clause["hiddenShare"] - 4 / 636) < 1e-9
          assert fifth["display"]["clause"]["other"] == ordered_clause["displayed"]
          assert ordered_clause["other"] == fifth["display"]["clause"]["displayed"]
          assert sixth["bar"]["B1_displayed"]["holds"] is False, "R233 was refused on its coverage bar"
          assert sixth["bar"]["B1_displayed"]["rates"]["clause"] == 632 / 654
          assert sixth["bar"]["B2_contract"]["holds"] is True
          assert sixth["bar"]["B2_contract"]["floor"] == 461
          assert sixth["bar"]["B3_hidden"]["holds"] is True
          # The replication's second bar. R239 moved one hidden write out of the window: 6 of 621 is 0.97%, inside
          # the registered hundredth, so B3 now holds — but the scope still fails B1's coverage bar, so the reading
          # remains a refusal. Pin the number that moved rather than the verdict that happened to precede it.
          assert sixth["replication"]["display"]["clause"]["displayed"] == 615
          assert sixth["replication"]["display"]["clause"]["hidden"] == 6
          assert sixth["replication"]["bar"]["B3_hidden"]["holds"] is True
          assert sixth["replication"]["bar"]["B1_displayed"]["holds"] is False
          # R234: the fold. All four numbers are pinned for the same reason R233's were — the round is a trade, and
          # the trade is these counts: the fold shows every write the board reached (636 of 636, 0 hidden, from 632
          # and 4), adds no item (8.10 a call, unchanged), and costs the shipped board nothing (461 against its own
          # 461, measured without the fold). It still fails its coverage bar, and that failure is the finding rather
          # than a shortfall: 645 was registered above 636, which is the ceiling any rendering rule can reach.
          # R239 moved the contract's request level (and the floor built on it) from 463 to 461.
          seventh = r234["reading"]
          folded_clause = seventh["display"]["clause"]
          assert (folded_clause["reached"], folded_clause["displayed"], folded_clause["hidden"]) == (636, 636, 0)
          assert folded_clause["hiddenShare"] == 0.0
          assert abs(folded_clause["itemsPerCall"] - sixth["display"]["clause"]["itemsPerCall"]) < 1e-9
          assert seventh["display"]["request"]["displayed"] == 461
          assert seventh["unfolded"] == 461
          assert seventh["bar"]["B1_displayed"]["holds"] is False, "R234's B1 was registered above the reachable set"
          assert seventh["bar"]["B1_displayed"]["rates"]["clause"] == 636 / 654
          assert seventh["bar"]["B2_contract"]["holds"] is True
          assert seventh["bar"]["B2_contract"]["floor"] == seventh["unfolded"] == 461
          assert seventh["bar"]["B3_hidden"]["holds"] is True
          assert seventh["bar"]["B3_hidden"]["hidden"] == 0
          # The invariant that makes the three rendering rounds one chain rather than three readings: the fold's
          # displayed column is exactly the reach its predecessor measured, and its hidden column is what remains.
          assert seventh["display"]["clause"]["displayed"] == sixth["display"]["clause"]["reached"]
          assert seventh["replication"]["display"]["clause"]["displayed"] == 621
          assert seventh["replication"]["display"]["clause"]["hidden"] == 0
          assert seventh["replication"]["bar"]["B2_contract"]["floor"] == 438
          # R236/R237. The plan's two external replications, priced from the card the dispatchers bill against.
          # These three lines are the whole argument that the twenty-dollar line was wrong, so they are pinned:
          # LoCoMo's 1,986 questions over ten conversations move 0.27M tokens at the miss rate and 53.35M at the
          # cached rate, and the pair costs under three yuan off-peak against sixty-seven uncached.
          budget = json.load(open("eval/manifests/bench-budget.json"))
          assert budget["band"] == "off_peak", budget["band"]
          assert budget["benchmarks"]["locomo"]["tokens"]["documents"] == 10
          assert budget["benchmarks"]["locomo"]["bill"]["cny"] == 1.96, budget["benchmarks"]["locomo"]["bill"]
          assert budget["benchmarks"]["memtrapbench"]["bill"]["cny"] == 0.86
          assert budget["totalCny"] == 2.82, budget["totalCny"]
          assert budget["benchmarks"]["locomo"]["bill"]["multiplier"] > 25
          # The cancelled round, whose cancellation is a result and not a gap: a 3.21-point non-inferiority gate on
          # a domain whose floor is 3.21 points cannot pass at any price, and the registry is the record of that.
          rounds = json.load(open("eval/manifests/rounds.json"))
          states = {row["id"]: row["status"] for row in rounds["rounds"]}
          assert states["R235"] == "cancelled" and states["R236"] == "registered", states
          assert states["R237"] == "registered"
          cited = [row for row in rounds["rounds"] if row["id"] == "R235"][0]
          assert cited["actualUsd"] == 0.0, cited["actualUsd"]
          print(f"ok  read {boards['strict']['coverage']:.1%} vs request {boards['request']['coverage']:.1%}; "
                f"ask {second['boards']['ask']['coverage']:.1%} with 155/232 misses disclosed after turn one; "
                f"admitted {admitted['coverage']:.1%} recovering {third['bar']['B1_recovery']['recovered']}/155 with "
                f"{third['skippedTurns']}/{third['turns']} turns answered; "
                f"clause {clause['coverage']:.1%} recovering 154/155 at "
                f"{fourth['bar']['B2_efficiency']['perWrite']:.2f} items a write; "
                f"displayed {shown_clause['displayed']}/{shown_clause['required']} "
                f"({shown_clause['displayed'] / shown_clause['required']:.1%}) with "
                f"{shown_clause['hidden']} hidden of {shown_clause['reached']} reached, "
                f"contract tax {fifth['bar']['B3_displayTax']['tax']:+d}; "
                f"open-first {ordered_clause['displayed']}/{ordered_clause['required']} with "
                f"{ordered_clause['hidden']} hidden against a bar of 97.0%; "
                f"folded {folded_clause['displayed']}/{folded_clause['required']} with "
                f"{folded_clause['hidden']} hidden, contract {seventh['bar']['B2_contract']['displayed']} against "
                f"{seventh['unfolded']}; "
                f"external pair CNY {budget['totalCny']:.2f} against CNY {budget['benchmarks']['locomo']['bill']['uncachedCny'] + budget['benchmarks']['memtrapbench']['bill']['uncachedCny']:.2f} uncached")
          CHECK

      - name: Does the request name the record, which is R227's bar and the reason the grid is still unbought
        # R227. R217a refused the airline grid because the family rule found 30.0% of its writes. The successor
        # rewrites the contract — settle by the record the ask names, whatever family the receipt is in — and its
        # registration puts a bar of 0.75 on that recall, measured before any money is spent. This step measures it
        # against the domain's own database and pins the ladder, so a later round that changes the rule has to change
        # this line on purpose rather than by drifting.
        run: |
          set -euo pipefail
          python3 eval/tools/record_census.py --goals eval/manifests/airline-records.json --family-found 15 --json > "${RUNNER_TEMP}/records.json"
          python3 - "${RUNNER_TEMP}/records.json" <<'CHECK'
          import json, sys

          reading = json.load(open(sys.argv[1]))
          assert reading["tasks"] == 50, reading["tasks"]
          assert reading["writes"] == 50, reading["writes"]
          assert (reading["writing"], reading["refusing"]) == (27, 23), (reading["writing"], reading["refusing"])
          assert reading["idOnly"] == 7, reading["idOnly"]
          assert reading["single"] == 25, reading["single"]
          assert reading["pair"] == 27, reading["pair"]
          assert reading["familyFound"] == 15, reading["familyFound"]
          assert reading["unionFound"] == 30, reading["unionFound"]
          assert reading["pairRecall"] < 0.75, reading["pairRecall"]
          print(f"ok  {reading['pair']}/{reading['writes']} graded writes are named by their record "
                f"({reading['pairRecall']:.1%}) against the 0.75 bar; {reading['unionFound']}/{reading['writes']} "
                f"with the family rule the round retires — the refusal R227 turns on")
          CHECK

      - name: The parser in a second domain, which is a measured number and not a hope
        # R217a. The board is a retail parser, and R217 would dispatch it into airline. A block whose items never
        # settle is not a null result — it is a broken instrument reporting one — so the transfer is graded **before**
        # any money is spent, against the airline tasks' own required actions.
        #
        # The gate holds two numbers in opposite directions. Retail's are asserted **unchanged**: three airline cues
        # were appended to a shared table, and the only thing that can show they did not move the retail parse is the
        # retail census. Airline's are asserted **at their measured value**, which is the round's finding — 30% family
        # recall against retail's 83.3% — so a later round that changes the contract has to change this line on
        # purpose rather than by drifting.
        run: |
          set -euo pipefail
          python3 eval/tools/goal_board.py --census --goals eval/manifests/retail-goals.json --json > "${RUNNER_TEMP}/retail.json"
          python3 eval/tools/goal_board.py --census --goals eval/manifests/airline-goals.json --json > "${RUNNER_TEMP}/airline.json"
          python3 - "${RUNNER_TEMP}/retail.json" "${RUNNER_TEMP}/airline.json" <<'PY'
          import json, sys

          retail = json.load(open(sys.argv[1]))
          airline = json.load(open(sys.argv[2]))
          assert retail["tasks"] == 114, retail["tasks"]
          assert retail["found"] == 176, retail["found"]
          assert retail["familyRecall"] >= 0.83, retail["familyRecall"]
          assert retail["spurious"] == 235, retail["spurious"]
          assert retail["tasksCovered"] == 84, retail["tasksCovered"]
          assert airline["tasks"] == 50, airline["tasks"]
          assert airline["required"] == 50, airline["required"]
          assert airline["found"] == 15, airline["found"]
          # R227. The split between tasks that had work to do and tasks whose correct outcome is that nothing happens.
          # Retail's seven were copied into the airline manifest's note as its own count (AUDIT 34.317), so both are
          # pinned here: a shared sentence cannot move a number nobody looked at again.
          assert (retail["writingTasks"], retail["refusingTasks"]) == (107, 7), (retail["writingTasks"], retail["refusingTasks"])
          assert retail["spuriousOnRefusing"] == 16, retail["spuriousOnRefusing"]
          assert (airline["writingTasks"], airline["refusingTasks"]) == (27, 23), (airline["writingTasks"], airline["refusingTasks"])
          assert airline["spuriousOnRefusing"] == 29, airline["spuriousOnRefusing"]
          print(f"ok  retail {retail['found']}/{retail['required']} objects at {retail['familyRecall']:.1%} of "
                f"families; airline {airline['found']}/{airline['required']} at {airline['familyRecall']:.1%} — the "
                f"gap R217a was registered to find")
          assert airline["familyRecall"] < retail["familyRecall"], "the airline parse caught up: re-read R217a"
          PY

      - name: Repository audit (source rules, manifests, published dependencies)
        run: pnpm audit:repo

      - name: Ablation study and gates
        run: pnpm bench

      # The library's "no runtime dependency" promise, measured on the artefact a
      # host bundles. The probe halves a ceiling and must be rejected: a budget
      # that cannot be exceeded is not a gate.
      - name: Bundle size (and the probe that proves it rejects)
        run: |
          set -euo pipefail
          pnpm bundle:size
          pnpm bundle:size -- --probe

      - name: Integrity lane (POC-28 order, determinism, schema drift)
        run: pnpm eval:integrity

      - name: Attack lane (POC-29 five formation routes)
        run: pnpm eval:memform

      - name: Pragmatics lane (L0 1,300-case rule-derived adjudication)
        run: pnpm eval:l0

      - name: Pair contrast lane (L2b single vs pair)
        run: pnpm eval:pairs

      # R110: the retrospection program itself, on a committed store. Its reader is covered to
      # 100/100/100/100, and `bin/` is excluded from coverage — so the wiring between the two is
      # checked by running it. The fixture's numbers are asserted by a test, which is what keeps this
      # step from passing on a fixture that stopped meaning what it says.
      - name: Retrospection lane (store dump → review batch)
        run: pnpm eval:retrospect-fixture

      # The L4 reader is exercised without the tau2 environment: a full grid must
      # score and a short grid must be refused rather than averaged. Both fixtures
      # are synthetic and say so in their `info` block.
      - name: Delivery lane (POC-19 signed, ordered, at-least-once)
        run: pnpm eval:delivery

      # The gate that re-derives instead of quoting: every pre-registration's declared gates must
      # equal the gates its artefact emitted, and every published cell is recomputed from the
      # committed run rather than trusted. It is what found a dev artefact named after the split
      # alone being overwritten by a second design on that split, which no schema check could see.
      - name: Protocol (pre-registrations, artefacts, published cells)
        run: pnpm eval:protocol

      - name: L4 reader (scores a full grid, refuses a short one)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/l4-score" TAU_RESULTS=eval/fixtures/tau2-synthetic-60x4.json pnpm eval:l4
          grep -q '"pass4": 1' "${RUNNER_TEMP}/l4-score/poc-l4.json"
          if POC_RESULT_DIR="${RUNNER_TEMP}/l4-refuse" TAU_RESULTS=eval/fixtures/tau2-synthetic-60x2.json pnpm eval:l4; then
            echo "the L4 reader scored a grid it must refuse"
            exit 1
          fi
          grep -q '"status_refused": 1' "${RUNNER_TEMP}/l4-refuse/poc-l4.json"
          # A driver variable that names a module which is not there is an absent
          # environment, not a failed measurement: exit 0, and say which variable.
          POC_RESULT_DIR="${RUNNER_TEMP}/l4-missing" TAU_DRIVER=./does-not-exist.mjs pnpm eval:l4
          grep -q '"status_driver_missing": 1' "${RUNNER_TEMP}/l4-missing/poc-l4.json"
          # A workflow variable that does not exist expands to the empty string, and
          # that must read as absent rather than as a path named ''.
          POC_RESULT_DIR="${RUNNER_TEMP}/l4-empty" TAU_RESULTS= TAU_DRIVER= pnpm eval:l4
          grep -q '"status_not_run": 1' "${RUNNER_TEMP}/l4-empty/poc-l4.json"

      # The second scenario, measured by the shared protocol rather than by three gates of its own.
      #
      # R52 changed what this step can assert, and the change is the point rather than a casualty.
      # τ²'s paired comparison at n = 68 resolves 21.41pp at 80% power, so the old gate — "the sample
      # must resolve 6pp" — failed here forever, for a reason no mechanism could fix. The gate now
      # grades the *claim*, and this pair claims nothing: it reports `UNRESOLVED` and `V5-resolution`
      # passes while still printing 21.41pp against the 6pp target.
      #
      # So the assertion moved from "the step exits non-zero" to "the run says which state it is in,
      # and the state it is in refuses the direction". A run that went green by claiming something it
      # could not resolve would still fail here, because the claim and the resolution are both read
      # out of the artefact and compared; a run that went green by *omitting* the claim would fail
      # too, since `claim: null` is a value the artefact has to carry.
      - name: τ² lane measured by the protocol (second-scenario conformance)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/tau2-protocol" \
            L4_FIRST=eval/results/history/l4-arm-reference-67.json \
            L4_SECOND=eval/results/history/l4-arm-memory-67.json \
            pnpm eval:l4-pair
          node -e "
            const a = require('${RUNNER_TEMP}/tau2-protocol/poc-l4-pair.json');
            const ids = a.protocol.evaluable;
            const resolution = a.gates.find((g) => g.id === 'V5-resolution');
            const resolved = a.gates.find((g) => g.id === 'l4-effect-resolved');
            const checks = [
              ['four gates fire', ids.length === 4],
              ['two of them are vacuous', a.protocol.vacuous.length === 2],
              ['thirty-six are absent', a.protocol.absent.length === 36],
              ['fourteen supplyable', a.protocol.supplyable === 14],
              ['twenty-six arm-indexed', a.protocol.armIndexed === 26],
              ['the resolution gate fired', resolution !== undefined],
              ['and it blocks', resolution.blocking === true],
              ['and it names the minimum detectable difference', resolution.actual.includes('21.41pp')],
              // R52: green here means the pair claimed nothing, and the artefact has to say so in
              // words. A run cannot pass by staying silent: silence is an absent field, and an
              // absent field is graded by the 6pp bar this sample cannot meet.
              ['and it passes because no direction was claimed', resolution.pass === true],
              ['which the sentence states', resolution.actual.includes('the run claims no direction')],
              ['the pair states its verdict', a.verdict.state === 'UNRESOLVED'],
              ['and carries a null claim rather than an absent one', a.verdict.claim === null],
              ['the readout still refuses the direction it cannot resolve', resolved !== undefined],
              ['and that refusal does not block', resolved.blocking === false && resolved.pass === false],
              ['and the effect did not move', Math.abs(a.comparison.deltaPp - 1.4706) < 0.001],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) {
              console.error('τ² protocol conformance failed: ' + bad.join(', '));
              process.exit(1);
            }
          "

      # The audit the record never ran on itself: every published paired delta beside the smallest
      # effect its own sample could have resolved. The arithmetic is re-derived here rather than
      # trusted, because the whole point of the table is that the numbers in it were never put on a
      # common scale — a row that disagreed with its own tally would be the defect it audits.
      - name: Power audit (every published delta against its own resolution)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/power" pnpm eval:power
          diff -u eval/results/poc-power-audit.json "${RUNNER_TEMP}/power/poc-power-audit.json"
          node -e "
            const a = require('${RUNNER_TEMP}/power/poc-power-audit.json');
            const bad = [];
            for (const r of a.rows) {
              const d = r.helped + r.harmed;
              const se = (Math.sqrt(d) / r.n) * 100;
              if (Math.abs(r.deltaPp - ((r.helped - r.harmed) / r.n) * 100) > 1e-9) bad.push(r.artefact + ': delta');
              if (Math.abs(r.halfWidthPp - 1.96 * se) > 1e-9) bad.push(r.artefact + ': half-width');
              if (Math.abs(r.minDetectablePp - 2.802 * se) > 1e-9) bad.push(r.artefact + ': resolution');
              if (r.resolvable && !r.significant95) bad.push(r.artefact + ': resolvable but not within 95%');
            }
            if (a.rows.length !== a.total) bad.push('row count disagrees with the total');
            if (a.resolvable > a.significant95) bad.push('the stricter bar counted more rows than the looser one');
            if (bad.length > 0) { console.error('power audit failed: ' + bad.join(', ')); process.exit(1); }
            console.log('power audit: ' + a.rows.length + ' artifacts, ' + a.resolvable + ' above 80% power, ' +
              a.significant95 + ' above the 95% half-width');
          "

      # R152: the two folds recomposed from the two pair artefacts, and the pooled reading recomputed
      # from the records.
      #
      # A cross-fit is two deterministic steps — compose, then pool — and every claim it makes is a
      # property of the files it reads: no fold evaluates a task its store learned from, the two folds
      # tile the corpus once, and the pooled delta is its own discordant counts. Each of those is
      # asserted beside the byte comparison, because a diff nobody reads is not a check.
      - name: Fold records (recomposed from the two pairs, and the tiling asserted)
        run: |
          set -euo pipefail
          pnpm eval:fold-records eval/results/poc-l4-pair-official.json eval/results/poc-l4-pair-swapped.json --out-dir "${RUNNER_TEMP}/folds"
          diff -u eval/results/folds/poc-l4-pair-official.json "${RUNNER_TEMP}/folds/poc-l4-pair-official.json"
          diff -u eval/results/folds/poc-l4-pair-swapped.json "${RUNNER_TEMP}/folds/poc-l4-pair-swapped.json"
          node -e "
            const a = require('./eval/results/folds/poc-l4-pair-official.json');
            const b = require('./eval/results/folds/poc-l4-pair-swapped.json');
            const bad = [];
            for (const [name, r] of [['official', a], ['swapped', b]]) {
              const scored = new Set(r.foldSplit.evaluated);
              const leak = r.foldSplit.learned.filter((id) => scored.has(id));
              if (leak.length > 0) bad.push(name + ': evaluates ' + leak.length + ' task(s) it learned from');
              if (r.ledger.length !== scored.size) bad.push(name + ': ledger rows disagree with the evaluation half');
              if (r.foldSplit.learned.length + r.foldSplit.evaluated.length !== 114) bad.push(name + ': the two halves are not the corpus');
            }
            const union = new Set([...a.foldSplit.evaluated, ...b.foldSplit.evaluated]);
            if (union.size !== 114) bad.push('the folds answer ' + union.size + ' distinct task(s), not 114');
            if (bad.length > 0) { console.error('fold records failed: ' + bad.join(', ')); process.exit(1); }
            console.log('fold records: ' + a.foldSplit.evaluated.length + ' + ' + b.foldSplit.evaluated.length +
              ' task(s), no leak, tiling the corpus once');
          "

      - name: Cross-fit (recomputed, and the pooled reading asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/crossfit" pnpm eval:cross-fit eval/results/folds/poc-l4-pair-official.json eval/results/folds/poc-l4-pair-swapped.json
          diff -u eval/results/poc-cross-fit.json "${RUNNER_TEMP}/crossfit/poc-cross-fit.json"
          node -e "
            const a = require('${RUNNER_TEMP}/crossfit/poc-cross-fit.json');
            const bad = [];
            const n = a.reading.tasks;
            const folds = a.folds.reduce((sum, f) => sum + f.tasks, 0);
            const se = (Math.sqrt(a.reading.discordance * n) / n) * 100;
            if (folds !== n) bad.push('pooled n disagrees with the folds it pooled');
            if (Math.abs(a.reading.deltaPp - ((a.reading.gained - a.reading.lost) / n) * 100) > 1e-9) bad.push('delta');
            if (Math.abs(a.reading.mde80Pp - 2.802 * se) > 1e-9) bad.push('mde80');
            if (!a.census.tiles) bad.push('the folds do not tile');
            if (a.census.agreeInSign !== (a.folds.every((f) => f.deltaPp >= 0) || a.folds.every((f) => f.deltaPp <= 0))) {
              bad.push('the sign flag disagrees with the per-fold rows');
            }
            if (bad.length > 0) { console.error('cross-fit failed: ' + bad.join(', ')); process.exit(1); }
            console.log('cross-fit: ' + n + ' pairs, delta ' + a.reading.deltaPp.toFixed(2) + 'pp, mde80 ' +
              a.reading.mde80Pp.toFixed(2) + 'pp, folds ' + (a.census.agreeInSign ? 'agree' : 'disagree') + ' in sign');
          "

      # R28: the harm stratification, recomputed from the committed run rather than trusted.
      #
      # The artefact is a pure function of one committed file, so the check is a byte comparison —
      # which is only possible because it records no clock of its own. The assertions beside it are
      # there so that a change in the bucketing shows up as a named failure rather than as a diff
      # nobody reads: the four buckets must still cover the whole corpus, the minimum must still sit
      # where the reading says, and the criteria must still come out as they are published.
      - name: Harm stratification (recomputed, and its verdict asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/harm" pnpm eval:harm
          diff -u eval/results/poc-harm-strata.json "${RUNNER_TEMP}/harm/poc-harm-strata.json"
          node -e "
            const a = require('${RUNNER_TEMP}/harm/poc-harm-strata.json');
            const codes = a.criteria.map((c) => c.code).join(',');
            const checks = [
              ['four buckets', a.buckets.length === 4],
              ['covering every question once', a.buckets.reduce((sum, b) => sum + b.n, 0) === a.n],
              ['all 1,534 of them', a.n === 1534],
              ['the paired delta is the artefact it re-reads', Math.abs(a.paired.deltaPp - 0.3259) < 0.001],
              ['five criteria, always', codes === 'S1,S2,S3,S4,S5'],
              ['the registration is refuted', a.refuted === true],
              ['with the minimum at the top bucket', a.minimum === 3],
              ['and a gap below its own resolution', a.gapPp < a.gapMinDetectablePp],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('harm stratification failed: ' + bad.join(', ')); process.exit(1); }
            console.log('harm stratification: ' + checks.length + ' checks pass');
          "

      # R30 stage 1: what the pack did to the query, recomputed from the committed run.
      #
      # The artefact is a pure function of one committed file — no model, no database, no clock — so
      # the check is a byte comparison. The assertions beside it pin the five registered verdicts: a
      # change in the classifier that flipped one of them would otherwise arrive as a diff nobody
      # reads, and this round's entire claim is that those five numbers separate help from harm.
      - name: Query diff (recomputed, and its verdict asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/query-diff" pnpm eval:query-diff
          diff -u eval/results/poc-query-diff.json "${RUNNER_TEMP}/query-diff/poc-query-diff.json"
          node -e "
            const a = require('${RUNNER_TEMP}/query-diff/poc-query-diff.json');
            const f1 = a.features.find((f) => f.code === 'F1');
            const f2 = a.features.find((f) => f.code === 'F2');
            const strict = a.gates.find((g) => g.mode === 'strict');
            const total = a.kinds.reduce((sum, k) => sum + k.cell.n, 0);
            const unchanged = a.kinds.find((k) => k.kind === 'unchanged').cell;
            const codes = a.criteria.map((c) => c.code).join(',');
            const checks = [
              ['every case lands in exactly one kind', total === a.n],
              ['all 1,534 of them', a.n === 1534],
              ['692 queries the pack did not touch', unchanged.n === 692],
              ['not one of them flipped', unchanged.helped === 0 && unchanged.harmed === 0],
              ['the paired delta is the artefact it re-reads', Math.abs(a.gates[0].measured.deltaPp - 0.3259) < 0.001],
              ['the identifier covariate separates', f1.gapPp < 0 && Math.abs(f1.gapPp) > f1.gapHalfWidthPp],
              ['and it separates under the looser rule too', f2.gapPp < 0 && Math.abs(f2.gapPp) > f2.gapHalfWidthPp],
              ['both exact tests agree at 0.05', f1.fisherP < 0.05 && f2.fisherP < 0.05],
              ['the clustered interval excludes zero', f1.clusterHighPp < 0],
              ['the gate raises the delta', strict.gated.deltaPp > strict.measured.deltaPp],
              ['the gate does not reach 80% power', strict.resolvable === false],
              ['five criteria, always', codes === 'Q1,Q2,Q3,Q4,Q5'],
              ['the registration is not refuted', a.refuted === false],
              ['the pruned-name category is reported as unmeasured', a.unmeasured.length === 1 && a.unmeasured[0].category === 'pruned-name'],
              ['one hypothesis out of five survives the multiplicity correction', a.multiplicity.familySize === 5 && a.multiplicity.survivors.join(',') === 'F1'],
              ['and the corrected threshold is 0.05 over five', Math.abs(a.multiplicity.bonferroniAlpha - 0.01) < 1e-12],
              ['the pre-treatment version of the gate has the wrong sign', a.ruleLevel.present.deltaPp > 0],
              ['and it does not find what F1 finds', a.ruleLevel.agreement.recall < 0.5 && a.ruleLevel.agreement.precision < 0.5],
              ['most rules name nothing a detector can see', a.ruleLevel.namingShare < 0.2],
              ['the pool is five folds of fewer sentences than rows', a.ruleLevel.rules === 1066 && a.ruleLevel.sentences === 271],
              ['and both counts give the same naming share', Math.abs(a.ruleLevel.namingShare - a.ruleLevel.sentencesNaming / a.ruleLevel.sentences) < 0.01],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('query diff failed: ' + bad.join(', ')); process.exit(1); }
            console.log('query diff: ' + checks.length + ' checks pass, F1 gap ' + f1.gapPp.toFixed(2) +
              'pp over ' + f1.present.n + ' questions at p=' + f1.fisherP.toFixed(4));
          "

      # R31: where the imported name came from, recomputed from the same committed run.
      #
      # The reading decides whether the product statement §140 licensed survives, so the assertions
      # pin the withdrawal itself rather than only the arithmetic: if a later change to the tokeniser
      # or the detector flipped the verdict, this step is where it would have to be argued for.
      - name: Pack mediation (recomputed, and the withdrawal asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/mediation" pnpm eval:mediation
          diff -u eval/results/poc-pack-mediation.json "${RUNNER_TEMP}/mediation/poc-pack-mediation.json"
          node -e "
            const a = require('${RUNNER_TEMP}/mediation/poc-pack-mediation.json');
            const p = a.primary;
            const code = (c) => p.criteria.find((e) => e.code === c);
            const bucket = (s) => p.strata.find((e) => e.source === s).cell.n;
            const sum = p.contribution.pack + p.contribution.schema + p.contribution.unverifiable;
            const checks = [
              ['the corpus is the dev run', a.corpus.cases === 1534],
              ['155 of them import an ungrounded name', p.importing === 155 && p.notImporting === 1379],
              ['the pack names the identifier in 60 of them', bucket('pack') === 60],
              ['and says nothing alike in 94', bucket('schema') === 94],
              ['one statement never ran', bucket('unverifiable') === 1],
              ['the two buckets are damaged equally', Math.abs(p.split.gapPp - 1.24) < 0.02],
              ['so the mechanism does not clear its own half-width', p.split.resolves === false],
              ['four criteria, always', p.criteria.map((c) => c.code).join(',') === 'M1,M2,M3,M4'],
              ['availability holds at 38.7%', code('M1').ok === true],
              ['and fails the generous detector', code('M2').ok === false],
              ['the mechanism is not shown', code('M3').ok === false],
              ['the pack carries a third of the gate, not half', code('M4').ok === false],
              ['so the product statement is withdrawn', p.statementWithdrawn === true],
              ['the gate it refuses is worth +0.98pp', Math.abs(p.contribution.total - 0.98) < 0.01],
              ['of which a third comes from questions the pack named', Math.abs(p.contribution.pack - 0.33) < 0.01],
              ['and 60% from questions it never named', Math.abs(p.contribution.schema - 0.59) < 0.01],
              ['the parts add up to the whole', Math.abs(sum - p.contribution.total) < 1e-9],
              ['285 names, 79 of them spelled out by a rule', p.byName.total === 285 && p.byName.exact === 79],
              ['the generous detector is reported too', a.generous.detector === 'flattened' && a.generous.statementWithdrawn === true],
              ['the pack text was read, not reconstructed', a.corpus.reconstructedPackText === 0 && a.corpus.withoutPackText === 0],
              ['the vocabulary of unattributed names is not empty', a.unattributed.length > 0],
              ['the synonym gap is reported as unmeasured', a.unmeasured.some((u) => u.category === 'synonym')],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('mediation failed: ' + bad.join(', ')); process.exit(1); }
            console.log('mediation: ' + checks.length + ' checks pass, pack supplies ' + (60 / 155 * 100).toFixed(1) +
              '% of the flagged names, damage equal in both buckets (' + p.split.gapPp.toFixed(2) + 'pp +/- ' +
              p.split.gapHalfWidthPp.toFixed(2) + ')');
          "

      # R31b: the gate's estimate taken apart three ways, recomputed from the same committed run.
      - name: Gate stability (recomputed, and the estimate asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/stability" pnpm eval:stability
          diff -u eval/results/poc-gate-stability.json "${RUNNER_TEMP}/stability/poc-gate-stability.json"
          node -e "
            const a = require('${RUNNER_TEMP}/stability/poc-gate-stability.json');
            const s = a.strict;
            const checks = [
              ['the corpus is the dev run', a.n === 1534],
              ['the gate discards 155', s.discarded === 155],
              ['and is worth +0.98pp', Math.abs(s.observedPp - 0.98) < 0.01],
              ['eleven databases, one removed at a time', s.jackknife.length === 11],
              ['no single database carries it', s.jackknifeMinPp > 0],
              ['the placement beats random subsets', s.permutation.p < 0.001],
              ['five thousand draws', s.permutation.resamples === 5000],
              ['both halves keep the improvement', s.halves.length === 2 && s.halves.every((h) => h.improvementPp > 0)],
              ['three readings, always', s.criteria.map((c) => c.code).join(',') === 'S1,S2,S3'],
              ['all three pass', s.unstable === false],
              ['the looser grounding rule discards fewer', a.loose.discarded === 114],
              ['and the split-half limitation is stated', a.unmeasured.some((u) => u.category === 'out-of-sample')],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('stability failed: ' + bad.join(', ')); process.exit(1); }
            console.log('stability: ' + checks.length + ' checks pass, leave-one-out ' + s.jackknifeMinPp.toFixed(2) +
              'pp to ' + s.jackknifeMaxPp.toFixed(2) + 'pp, permutation p=' + s.permutation.p.toFixed(4));
          "

      # R32 prediction 2: whether the second-closest feature is a second cause or the first one
      # counted twice. The assertions pin the finding — two `inert` verdicts — rather than only the
      # arithmetic, because the verdicts are what the registration asked for and a change in the
      # tokeniser that moved them would have to be argued for here.
      - name: Feature overlap (recomputed, and both verdicts asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/overlap" pnpm eval:feature-overlap
          diff -u eval/results/poc-feature-overlap.json "${RUNNER_TEMP}/overlap/poc-feature-overlap.json"
          node -e "
            const a = require('${RUNNER_TEMP}/overlap/poc-feature-overlap.json');
            const v = Object.fromEntries(a.verdicts.map((x) => [x.pair, x]));
            const p = Object.fromEntries(a.pairs.map((x) => [x.pair, x.reading]));
            const checks = [
              ['the corpus is the dev run', a.n === 1534],
              ['two pairs, always', a.verdicts.length === 2 && a.verdicts.map((x) => x.pair).join(',') === 'F1/F4,F1/F5'],
              ['F1 and F4 share 70 questions', p['F1/F4'].both === 70],
              ['85 carry F1 alone and 7 carry F4 alone', p['F1/F4'].leftOnly === 85 && p['F1/F4'].rightOnly === 7],
              ['the overlap is 45.2%, inside the 50% bar', Math.abs(v['F1/F4'].overlapShare - 0.452) < 0.001 && v['F1/F4'].criterionMet === true],
              ['but F4 is worth exactly nothing outside F1', p['F1/F4'].rightOutsideLeft.deltaPp === 0],
              ['so the table-set axis is inert, not a second cause', v['F1/F4'].kind === 'inert'],
              ['F5 overlaps F1 by only 7.7%', Math.abs(v['F1/F5'].overlapShare - 0.0774) < 0.001],
              ['and is worth -3.57pp on the 28 it adds', Math.abs(p['F1/F5'].rightOutsideLeft.deltaPp + 3.571) < 0.01],
              ['which does not resolve, so it is inert too', p['F1/F5'].rightOutsideLeft.n === 28 && v['F1/F5'].kind === 'inert'],
              ['the four cells partition the corpus', a.pairs.every((x) => x.reading.both + x.reading.leftOnly + x.reading.rightOnly + x.reading.neither === 1534)],
              ['and the criterion quotes its own bar', p['F1/F4'].criterion.includes('50%')],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('overlap failed: ' + bad.join(', ')); process.exit(1); }
            console.log('overlap: ' + checks.length + ' checks pass, F1/F4 ' + (v['F1/F4'].overlapShare * 100).toFixed(1) +
              '% overlap and ' + v['F1/F4'].kind + ', F1/F5 ' + (v['F1/F5'].overlapShare * 100).toFixed(1) + '% and ' + v['F1/F5'].kind);
          "

      # R32 axis 1: whether a corpus can tell a procedural rule from a declarative one. The
      # assertions pin the two things the reading found rather than only its arithmetic — the census
      # that refused the axis, and the pool counts that made an id-keyed lookup impossible to miss.
      - name: Rule form (recomputed, and the axis verdict asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/rule-form" pnpm eval:rule-form
          diff -u eval/results/poc-rule-form.json "${RUNNER_TEMP}/rule-form/poc-rule-form.json"
          node -e "
            const a = require('${RUNNER_TEMP}/rule-form/poc-rule-form.json');
            const c = a.census.strict;
            const r = a.census.relaxed;
            const cov = a.coverage;
            const whole = a.residual.whole;
            const outside = a.residual.withoutImportedName;
            const db = a.residual.perDatabase;
            const checks = [
              ['the corpus is the dev run', a.n === 1534],
              ['the pool is rows, and rows are folds', a.pool.rows === 1066],
              ['a rule id is a slot reused across folds, so sentences are fewer', a.pool.sentences === 271 && a.pool.slots === 229 && a.pool.sentences < a.pool.rows],
              ['220 of the slots are cited by a question', a.pool.cited === 220],
              ['most sentences carry both marker kinds', c.both === 157 && Math.abs(c.bothShare - 0.5793) < 0.001],
              ['which is over the registered bar, so the axis is refused', c.bothShare > a.bar && a.axisUsable === false && a.verdict === 'unmeasurable'],
              ['and a looser marker set does not save it', Math.abs(r.bothShare - 0.6568) < 0.001 && r.bothShare > a.bar],
              ['the two censuses are over the same sentences', c.n === 271 && r.n === 271],
              ['the four pack forms partition the corpus', cov.procedural + cov.declarative + cov.mixed + cov.none === a.n],
              ['487 procedural and 330 declarative packs', cov.procedural === 487 && cov.declarative === 330 && cov.mixed === 100 && cov.none === 617],
              ['both groups span every database, so neither is a single-cluster artefact', whole.proceduralClusters === 11 && whole.declarativeClusters === 11],
              ['the residual points the opposite way to prediction 3', whole.gapPp > 0 && whole.declarative.deltaPp < 0],
              ['and is larger where no name was imported', outside.gapPp > whole.gapPp],
              ['the interval brackets its own point estimate', whole.gapLowPp <= whole.gapPp && whole.gapPp <= whole.gapHighPp],
              ['four of eleven databases disagree with the pooled sign', db.databases === 11 && db.negative === 4 && db.positive === 6],
              ['two reasons are recorded for the refusal', a.reasons.length === 2],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('rule form failed: ' + bad.join(', ')); process.exit(1); }
            console.log('rule form: ' + checks.length + ' checks pass, ' + c.both + '/' + c.n + ' sentences carry both (' +
              (c.bothShare * 100).toFixed(1) + '% against a ' + (a.bar * 100) + '% bar), residual gap ' +
              whole.gapPp.toFixed(2) + 'pp with ' + db.negative + ' of ' + db.databases + ' databases against it');
          "

      # R32 axis 3: whether the damage is a property of an ambiguous question. The assertion that
      # matters is the one that refuses the prediction — the band naming none of its columns is
      # destroyed least, and both difficulty strata that can be read say so independently.
      - name: Referent coverage (recomputed, and the refutation asserted)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/referent" pnpm eval:referent
          diff -u eval/results/poc-referent.json "${RUNNER_TEMP}/referent/poc-referent.json"
          node -e "
            const a = require('${RUNNER_TEMP}/referent/poc-referent.json');
            const o = a.overall;
            const sum = a.buckets.reduce((total, b) => total + o[b].n, 0);
            const strata = (name) => a.byDifficulty.find((d) => d.difficulty === name).strata;
            const checks = [
              ['the corpus is the dev run', a.n === 1534],
              ['the four bands partition it', sum === a.n],
              ['nothing is named in 131 questions', o.none.n === 131],
              ['everything is named in 181', o.all.n === 181],
              ['the band that names nothing starts most correct than the middle band', o.none.baselineAccuracy > o.most.baselineAccuracy],
              ['and is destroyed least of all four', o.none.harmedPerCorrectPp < Math.min(o.few.harmedPerCorrectPp, o.most.harmedPerCorrectPp, o.all.harmedPerCorrectPp)],
              ['so the ambiguity axis is refuted', a.verdict === 'refuted'],
              ['the simple stratum says the same', strata('simple').none.harmedPerCorrectPp < strata('simple').most.harmedPerCorrectPp],
              ['and so does the moderate one', strata('moderate').none.harmedPerCorrectPp < strata('moderate').most.harmedPerCorrectPp],
              ['the reading names the direction rather than only the verdict', a.reading.includes('least damaged')],
              ['four bands, always', a.buckets.join(',') === 'none,few,most,all'],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('referent failed: ' + bad.join(', ')); process.exit(1); }
            console.log('referent: ' + checks.length + ' checks pass, destroyed ' + o.none.harmedPerCorrectPp.toFixed(2) +
              '% where nothing is named against ' + o.all.harmedPerCorrectPp.toFixed(2) + '% where everything is');
          "

      - name: Out of sample (recomputed, the registrations adjudicated, and the filter priced)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/oos" pnpm eval:out-of-sample
          diff -u eval/results/poc-out-of-sample.json "${RUNNER_TEMP}/oos/poc-out-of-sample.json"
          node -e "
            const a = require('${RUNNER_TEMP}/oos/poc-out-of-sample.json');
            const verdict = (id) => a.verdicts.find((v) => v.id === id);
            const checks = [
              ['both corpora are the ones registered', a.datasets.dev === 'BIRD dev' && a.datasets.train === 'BIRD train (out-of-sample)'],
              ['the out-of-sample corpus is the 7,000-question run over 58 databases', a.train.clustered.questions === 7000 && a.train.clustered.clusters === 58],
              ['the memory arm is negative there', Math.abs(a.train.deltaPp + 0.7142857142857143) < 1e-9],
              ['and stays negative when the interval is resampled over databases', a.train.clustered.resolved === true && a.train.clustered.highPp < 0],
              ['which is the check that closed R32s first axis and this headline survives', a.train.clustered.lowPp > -1.4 && a.train.clustered.lowPp < -1.1],
              ['all five folds point the same way', a.train.folds.negative === 5 && a.train.folds.positive === 0],
              ['and five folds cannot reach p < 0.05 however unanimous they are', Math.abs(a.train.folds.p - 0.0625) < 1e-12],
              ['on dev the same arm is positive and unresolved', a.dev.deltaPp > 0 && a.dev.clustered.resolved === false],
              ['the gate recovered about half of what dev promised', Math.abs(a.dev.gate.improvementPp - 0.9778) < 0.001 && Math.abs(a.train.gate.improvementPp - 0.5143) < 0.001],
              ['so the product is not better than no memory out of sample', a.train.gate.gatedDeltaPp < 0 && Math.abs(a.train.gate.gatedDeltaPp + 0.2) < 1e-9],
              ['the statement says exactly that, from the numbers', a.statement.includes('not distinguishable from no memory') && a.statement.includes('0.71pp') && a.statement.includes('0.51pp')],
              ['the arm clears the 95% interval and misses the 80% bar', a.train.resolution.significant95 === true && a.train.resolution.resolvable === false],
              ['and is filed under the name the power audit prints for it', a.train.resolution.label === 'within 95% but under 80% power'],
              ['the resolution it misses is the 0.82pp one this sample was sized for', Math.abs(a.train.resolution.minDetectablePp - 0.8242) < 0.001],
              ['the dev arm is filed as underpowered, which it always was', a.dev.resolution.label === 'underpowered'],
              ['and the statement carries both bars rather than only the interval', a.statement.includes('80%-power resolution')],
              ['P1 holds: the run was measurable', verdict('P1').holds === true],
              ['P2 is refuted: it is significantly different from the none arm', verdict('P2').holds === false],
              ['P3 holds: the gate is inside the registered wide band', verdict('P3').holds === true && a.train.gate.improvementPp >= 0.2 && a.train.gate.improvementPp <= 2.0],
              ['P4 holds: shrinkage of less than half, inside [0.49, 0.98]', verdict('P4').holds === true],
              ['P5 holds: an imported name is still negative', verdict('P5').holds === true && a.train.imported.deltaPp < 0],
              ['the imported cohort is 548 questions and carries most of the harm', a.train.imported.n === 548],
              ['nothing in the table compares an accuracy across splits', a.table.some((row) => /accuracy/i.test(row.label)) === false],
              ['seven rows, one per comparable quantity', a.table.length === 7],
            ];
            // The discordance block, asserted for the same reason the verdicts are: it is the reading
            // the product decision rests on, and a corpus that moved under it would change the decision
            // without failing anything else. Both splits, because the finding is the difference.
            const d = a.discordance;
            checks.push(
              ['the out-of-sample corpus splits 2,925 that could only be helped against 4,075 that could only be harmed', d.train.attempted.n === 2925 && d.train.correct.n === 4075],
              ['the pack repairs 6.39% of the wrong answers', Math.abs(d.train.attempted.ratePp - 6.3931623931623935) < 1e-9],
              ['and breaks 5.82% of the right ones', Math.abs(d.train.correct.ratePp - 5.815950920245399) < 1e-9],
              ['so help is likelier per question and harm is likelier per corpus', d.train.attempted.ratePp > d.train.correct.ratePp && Math.abs(d.train.helpPerHarm - 0.7890295358649789) < 1e-9],
              ['a filter that saw every break would be worth 3.39pp', Math.abs(d.train.ceilingPp - 3.3857142857142857) < 1e-9],
              ['this one discards 548 questions, catching 76 breaks and 40 repairs', d.train.filter.discarded === 548 && d.train.filter.caughtOfBroken === 76 && d.train.filter.caughtOfRepaired === 40],
              ['which is 15.2 questions per net error and 15.2% of the ceiling', Math.abs(d.train.filter.discardedPerNetError - 15.222222222222221) < 1e-9 && Math.abs(d.train.shareOfCeiling - 0.15189873417721517) < 1e-9],
              ['the filter reading and the gate reading are one number computed twice', Math.abs(d.train.realisedPp - a.train.gate.improvementPp) < 1e-9 && Math.abs(d.dev.realisedPp - a.dev.gate.improvementPp) < 1e-9],
              ['dev sits the other side of one repair per break', d.dev.helpPerHarm > 1 && Math.abs(d.dev.helpPerHarm - 1.0806451612903225) < 1e-9],
              ['and its filter was already weak in sample', Math.abs(d.dev.shareOfCeiling - 0.24193548387096775) < 1e-9 && Math.abs(d.dev.filter.discardedPerNetError - 10.333333333333334) < 1e-9],
              ['the statement quotes both sides of the asymmetry', d.statement.includes('0.79 repairs per break') && d.statement.includes('base is not symmetric')],
              ['and its ceiling, its realisation and the share between them', d.statement.includes('3.39pp') && d.statement.includes('0.51pp') && d.statement.includes('15.2% of the ceiling')],
            );
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('out-of-sample failed: ' + bad.join(', ')); process.exit(1); }
            console.log('out-of-sample: ' + checks.length + ' checks pass, delta ' + a.train.deltaPp.toFixed(2) +
              'pp [' + a.train.clustered.lowPp.toFixed(2) + ', ' + a.train.clustered.highPp.toFixed(2) +
              '], gate +' + a.train.gate.improvementPp.toFixed(2) + 'pp, net ' + a.train.gate.gatedDeltaPp.toFixed(2) +
              'pp, filter realises ' + (d.train.shareOfCeiling * 100).toFixed(1) + '% of a ' + d.train.ceilingPp.toFixed(2) + 'pp ceiling');
          "

      # R33 stage 0: whether the filter survives being pointed at one query instead of at a
      # difference. The assertions pin the finding the product decision rests on — the flag fires on
      # almost everything and its Youden index is a quarter of the filter's — rather than only the
      # arithmetic, because a tokeniser change that moved any of it would have to be argued for here.
      - name: Validity without a baseline (recomputed, and all six registrations adjudicated)
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/validity" pnpm eval:validity
          diff -u eval/results/poc-validity.json "${RUNNER_TEMP}/validity/poc-validity.json"
          node -e "
            const a = require('${RUNNER_TEMP}/validity/poc-validity.json');
            const v = (id) => a.verdicts.find((x) => x.id === id);

              ['and still returns -0.05pp on an interval that covers zero', Math.abs(a.selection['self-knowledge'].confirmation.netPp + 0.05305039787798408) < 1e-12 && a.selection['self-knowledge'].confirmation.clears === false],
              ['so P5 is refuted: the precision bar is met and the gain is not', v('P5').holds === false],
              ['the bar moves with the selection: inside the admitted set breaks reach 9.68pp against repairs of 5.61pp', Math.abs(a.selection['self-knowledge'].within.confirmation.breakRatePp - 9.683794466403162) < 1e-12 && Math.abs(a.selection['self-knowledge'].within.confirmation.repairRatePp - 5.608591885441527) < 1e-12],
              ['neither relevance gate clears, so the topic of what arrives is still not the variable', v('P6').holds === true && a.selection['coverage-high'].confirmation.clears === false && a.selection['coverage-low'].confirmation.clears === false],
              ['P7 is refuted for a reason the file did not anticipate: it was written for a positive discovery gain', v('P7').holds === false && a.selection['self-knowledge'].discovery.netPp < 0],
              ['the best point any registered curve reached out of sample is +0.11pp at 14.8% coverage', a.frontier.gate === 'conjunction' && Math.abs(a.frontier.reading.confirmation.netPp - 0.10610079575596816) < 1e-12 && Math.abs(a.frontier.reading.confirmation.share - 0.14774535809018569) < 1e-12],
              ['on an interval that covers zero, which is 4% of the 2.67pp ceiling', a.frontier.reading.confirmation.clears === false && a.frontier.reading.confirmation.lowPp < 0 && a.frontier.shareOfCeiling < 0.04],
              ['the statement quotes the hurdle, the precision and the share of the ceiling', a.statement.includes('1.393') && a.statement.includes('62.4%') && a.statement.includes('2.67pp') && a.statement.includes('4% of it')],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('admission failed: ' + bad.join(', ')); process.exit(1); }
            console.log('admission: ' + checks.length + ' checks pass, exchange ' + e.helpPerHarm.toFixed(3) +

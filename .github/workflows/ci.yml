              ['18 rows decided at 80% power, 27 at a 95% interval', l.decided + l.undecided === l.rows && l.significant95 >= l.decided && l.decided === a.readings.filter((x) => x.decided).length],
              ['no decided row is smaller than 4pp, so nothing the product cares about was ever decided', Math.min(...decided) === 4.5714 && Math.max(...decided) === 32.5714 && decided.length === 18],
              ['the largest claim is the oracle at +32.57pp, on a design resolving 8.62pp', l.largest.arm === 'oracle' && l.largest.deltaPp === 32.5714 && l.largest.minDetectablePp === 8.6224],
              ['the sharpest design in the record is the 7,000-question run at 0.82pp, and its memory delta sits outside that bar', l.sharpest.artefact === 'poc-sota-bird-train.json' && l.sharpest.minDetectablePp === 0.8242 && l.sharpest.deltaPp === -0.7143 && a.readings.filter((x) => x.artefact === l.sharpest.artefact)[0].significant95 === true && a.readings.filter((x) => x.artefact === l.sharpest.artefact)[0].decided === false],
              ['three design sizes impose floors of 4.38, 2.07 and 0.82pp', floor(350).medianPp === 4.3849 && floor(350).rows > 0 && floor(1534).medianPp === 2.0746 && floor(1534).rows === 22 && floor(7000).medianPp === 0.8242 && a.floors.length === 3],
              ['full - none was measured 21 times: 18 negative, 3 positive, 1 decided, 6 inside a 95% interval', m.runs === m.negative + m.positive && m.negative > m.positive && m.runs === a.readings.filter((x) => x.arm === 'full' && x.control === 'none').length],
              ['its median magnitude falls from 2.57pp to 0.33pp when the sample grows 4.4x', shrink.points.length === 3 && shrink.points[0].medianAbsPp === 2.5714 && shrink.points[1].medianAbsPp === 0.3259 && shrink.direction === 'fell'],
              ['the values channel is two contrasts and not one: +1.17pp against none, +0.85pp against full', values.length === 4 && values[0].deltaPp === 1.4286 && values[2].deltaPp === 1.1734 && values[3].deltaPp === 0.8475 && values[3].control === 'full'],
              ['linked is the counter-example: its effect grows with the sample and is decided at both sizes', linked[0].deltaPp === -7.7143 && linked[1].deltaPp === -9.2568 && linked.every((x) => x.decided) && a.shrinkage.find((x) => x.contrast === 'linked \u2212 none').direction === 'rose'],
              ['85 undecided rows are priced, five zero effects are not, and the dearest costs 1,457,294 questions', a.priceList.length === l.undecided && priced.length === a.priceList.length - a.priceList.filter((x) => x.deltaPp === 0).length && Math.max(...priced.map((x) => x.requiredN)) === 1457294],
              ['V71 is advisory and the two gates it depends on block', g['V71-the-price-is-not-below-its-own-sample'] === true && a.gates.find((x) => x.id.startsWith('V71')).blocking === false && a.gates.filter((x) => x.id !== 'V71-the-price-is-not-below-its-own-sample').every((x) => x.blocking)],
              ['the statement quotes the arithmetic rather than a verdict', a.statement.includes('103 arm rows') && a.statement.includes('18 decided') && a.statement.includes('underpowered') === false && a.statement.includes('inconclusive') === false],
            ];
            const bad = checks.filter(([, ok]) => !ok).map(([name]) => name);
            if (bad.length > 0) { console.error('resolution ledger failed: ' + bad.join(', ')); process.exit(1); }
            console.log('resolution ledger: ' + checks.length + ' checks pass, ' + l.rows + ' rows, ' + l.decided +
              ' decided, ' + m.runs + ' memory runs of which ' + m.decided + ' decided');
          "

      - name: The scenario is a measurement, not a paragraph
        # The eleven assertions live in `scripts/check-coupling-ledger.mjs` rather than inline here,
        # because an inline `node -e` string is the one place in this workflow that no test can reach
        # -- and because `pnpm check` did not make this comparison at all, so two pushes went red on a
        # committed ledger describing a tree that had grown two modules while every local gate was
        # green. The script runs the same claims, has fixtures for each, and is called from both
        # places now, which is what makes the local gate the CI gate.
        run: |
          set -euo pipefail
          POC_RESULT_DIR="${RUNNER_TEMP}/coupling" pnpm eval:coupling
          node scripts/check-coupling-ledger.mjs "${RUNNER_TEMP}/coupling"

      - name: No artefact shipped a wall clock or a host timing
        # `pnpm check` runs every lane, so every lane rewrites its committed artefact. Six of them
        # carried `ranAt` or a per-arm latency, which made the gate dirty the tree on every run and
        # once put 279 lines of a sandbox's p50/p95 inside an experiment's commit. `writeJson` strips
        # them now; this refuses the ones that arrive another way -- a hand-edited file, a lane with
        # its own writer, a new field invented in the shape of the old ones.
        run: pnpm eval:claim-check

      - name: CPU scale and latency
        run: pnpm eval:scale

      # A readback verifier is the one file in the repository whose job is to be
      # right about a registration, and until this step none of them ran in CI.
      # `eval:verifiers` chains their self-tests; a verifier that cannot grade its
      # own fixtures GRADED/ABANDONED/DISCARDED/NO_MEASUREMENT is not a verifier,
      # and R54's fourth state exists because a wrong-configuration dispatch has to
      # be discarded rather than read as a result.
      - name: The readback verifiers still grade their own fixtures
        run: pnpm eval:verifiers

      # The coverage matrix is committed to the documentation repository, which this workflow cannot
      # write to. What it can check is that the generator still renders: a projection that throws on
      # a gate in neither table is a build failure here rather than a stale document there.
      - name: Render the gate coverage matrix
        run: pnpm eval:gate-matrix -- --out "$RUNNER_TEMP/GATE-COVERAGE-MATRIX.md"

      - name: Gate summary
        if: always()
        run: |
          node -e "
            const study = require('./bench/results/study.json');
            const failed = study.gates.filter((g) => g.blocking && !g.pass);
            console.log('gates:', study.gates.length, 'blocking failures:', failed.length);
            for (const g of study.gates) console.log(' ', g.pass ? 'PASS' : 'FAIL', g.id, '-', g.criterion, '=>', g.actual);
            if (failed.length > 0) process.exit(1);
          "

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            bench/results
            eval/results
            coverage/coverage-summary.json
          if-no-files-found: warn

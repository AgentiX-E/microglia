              ['at a 99th percentile of 280.4, so p is 0.0047 and P2 holds', Math.abs(d.nullP99 - 280.43834001379764) < 1e-9 && Math.abs(d.p - 0.0047488127968008) < 1e-12 && v('P2').holds === true],

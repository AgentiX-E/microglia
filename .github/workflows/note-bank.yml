name: note-bank

# R208's failure bank: the population every later round of the note lane is drawn from.
#
# The note lane distils a sentence from a *failed* attempt, so an arm run on a grid that never fails measures
# nothing — R207's pilot failed one episode in forty-eight and the summariser declined it. This job buys the
# population instead of the arm: one control-armed run over the domain's split at four trials, which is both the
# first `pass^4` this project has on the population the published ladder reports and the bank of failed attempts
# (with their transcripts and their verdicts) that R208's material ablation is computed on.
#
# It is deliberately not a fold. A fold is two arms on a grid chosen for difficulty; a bank is one arm on the whole
# split to find out where the difficulty is. The price difference is the reason the order is this way round:
# 456 episodes ≈ ¥6.2 here against ¥4.3 for a fold that would have been dispatched on a grid chosen by guesswork,
# and the bank is what makes the fold's grid choosable.
#
# No `push` trigger: this file runs when someone decides to spend money, and a census on every push is a census
# nobody reads.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'tau2 domain'
        required: false
        default: retail
      tasks:
        description: 'Comma-separated task ids, or empty for the domain split as the runner resolves it'
        required: false
        default: ''
      trials:
        description: 'Attempts per task. Four is what makes the reading a pass^4'
        required: false
        default: '4'
      max_steps:
        description: 'Steps per episode'
        required: false
        default: '100'
      concurrency:
        description: 'Episodes at a time. The provider limits requests, and one episode holds three.'
        required: false
        default: '2'

permissions:
  contents: read

concurrency:
  # One bank at a time: two runs writing the same results path would have the second reading the first's work,
  # which is a census of nothing.
  group: note-bank
  cancel-in-progress: false

jobs:
  bank:
    name: bank — one control arm over the split, for the failures
    runs-on: ubuntu-latest
    # Install (8 min) plus the episodes at the measured 26 s each divided by the concurrency, plus the census.
    # Generous: a step killed mid-run writes no artefact, and the artefact is the whole point of the purchase.
    timeout-minutes: 300
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAU_VERSION: ${{ vars.TAU_VERSION }}
      TAU_MODEL: ${{ vars.TAU_MODEL || 'deepseek/deepseek-flash' }}
      TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
      BANK_DOMAIN: ${{ github.event.inputs.domain || 'retail' }}
      BANK_TASKS: ${{ github.event.inputs.tasks || '' }}
      BANK_TRIALS: ${{ github.event.inputs.trials || '4' }}
      BANK_MAX_STEPS: ${{ github.event.inputs.max_steps || '100' }}
      BANK_CONCURRENCY: ${{ github.event.inputs.concurrency || '2' }}
      BANK_SEED: '300'
      BANK_DIR: eval/results/note-bank
    steps:
      - uses: actions/checkout@v4

      - name: Require the provider key before the first call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::DEEPSEEK_API_KEY is not configured for this repository"
            exit 1
          fi

      - name: The window, before the install spends eight minutes inside it
        # A **ceiling**, not an estimate: with no `--tasks` the runner resolves the domain's own split, and the
        # number that matters is the largest one it could be. R208's first bank was estimated from a hardcoded forty
        # while the runner's default split holds 114 — a three-fold under-estimate, which is the direction a guard
        # must never be wrong in. The authoritative check runs again below, on the count the split actually lists.
        run: |
          set -euo pipefail
          CEILING="$(python3 -c "
          named = len([entry for entry in '${BANK_TASKS}'.split(',') if entry])
          base = {'retail': 114, 'airline': 50, 'telecom': 114}
          tasks = named or base.get('${BANK_DOMAIN}', 114)
          trials = int('${BANK_TRIALS}')
          concurrency = max(1, int('${BANK_CONCURRENCY}'))
          print(int(tasks * trials * 26 / concurrency / 60) + 9 + 1)
          ")"
          echo "ceiling estimate ${CEILING} min (count confirmed after the install)" >> "$GITHUB_STEP_SUMMARY"
          python3 eval/drivers/tau2/note_pilot.py --window-minutes "${CEILING}"

      - name: Cache the tau2 environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tau2-bench
          key: tau2-${{ vars.TAU_VERSION }}-${{ runner.os }}

      - name: Install tau2-bench at the pinned ref
        run: |
          set -euo pipefail
          REF="${TAU_VERSION:-v1.0.1}"
          if [ ! -d .tau2-bench/.git ]; then
            git clone --depth 1 --branch "$REF" https://github.com/sierra-research/tau2-bench .tau2-bench \
              || { echo "tau2-clone-failed:$REF"; exit 21; }
          fi
          cd .tau2-bench
          python -m pip install --upgrade pip uv
          uv sync || { echo "tau2-sync-failed:$REF"; exit 22; }
          uv pip install mcp || { echo "tau2-mcp-missing:$REF"; exit 24; }
          uv run tau2 check-data || { echo "tau2-data-missing:$REF"; exit 23; }

      - name: The split, so the guard and the census count the same population
        run: |
          set -euo pipefail
          PYTHON="${GITHUB_WORKSPACE}/.tau2-bench/.venv/bin/python"
          test -x "$PYTHON" || { echo "tau2-venv-missing"; exit 25; }
          mkdir -p "${BANK_DIR}"
          "$PYTHON" eval/drivers/tau2/run_split.py --phase list --domain "${BANK_DOMAIN}" \
            --tasks "${BANK_TASKS}" --out "${BANK_DIR}/split.json"
          COUNT="$(python3 -c "import json; print(len(json.load(open('${BANK_DIR}/split.json'))['tasks']))")"
          echo "BANK_TASK_COUNT=${COUNT}" >> "$GITHUB_ENV"
          echo "the split holds ${COUNT} task(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Does the whole job fit in the off-peak window? The authoritative check
        # On the count the split lists, before the first paid call. Free to fail: eight minutes of install are sunk
        # and nothing else is.
        run: |
          set -euo pipefail
          MINUTES="$(python3 -c "
          tasks = int('${BANK_TASK_COUNT}')
          trials = int('${BANK_TRIALS}')
          concurrency = max(1, int('${BANK_CONCURRENCY}'))
          print(int(tasks * trials * 26 / concurrency / 60) + 1)
          ")"
          echo "measured estimate ${MINUTES} min for ${BANK_TASK_COUNT} task(s) at ${BANK_TRIALS} trial(s)" \
            >> "$GITHUB_STEP_SUMMARY"
          python3 eval/drivers/tau2/note_pilot.py --window-minutes "${MINUTES}"

      - name: One control arm over the split
        env:
          TAU_CONCURRENCY: ${{ github.event.inputs.concurrency || '2' }}
          TAU_RETRIES: '4'
        run: |
          set -euo pipefail
          PYTHON="${GITHUB_WORKSPACE}/.tau2-bench/.venv/bin/python"
          # No `--notes`: this arm is the control by construction, and a bank written with a sidecar would be a
          # treatment whose material came from nowhere. `--trials 4` and `--rounds 1` is one `run_tasks` call at
          # four seeds, which is the pass^4 the board reports.
          "$PYTHON" eval/drivers/tau2/run_split.py \
            --phase eval --agent microglia_agent \
            --domain "${BANK_DOMAIN}" --tasks "${BANK_TASKS}" \
            --trials "${BANK_TRIALS}" --max-steps "${BANK_MAX_STEPS}" \
            --seed "${BANK_SEED}" --require-off-peak \
            --out "${BANK_DIR}/control.json" 2>&1 | tee "${BANK_DIR}/control.log"

      - name: What the bank holds
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### The failure bank"
            echo
            echo '```'
            python3 eval/tools/note_bank.py --bank "${BANK_DIR}/control.json" --trials "${BANK_TRIALS}" \
              --json "${BANK_DIR}/bank.json" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bank
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-bank
          path: |
            eval/results/note-bank/*.json
            eval/results/note-bank/*.log
          if-no-files-found: warn
          retention-days: 30

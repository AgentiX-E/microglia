name: alfworld

# The recurring-defect lane, and only its pre-flight.
#
# Every board this project is measured on is one-shot: a system is scored on tasks it
# has never seen, while the mechanism under study is learning across repeats. ALFWorld
# is the procedure the experience-reuse literature uses for that question, so the lane
# has to exist before the question can be asked on somebody else's corpus.
#
# This workflow runs the part that must not cost anything: install the environment,
# drive one held-out game with the file's own gold plan, and stop. A model is not
# called. That keeps the first green build a statement about the driver rather than
# about a budget, and it is why `calls` is printed as zero at the end rather than left
# implicit.
#
# Why CI and not the development sandbox: `textworld` builds a 22 MB Inform7 compiler
# from emshort.com at build time, which the sandbox fetches at 3 KB/s and then aborts.
# A runner fetches it in seconds. The dependency is not optional and it is not a
# property of the lane, so the lane lives where the dependency resolves.
on:
  # A dispatch with `games` set runs the calibration and nothing else; a dispatch without it runs the
  # pre-flight, which is what a dispatch used to do. The split exists because the pre-flight is thirty
  # minutes of runner time and the calibration is the thing an operator usually wants.
  workflow_dispatch:
    inputs:
      arm:
        description: 'arm to calibrate: none, always-in or retrieved'
        required: false
        default: ''
      games:
        description: 'games to drive; empty runs only the pre-flight jobs'
        required: false
        default: ''
      shard:
        description: 'contiguous slice, i/n'
        required: false
        default: '0/1'
      max_steps:
        description: 'the environment step cap'
        required: false
        default: '50'
      rules:
        description: 'path to a rendered rule bank, relative to the repository root'
        required: false
        default: ''
  push:
    branches: [master]
    paths:
      # The drivers and the environment config, not the directory. A registration or a note beside them
      # changes no behaviour, and a job that spends thirty minutes of runner time to prove a paragraph is
      # a job people learn to skip.
      - 'eval/drivers/alfworld/*.py'
      - 'eval/drivers/alfworld/config.yaml'
      # The few-shot transcripts are part of the prompt, so a change to them changes what every arm
      # sends. Leaving them out of the trigger would make the one file that moves the score the one file
      # whose edit runs nothing.
      - 'eval/drivers/alfworld/prompts/*.json'
      - '.github/workflows/alfworld.yml'

permissions:
  contents: read

jobs:
  unit:
    # The half of `agent.py` that decides something, with no model, no environment and no network:
    # the transcript split, the parser's four branches, the shard arithmetic and the bill. It runs in
    # seconds because none of it needs textworld, which is what makes it the job that runs first.
    name: the prompt, the parser, the shard and the bill
    # Skipped when a dispatch names games: that dispatch is buying a number, not re-running
    # the pre-flight it already has.
    if: github.event_name == 'push' || inputs.games == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run the decisions
        run: python eval/drivers/alfworld/test_agent.py

      - name: Report the bill
        if: always()
        run: echo 'model calls made by this job = 0'

  selfcheck:
    name: the environment resets, moves, refuses, and survives a walk
    # Skipped when a dispatch names games: that dispatch is buying a number, not re-running
    # the pre-flight it already has.
    if: github.event_name == 'push' || inputs.games == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache the wheels textworld builds
        # `textworld` compiles an Inform7 compiler that it fetches from emshort.com at
        # build time, and that host is intermittently unreachable: one run of this job
        # timed out on port 80 after 133 seconds while seven others before it downloaded
        # in seconds. The build is deterministic, so the wheel cache turns a run that
        # depends on somebody else's uptime into a run that usually does not.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-textworld-1.6.1-tatsu-5.8.3-v1

      - name: Install the environment
        # Version 0.4.2 is installed from the tag rather than from PyPI, because PyPI
        # stops at 0.3.5 and 0.3.5 reads the z-machine release while the data published
        # for this lane is the PDDL one. The mismatch would have surfaced after the
        # install as a game file the environment could not open.
        #
        # 0.4.2 declares exactly one dependency, `textworld[pddl]`, so the chain that
        # cost six runs on 0.3.5 -- torch, torchvision, ai2thor, opencv, all of them for
        # a visual simulator and a detector the text path never constructs -- is not in
        # this lane at all.
        run: |
          python -m pip install --upgrade pip
          # Three attempts, because the build's only network dependency is a host that
          # has already failed once. A retry is not a tolerance for a broken build: the
          # build is deterministic and the failure was a connection refused, so the
          # third attempt either produces the same wheel or the job fails loudly.
          for attempt in 1 2 3; do
            # Both constraints in one command. Installing textworld first and pinning
            # tatsu afterwards is what the eleventh run did, and it resolved tatsu 5.15.1
            # during the first install and then checked the import before the pin could
            # apply -- so the pin existed and had never been in force. 5.15.1 does not
            # carry `ParserConfig`; 5.8.3 does.
            if pip install 'textworld[pddl]==1.6.1' 'tatsu==5.8.3'; then break; fi
            echo "textworld build attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          python -c "import textworld, tatsu; print('textworld', textworld.__version__, 'tatsu', tatsu.__version__)"
          # textworld 1.6.1 imports `ParserConfig` from `tatsu.infos`, and a fresh
          # resolve takes whatever the resolver prefers: the eleventh run took 5.15.1,
          # which does not carry the name. 5.8.3 is pinned above, in the same command as
          # textworld, so the constraint is in force during the resolve rather than
          # applied to a tree that was already built against another version.
          pip install 'git+https://github.com/alfworld/alfworld@0.4.2' --no-deps
          pip install pandas pyyaml tqdm requests
          pip show tatsu textworld | grep -E '^(Name|Version)'

      - name: Fetch the games
        # 36.5 MB, fetched once per job. The download is the same artefact the release
        # publishes, so a lane that cannot fetch it cannot claim to be running the
        # published corpus.
        run: |
          export ALFWORLD_DATA="$HOME/.cache/alfworld"
          alfworld-download
          find "$ALFWORLD_DATA" -name 'game.tw-pddl' | wc -l

      - name: Drive one held-out game with its own gold plan
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: python eval/drivers/alfworld/selfcheck.py

      - name: Report the bill
        if: always()
        run: echo 'model calls made by this job = 0'

  floor:
    # The floor job answers the three questions that have to be settled before a model is
    # paid for: can the whole split be driven to termination, does the same seed replay
    # exactly, and how much of the task is reachable by accident. All three are properties
    # of the corpus and the driver, so this job costs nothing and is allowed to be slow.
    name: the split is covered, terminates, and replays
    # Skipped when a dispatch names games: that dispatch is buying a number, not re-running
    # the pre-flight it already has.
    if: github.event_name == 'push' || inputs.games == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache the wheels textworld builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-textworld-1.6.1-tatsu-5.8.3-v1

      - name: Install the environment
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install 'textworld[pddl]==1.6.1' 'tatsu==5.8.3'; then break; fi
            echo "textworld build attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          python -c "import textworld, tatsu; print('textworld', textworld.__version__, 'tatsu', tatsu.__version__)"
          pip install 'git+https://github.com/alfworld/alfworld@0.4.2' --no-deps
          pip install pandas pyyaml tqdm requests

      - name: Fetch the games
        run: |
          export ALFWORLD_DATA="$HOME/.cache/alfworld"
          alfworld-download
          find "$ALFWORLD_DATA" -name 'game.tw-pddl' | wc -l

      - name: Smoke the floor driver on eight games
        # Eight games first, because the full pass is two sweeps of the split and a typo in
        # the driver should cost ninety seconds rather than the whole job's budget.
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: |
          python eval/drivers/alfworld/floor.py \
            --games 8 --shadow-games 8 --out "$RUNNER_TEMP/floor-smoke.json"

      - name: Drive the whole split twice with the same seed
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: |
          python eval/drivers/alfworld/floor.py \
            --out "$RUNNER_TEMP/floor.json" | tee "$RUNNER_TEMP/floor.log"

      - name: Upload the floor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfworld-floor
          path: |
            ${{ runner.temp }}/floor.json
            ${{ runner.temp }}/floor-smoke.json
            ${{ runner.temp }}/floor.log
          if-no-files-found: warn

      - name: Report the bill
        if: always()
        run: echo 'model calls made by this job = 0'

  agreement:
    # The one assertion that makes a three-arm comparison possible: the model-free policy inside
    # `agent.py` must reproduce `floor.py` game for game — same games, same wins, same step counts, same
    # action digests, same observation fingerprints.
    #
    # Why this is not the same job as the floor: it drives two *different* code paths to the same place.
    # `floor.py` walks a game with its own loop; `agent.py` walks it through `run_episode`, which is the
    # function the model arms use. If those two disagree, then every arm's number is a number about the
    # driver, and no amount of model budget would have found it — the arms would agree with each other
    # because they share the defect.
    #
    # Eight games, not 134: this is a test of the loop, and the loop does not become more or less
    # correct with the ninety games after it. `floor.py` runs the whole split in its own job.
    name: the model-free policy reproduces the floor
    # Skipped when a dispatch names games: that dispatch is buying a number, not re-running
    # the pre-flight it already has.
    if: github.event_name == 'push' || inputs.games == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache the wheels textworld builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-textworld-1.6.1-tatsu-5.8.3-v1

      - name: Install the environment
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install 'textworld[pddl]==1.6.1' 'tatsu==5.8.3'; then break; fi
            echo "textworld build attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          python -c "import textworld, tatsu; print('textworld', textworld.__version__, 'tatsu', tatsu.__version__)"
          pip install 'git+https://github.com/alfworld/alfworld@0.4.2' --no-deps
          pip install pandas pyyaml tqdm requests

      - name: Fetch the games
        run: |
          export ALFWORLD_DATA="$HOME/.cache/alfworld"
          alfworld-download
          find "$ALFWORLD_DATA" -name 'game.tw-pddl' | wc -l

      - name: Drive eight games with the floor's own walker
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: |
          python eval/drivers/alfworld/floor.py \
            --games 8 --shadow-games 0 --out "$RUNNER_TEMP/floor-8.json" | tee "$RUNNER_TEMP/floor-8.log"

      - name: Drive the same eight games through the arm's loop, and require agreement
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: |
          python eval/drivers/alfworld/agent.py \
            --arm none --policy seed --games 8 \
            --assert-floor "$RUNNER_TEMP/floor-8.json" \
            --out "$RUNNER_TEMP/agent-seed-8.json" | tee "$RUNNER_TEMP/agent-seed-8.log"

      - name: Upload both readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfworld-agreement
          path: |
            ${{ runner.temp }}/floor-8.json
            ${{ runner.temp }}/floor-8.log
            ${{ runner.temp }}/agent-seed-8.json
            ${{ runner.temp }}/agent-seed-8.log
          if-no-files-found: warn

      - name: Report the bill
        if: always()
        run: echo 'model calls made by this job = 0'

  calibrate:
    # The first arm that costs money, and it is deliberately the smallest one: twenty games, one arm, and
    # the question it answers is not "what is the unit price" (that is arithmetic over a measured
    # transcript) but "does `none` land far enough above the floor to leave 13.3pp of room". If it does
    # not, the answer is a stronger backbone rather than a bigger sample, and this job is the whole bill.
    #
    # What to read first is not the score. It is `invalid_actions`, `off_space_actions` and `thoughts`:
    # a high invalid rate means the model did not follow the format, and the score that follows is a
    # score about the prompt's syntax wearing the costume of a score about memory.
    name: the headroom answer, one arm
    if: github.event_name == 'workflow_dispatch' && inputs.games != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache the wheels textworld builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-textworld-1.6.1-tatsu-5.8.3-v1

      - name: Install the environment
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install 'textworld[pddl]==1.6.1' 'tatsu==5.8.3'; then break; fi
            echo "textworld build attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          python -c "import textworld, tatsu; print('textworld', textworld.__version__, 'tatsu', tatsu.__version__)"
          pip install 'git+https://github.com/alfworld/alfworld@0.4.2' --no-deps
          pip install pandas pyyaml tqdm requests

      - name: Fetch the games
        run: |
          export ALFWORLD_DATA="$HOME/.cache/alfworld"
          alfworld-download
          find "$ALFWORLD_DATA" -name 'game.tw-pddl' | wc -l

      - name: Drive the arm
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARM: ${{ inputs.arm }}
          GAMES: ${{ inputs.games }}
          SHARD: ${{ inputs.shard }}
          MAX_STEPS: ${{ inputs.max_steps }}
          RULES: ${{ inputs.rules }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::a calibration needs DEEPSEEK_API_KEY"
            exit 1
          fi
          # An empty `arm` input is not an arm: it is a dispatch that forgot one, and defaulting it to
          # `none` would produce a control somebody believes is a treatment.
          if [ -z "${ARM}" ]; then
            echo "::error::a calibration needs \`arm\`; there is no default arm"
            exit 1
          fi
          args=(--arm "${ARM}" --policy model --games "${GAMES}" --shard "${SHARD}" --max-steps "${MAX_STEPS}")
          if [ -n "${RULES}" ]; then args+=(--rules "${RULES}"); fi
          python eval/drivers/alfworld/agent.py "${args[@]}" \
            --out "$RUNNER_TEMP/arm.json" | tee "$RUNNER_TEMP/arm.log"

      - name: Upload the arm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfworld-arm
          path: |
            ${{ runner.temp }}/arm.json
            ${{ runner.temp }}/arm.log
          if-no-files-found: warn

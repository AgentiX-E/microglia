name: alfworld

# The recurring-defect lane, and only its pre-flight.
#
# Every board this project is measured on is one-shot: a system is scored on tasks it
# has never seen, while the mechanism under study is learning across repeats. ALFWorld
# is the procedure the experience-reuse literature uses for that question, so the lane
# has to exist before the question can be asked on somebody else's corpus.
#
# This workflow runs the part that must not cost anything: install the environment,
# drive one held-out game with the file's own gold plan, and stop. A model is not
# called. That keeps the first green build a statement about the driver rather than
# about a budget, and it is why `calls` is printed as zero at the end rather than left
# implicit.
#
# Why CI and not the development sandbox: `textworld` builds a 22 MB Inform7 compiler
# from emshort.com at build time, which the sandbox fetches at 3 KB/s and then aborts.
# A runner fetches it in seconds. The dependency is not optional and it is not a
# property of the lane, so the lane lives where the dependency resolves.
on:
  # A dispatch with `games` set runs the calibration and nothing else; a dispatch without it runs the
  # pre-flight, which is what a dispatch used to do. The split exists because the pre-flight is thirty
  # minutes of runner time and the calibration is the thing an operator usually wants.
  workflow_dispatch:
    inputs:
      arm:
        description: 'arm to calibrate: none, always-in, retrieved or sham'
        required: false
        default: ''
      games:
        description: 'games to drive; empty runs only the pre-flight jobs'
        required: false
        default: ''
      shard:
        description: 'contiguous slice, i/n'
        required: false
        default: '0/1'
      max_steps:
        description: 'the environment step cap'
        required: false
        default: '50'
      rules:
        description: 'path to a rendered rule bank, relative to the repository root'
        required: false
        default: ''
      trace:
        description: 'print the first N replies; a calibration reads three before it reads its score'
        required: false
        default: '0'
      train:
        description: 'games to drive on valid_seen for distillation; empty skips the rule-bank jobs'
        required: false
        default: ''
      sweep:
        description: 'true runs all three arms over four slices of the held-out split in one dispatch'
        required: false
        default: ''
      not_before:
        description: 'UTC HH:MM to hold the paid step until; empty starts immediately'
        required: false
        default: ''
      chain:
        description: 'true runs train -> bank -> sweep in one dispatch, taking the bank from the artefact'
        required: false
        default: ''
      arms:
        description: 'the sweep''s arms, as a JSON list; the placebo is ["sham"]'
        required: false
        default: '["none","always-in","retrieved"]'
      top_k:
        description: 'entries the retrieved arm may carry; AMD measured k=1 as the optimum'
        required: false
        default: '3'
      gate_share:
        description: 'read-time overlap floor for the retrieved arm; 0 is the registered arm, 0.2 is the gated one'
        required: false
        default: '0'
      gate_kind:
        description: 'true carries only the bank entries tagged with each game''s task kind; needs a tagged bank'
        required: false
        default: ''
      train_shards:
        description: 'which training slices to drive, as a JSON list; ["1"] re-drives only the slice that failed'
        required: false
        default: '["0","1","2","3"]'
      train_run_ids:
        description: 'earlier runs whose training slices join this bank, comma separated; a resume of a partial pass'
        required: false
        default: ''
      bank_only:
        description: 'true distils the bank from train_run_ids and drives no training slice; train still sets the slice size'
        required: false
        default: ''
      distill_kinds:
        description: 'comma separated task kinds the bank is distilled from; empty uses every won episode'
        required: false
        default: ''
      split:
        description: 'corpus section to drive: eval_out_of_distribution (134), eval_in_distribution (140) or train'
        required: false
        default: 'eval_out_of_distribution'
      split_games:
        description: 'games the named section publishes; must match it, because the join tiles to this number'
        required: false
        default: '134'
  push:
    branches: [master]
    paths:
      # The drivers and the environment config, not the directory. A registration or a note beside them
      # changes no behaviour, and a job that spends thirty minutes of runner time to prove a paragraph is
      # a job people learn to skip.
      - 'eval/drivers/alfworld/*.py'
      - 'eval/drivers/alfworld/config.yaml'
      # The few-shot transcripts are part of the prompt, so a change to them changes what every arm
      # sends. Leaving them out of the trigger would make the one file that moves the score the one file
      # whose edit runs nothing.
      - 'eval/drivers/alfworld/prompts/*.json'
      - '.github/workflows/alfworld.yml'

permissions:
  contents: read

jobs:
  unit:
    # The half of `agent.py` that decides something, with no model, no environment and no network:
    # the transcript split, the parser's four branches, the shard arithmetic and the bill. It runs in
    # seconds because none of it needs textworld, which is what makes it the job that runs first.
    name: the prompt, the parser, the shard and the bill
    # Skipped when a dispatch names games: that dispatch is buying a number, not re-running
    # the pre-flight it already has.
    if: github.event_name == 'push' || inputs.games == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run the decisions
        run: |
          python eval/drivers/alfworld/test_agent.py
          python eval/drivers/alfworld/test_aggregate.py
          python eval/drivers/alfworld/test_distill.py
          python eval/drivers/alfworld/test_wait.py

      - name: Report the bill
        if: always()
        run: echo 'model calls made by this job = 0'

  selfcheck:
    name: the environment resets, moves, refuses, and survives a walk
    # Skipped when a dispatch names games: that dispatch is buying a number, not re-running
    # the pre-flight it already has.
    if: github.event_name == 'push' || inputs.games == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache the wheels textworld builds
        # `textworld` compiles an Inform7 compiler that it fetches from emshort.com at
        # build time, and that host is intermittently unreachable: one run of this job
        # timed out on port 80 after 133 seconds while seven others before it downloaded
        # in seconds. The build is deterministic, so the wheel cache turns a run that
        # depends on somebody else's uptime into a run that usually does not.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-textworld-1.6.1-tatsu-5.8.3-v1

      - name: Install the environment
        # Version 0.4.2 is installed from the tag rather than from PyPI, because PyPI
        # stops at 0.3.5 and 0.3.5 reads the z-machine release while the data published
        # for this lane is the PDDL one. The mismatch would have surfaced after the
        # install as a game file the environment could not open.
        #
        # 0.4.2 declares exactly one dependency, `textworld[pddl]`, so the chain that
        # cost six runs on 0.3.5 -- torch, torchvision, ai2thor, opencv, all of them for
        # a visual simulator and a detector the text path never constructs -- is not in
        # this lane at all.
        run: |
          python -m pip install --upgrade pip
          # Three attempts, because the build's only network dependency is a host that
          # has already failed once. A retry is not a tolerance for a broken build: the
          # build is deterministic and the failure was a connection refused, so the
          # third attempt either produces the same wheel or the job fails loudly.
          for attempt in 1 2 3; do
            # Both constraints in one command. Installing textworld first and pinning
            # tatsu afterwards is what the eleventh run did, and it resolved tatsu 5.15.1
            # during the first install and then checked the import before the pin could
            # apply -- so the pin existed and had never been in force. 5.15.1 does not
            # carry `ParserConfig`; 5.8.3 does.
            if pip install 'textworld[pddl]==1.6.1' 'tatsu==5.8.3'; then break; fi
            echo "textworld build attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          python -c "import textworld, tatsu; print('textworld', textworld.__version__, 'tatsu', tatsu.__version__)"
          # textworld 1.6.1 imports `ParserConfig` from `tatsu.infos`, and a fresh
          # resolve takes whatever the resolver prefers: the eleventh run took 5.15.1,
          # which does not carry the name. 5.8.3 is pinned above, in the same command as
          # textworld, so the constraint is in force during the resolve rather than
          # applied to a tree that was already built against another version.
          pip install 'git+https://github.com/alfworld/alfworld@0.4.2' --no-deps
          pip install pandas pyyaml tqdm requests
          pip show tatsu textworld | grep -E '^(Name|Version)'

      - name: Fetch the games
        # 36.5 MB, fetched once per job. The download is the same artefact the release
        # publishes, so a lane that cannot fetch it cannot claim to be running the
        # published corpus.
        run: |
          export ALFWORLD_DATA="$HOME/.cache/alfworld"
          alfworld-download
          find "$ALFWORLD_DATA" -name 'game.tw-pddl' | wc -l

      - name: Drive one held-out game with its own gold plan
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: python eval/drivers/alfworld/selfcheck.py

      - name: Report the bill
        if: always()
        run: echo 'model calls made by this job = 0'

  floor:
    # The floor job answers the three questions that have to be settled before a model is
    # paid for: can the whole split be driven to termination, does the same seed replay
    # exactly, and how much of the task is reachable by accident. All three are properties
    # of the corpus and the driver, so this job costs nothing and is allowed to be slow.
    name: the split is covered, terminates, and replays
    # Skipped when a dispatch names games: that dispatch is buying a number, not re-running
    # the pre-flight it already has.
    if: github.event_name == 'push' || inputs.games == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache the wheels textworld builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-textworld-1.6.1-tatsu-5.8.3-v1

      - name: Install the environment
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install 'textworld[pddl]==1.6.1' 'tatsu==5.8.3'; then break; fi
            echo "textworld build attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          python -c "import textworld, tatsu; print('textworld', textworld.__version__, 'tatsu', tatsu.__version__)"
          pip install 'git+https://github.com/alfworld/alfworld@0.4.2' --no-deps
          pip install pandas pyyaml tqdm requests

      - name: Fetch the games
        run: |
          export ALFWORLD_DATA="$HOME/.cache/alfworld"
          alfworld-download
          find "$ALFWORLD_DATA" -name 'game.tw-pddl' | wc -l

      - name: The section sizes the lane assumes are the sizes it installs
        # `agent.py` refuses a `--games` larger than the section it names and `aggregate.py` refuses a join across
        # two sections, both from a hand-written table. This is the check that the table is a measurement: the
        # corpus is fetched anyway for the floor, and counting it costs a second.
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: python scripts/check_split_sizes.py

      - name: Smoke the floor driver on eight games
        # Eight games first, because the full pass is two sweeps of the split and a typo in
        # the driver should cost ninety seconds rather than the whole job's budget.
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: |
          python eval/drivers/alfworld/floor.py \
            --games 8 --shadow-games 8 --out "$RUNNER_TEMP/floor-smoke.json"

      - name: Drive the whole split twice with the same seed
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: |
          python eval/drivers/alfworld/floor.py \
            --out "$RUNNER_TEMP/floor.json" | tee "$RUNNER_TEMP/floor.log"

      - name: Upload the floor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfworld-floor
          path: |
            ${{ runner.temp }}/floor.json
            ${{ runner.temp }}/floor-smoke.json
            ${{ runner.temp }}/floor.log
          if-no-files-found: warn

      - name: Report the bill
        if: always()
        run: echo 'model calls made by this job = 0'

  agreement:
    # The one assertion that makes a three-arm comparison possible: the model-free policy inside
    # `agent.py` must reproduce `floor.py` game for game — same games, same wins, same step counts, same
    # action digests, same observation fingerprints.
    #
    # Why this is not the same job as the floor: it drives two *different* code paths to the same place.
    # `floor.py` walks a game with its own loop; `agent.py` walks it through `run_episode`, which is the
    # function the model arms use. If those two disagree, then every arm's number is a number about the
    # driver, and no amount of model budget would have found it — the arms would agree with each other
    # because they share the defect.
    #
    # Eight games, not 134: this is a test of the loop, and the loop does not become more or less
    # correct with the ninety games after it. `floor.py` runs the whole split in its own job.
    name: the model-free policy reproduces the floor
    # Skipped when a dispatch names games: that dispatch is buying a number, not re-running
    # the pre-flight it already has.
    if: github.event_name == 'push' || inputs.games == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache the wheels textworld builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-textworld-1.6.1-tatsu-5.8.3-v1

      - name: Install the environment
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install 'textworld[pddl]==1.6.1' 'tatsu==5.8.3'; then break; fi
            echo "textworld build attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          python -c "import textworld, tatsu; print('textworld', textworld.__version__, 'tatsu', tatsu.__version__)"
          pip install 'git+https://github.com/alfworld/alfworld@0.4.2' --no-deps
          pip install pandas pyyaml tqdm requests

      - name: Fetch the games
        run: |
          export ALFWORLD_DATA="$HOME/.cache/alfworld"
          alfworld-download
          find "$ALFWORLD_DATA" -name 'game.tw-pddl' | wc -l

      - name: Drive eight games with the floor's own walker
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: |
          python eval/drivers/alfworld/floor.py \
            --games 8 --shadow-games 0 --out "$RUNNER_TEMP/floor-8.json" | tee "$RUNNER_TEMP/floor-8.log"

      - name: Drive the same eight games through the arm's loop, and require agreement
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
        run: |
          python eval/drivers/alfworld/agent.py \
            --arm none --policy seed --games 8 \
            --assert-floor "$RUNNER_TEMP/floor-8.json" \
            --out "$RUNNER_TEMP/agent-seed-8.json" | tee "$RUNNER_TEMP/agent-seed-8.log"

      - name: Upload both readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfworld-agreement
          path: |
            ${{ runner.temp }}/floor-8.json
            ${{ runner.temp }}/floor-8.log
            ${{ runner.temp }}/agent-seed-8.json
            ${{ runner.temp }}/agent-seed-8.log
          if-no-files-found: warn

      - name: Report the bill
        if: always()
        run: echo 'model calls made by this job = 0'

  calibrate:
    # The first arm that costs money, and it is deliberately the smallest one: twenty games, one arm, and
    # the question it answers is not "what is the unit price" (that is arithmetic over a measured
    # transcript) but "does `none` land far enough above the floor to leave 13.3pp of room". If it does
    # not, the answer is a stronger backbone rather than a bigger sample, and this job is the whole bill.
    #
    # What to read first is not the score. It is `invalid_actions`, `off_space_actions` and `thoughts`:
    # a high invalid rate means the model did not follow the format, and the score that follows is a
    # score about the prompt's syntax wearing the costume of a score about memory.
    name: the headroom answer, one arm
    if: github.event_name == 'workflow_dispatch' && inputs.games != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache the wheels textworld builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-textworld-1.6.1-tatsu-5.8.3-v1

      - name: Install the environment
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install 'textworld[pddl]==1.6.1' 'tatsu==5.8.3'; then break; fi
            echo "textworld build attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          python -c "import textworld, tatsu; print('textworld', textworld.__version__, 'tatsu', tatsu.__version__)"
          pip install 'git+https://github.com/alfworld/alfworld@0.4.2' --no-deps
          pip install pandas pyyaml tqdm requests

      - name: Fetch the games
        run: |
          export ALFWORLD_DATA="$HOME/.cache/alfworld"
          alfworld-download
          find "$ALFWORLD_DATA" -name 'game.tw-pddl' | wc -l

      - name: Wait for the off-peak window
        # The window arithmetic lives in one script rather than in three copies of it, and that script says
        # why waiting is cheaper than starting: `eval/drivers/alfworld/wait-for-window.sh`.
        env:
          NOT_BEFORE: ${{ inputs.not_before }}
        run: bash eval/drivers/alfworld/wait-for-window.sh "${NOT_BEFORE}"

      - name: Drive the arm
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARM: ${{ inputs.arm }}
          GAMES: ${{ inputs.games }}
          SHARD: ${{ inputs.shard }}
          MAX_STEPS: ${{ inputs.max_steps }}
          RULES: ${{ inputs.rules }}
          TRACE: ${{ inputs.trace }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::a calibration needs DEEPSEEK_API_KEY"
            exit 1
          fi
          # An empty `arm` input is not an arm: it is a dispatch that forgot one, and defaulting it to
          # `none` would produce a control somebody believes is a treatment.
          if [ -z "${ARM}" ]; then
            echo "::error::a calibration needs \`arm\`; there is no default arm"
            exit 1
          fi
          args=(--arm "${ARM}" --policy model --games "${GAMES}" --shard "${SHARD}" --max-steps "${MAX_STEPS}")
          args+=(--trace "${TRACE}")
          if [ -n "${RULES}" ]; then args+=(--rules "${RULES}"); fi
          python eval/drivers/alfworld/agent.py "${args[@]}" \
            --out "$RUNNER_TEMP/arm.json" | tee "$RUNNER_TEMP/arm.log"

      - name: Upload the arm
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfworld-arm
          path: |
            ${{ runner.temp }}/arm.json
            ${{ runner.temp }}/arm.log
          if-no-files-found: warn

  distill-train:
    # The pass a rule bank has to be distilled from, and the one thing about it that must not be got wrong:
    # the split. ExpeL extracts its rules on `valid_seen` and reports on `valid_unseen`; a bank extracted
    # from the held-out games would be a memory that had already seen the answers, and the arm carrying it
    # would score well for a reason no reader of the number could recover. `--split` is therefore named
    # here rather than defaulted.
    #
    # It is the control arm that is driven (`--arm none`), because that is what the competitor distils from:
    # its own rollouts before any memory exists. A bank extracted from an arm that already carried a bank is
    # a bank about the bank.
    name: the training pass a rule bank is extracted from
    # `bank_only` skips the driving and keeps `train` as the slice's size, because the case it exists for is a bank
    # that failed *after* the slices were paid for: re-driving them to re-read them would buy 140 games twice.
    if: github.event_name == 'workflow_dispatch' && inputs.train != '' && inputs.bank_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # The slices are data for the same reason the arms are: run `44685314225` lost shard 1 to a dropped
        # connection and paid for the other three, and re-driving all four to recover one would spend 105
        # games' worth of money to learn nothing. A dispatch names the slice it is missing.
        shard: ${{ fromJSON(inputs.train_shards || '["0","1","2","3"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache the wheels textworld builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-textworld-1.6.1-tatsu-5.8.3-v1

      - name: Install the environment
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install 'textworld[pddl]==1.6.1' 'tatsu==5.8.3'; then break; fi
            echo "textworld build attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          python -c "import textworld, tatsu; print('textworld', textworld.__version__, 'tatsu', tatsu.__version__)"
          pip install 'git+https://github.com/alfworld/alfworld@0.4.2' --no-deps
          pip install pandas pyyaml tqdm requests

      - name: Fetch the games
        run: |
          export ALFWORLD_DATA="$HOME/.cache/alfworld"
          alfworld-download
          find "$ALFWORLD_DATA" -name 'game.tw-pddl' | wc -l

      - name: Wait for the off-peak window
        # The window arithmetic lives in one script rather than in three copies of it, and that script says
        # why waiting is cheaper than starting: `eval/drivers/alfworld/wait-for-window.sh`.
        env:
          NOT_BEFORE: ${{ inputs.not_before }}
        run: bash eval/drivers/alfworld/wait-for-window.sh "${NOT_BEFORE}"

      - name: Drive the training slice with transcripts
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRAIN: ${{ inputs.train }}
          KINDS: ${{ inputs.distill_kinds }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::a training pass needs DEEPSEEK_API_KEY"
            exit 1
          fi
          # Four fixed slices, matching the matrix below. An input would be a number a dispatch could set
          # to two while the matrix still ran four, and two of the four would drive overlapping games.
          # The artefact is written after every episode, so a job killed at game 20 of 35 keeps the twenty it
          # paid for and can be continued with `--resume`; the retry inside `chat()` usually stops it being
          # killed at all.
          python eval/drivers/alfworld/agent.py \
            --arm none --policy model --split eval_in_distribution \
            --games "${TRAIN}" --shard "${SHARD}/4" \
            --record-transcripts --out "$RUNNER_TEMP/train-${SHARD}.json" \
            | tee "$RUNNER_TEMP/train-${SHARD}.log"

      - name: Upload the slice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfworld-train-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/train-${{ matrix.shard }}.json
            ${{ runner.temp }}/train-${{ matrix.shard }}.log
          if-no-files-found: warn

  distill-bank:
    # Ten critique calls, and the bank they produce. The chunk size and the cap are the competitor's own
    # (`success_critique_num: 8`, `max_num_rules: 20` in `configs/agent/expel.yaml`), passed explicitly
    # rather than defaulted so that the artefact records what it was built with.
    #
    # What it cannot reproduce: ExpeL's first critique pass compares a successful trial against failed
    # attempts at the *same* task, which needs repeated trials and the split gives one. Only the success
    # path is available, so this bank is the competitor's extraction minus its contrast — a limit that is
    # reported beside the score rather than in a footnote.
    name: the bank, distilled from the slices
    # `always()`: a slice that died must not turn this job grey. Skipped, the bank leaves twelve sweep jobs to
    # fail on a missing artefact and the red X points at them; run, it says "the artefacts cover 105 games but
    # the slice is 140" and the X points at the shard that died, which is the whole of the diagnosis.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.train != ''
    needs: distill-train
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch the slices this dispatch drove
        # Skipped under `bank_only`, where this run drove none: the action fails on a pattern that matches nothing,
        # and a step excused with `continue-on-error` would hide a real absence too.
        if: inputs.bank_only != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: alfworld-train-*
          path: ${{ runner.temp }}/slices
          merge-multiple: true

      - name: Fetch the slices an earlier dispatch already paid for
        # A resume at the level of the data. Run `44685314225` completed shards 0, 2 and 3 and lost shard 1 to a
        # dropped connection; the honest repair is to drive the missing slice and join it to the surviving three,
        # not to buy 105 games a second time. The join is checked, not trusted: `--expect-games` refuses a union
        # that does not cover the slice, and a game appearing twice counts once.
        if: inputs.train_run_ids != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIOR_RUNS: ${{ inputs.train_run_ids }}
        run: |
          set -euo pipefail
          for run in $(echo "${PRIOR_RUNS}" | tr ',' ' '); do
            for shard in 0 1 2 3; do
              if gh run download "${run}" --repo "${GITHUB_REPOSITORY}" \
                   --name "alfworld-train-${shard}" --dir "$RUNNER_TEMP/prior/${run}-${shard}"; then
                echo "run ${run} contributed slice ${shard}"
              else
                echo "run ${run} has no slice ${shard}; the tiling check decides whether that matters"
              fi
            done
          done
          # The directory exists whether or not this dispatch drove a slice. Under `bank_only` no earlier step
          # has created it, and `cp` into a missing directory fails once per artefact with a message that reads
          # as the copy rather than as the cause: run `44752386299` died here, at ¥0 spent and nothing distilled.
          mkdir -p "$RUNNER_TEMP/slices"
          # The directory is created here rather than assumed: under `bank_only` the step that normally unpacks this
          # run's own slices is skipped, and the first dispatch of this mode failed on `cp: ... Not a directory`
          # after two runs had contributed all four slices.
          mkdir -p "$RUNNER_TEMP/slices"
          # Only the artefacts move across: the logs of the other run describe another pass and would be read
          # beside this one's.
          find "$RUNNER_TEMP/prior" -name 'train-*.json' -exec cp {} "$RUNNER_TEMP/slices/" \;
          # A run id that contributes nothing is the mistake this step is most likely to have made, so it is
          # reported as itself rather than left to `distill.py`, whose own refusal would name a union of zero
          # against a slice of 140 and send the reader looking at the driver.
          carried=$(find "$RUNNER_TEMP/slices" -name 'train-*.json' | wc -l)
          if [ "${carried}" -eq 0 ]; then
            echo "::error::no training slice came from this dispatch or from runs ${PRIOR_RUNS}"
            exit 1
          fi
          ls "$RUNNER_TEMP/slices"

      - name: Distil the bank
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRAIN: ${{ inputs.train }}
          KINDS: ${{ inputs.distill_kinds }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::distillation needs DEEPSEEK_API_KEY"
            exit 1
          fi
          ls "$RUNNER_TEMP/slices"
          # `--kinds` is empty for the registered bank and names task kinds for the control the placebo could not
          # build: the same shape and a different vocabulary. Run `44763220821` earned the bank's delta with the
          # bank's own words permuted, so a bank about two task kinds is the cheapest way to ask whether any of it
          # is about what the block says.
          python eval/drivers/alfworld/distill.py \
            --episodes "$RUNNER_TEMP"/slices/train-*.json \
            --expect-games "${TRAIN}" \
            --cap 20 --critique-num 8 \
            --kinds "${KINDS}" \
            --out "$RUNNER_TEMP/bank.json" | tee "$RUNNER_TEMP/bank.log"

      - name: Upload the bank
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfworld-bank
          path: |
            ${{ runner.temp }}/bank.json
            ${{ runner.temp }}/bank.log
          if-no-files-found: warn

  sweep:
    # The paired reading, which is the reason the lane exists: three arms over the same 134 games, one job per
    # arm and slice. `games` is the held-out split's own size and `--split` is left at its default, because the
    # default is the held-out one and a sweep that named another split would be a leak 402 episodes wide.
    #
    # Twelve jobs in one dispatch rather than twelve dispatches: a dispatch is a run, a run is one artefact set,
    # and `aggregate.py` refuses a pair of arms whose games do not coincide — which is exactly what twelve
    # separately launched runs can produce when one of them is cancelled.
    name: one arm over one slice
    # `needs` with `always()`: a plain sweep names a bank in the repository and must not be blocked by a job that
    # was skipped, while a chained sweep must not start before the bank exists. `always()` allows both, and the
    # bank step below fails loudly when a chained run reaches here without one.
    # `always()` for a standalone sweep, which names a committed bank and must not wait on a job that was
    # skipped; but not when the bank job *failed*, because then there is no bank and twelve jobs would report
    # the same absence twelve times, one per arm and slice.
    if: |
      always() && github.event_name == 'workflow_dispatch'
      && (inputs.sweep != '' || inputs.chain != '')
      && needs.distill-bank.result != 'failure'
    needs: [distill-bank]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # Naming the arms as data rather than as YAML is what lets one job dispatch a placebo
        # (`["sham"]`) or a k=1 contrast (`["retrieved"]` with `top_k: 1`) without a second copy of this
        # file that would drift from the first. The default is the three-arm comparison.
        arm: ${{ fromJSON(inputs.arms || '["none","always-in","retrieved"]') }}
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache the wheels textworld builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-textworld-1.6.1-tatsu-5.8.3-v1

      - name: Install the environment
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install 'textworld[pddl]==1.6.1' 'tatsu==5.8.3'; then break; fi
            echo "textworld build attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          python -c "import textworld, tatsu; print('textworld', textworld.__version__, 'tatsu', tatsu.__version__)"
          pip install 'git+https://github.com/alfworld/alfworld@0.4.2' --no-deps
          pip install pandas pyyaml tqdm requests

      - name: Fetch the games
        run: |
          export ALFWORLD_DATA="$HOME/.cache/alfworld"
          alfworld-download
          find "$ALFWORLD_DATA" -name 'game.tw-pddl' | wc -l

      - name: Wait for the off-peak window
        # The window arithmetic lives in one script rather than in three copies of it, and that script says
        # why waiting is cheaper than starting: `eval/drivers/alfworld/wait-for-window.sh`.
        env:
          NOT_BEFORE: ${{ inputs.not_before }}
        run: bash eval/drivers/alfworld/wait-for-window.sh "${NOT_BEFORE}"

      - name: Take the bank the same run built
        # A chained dispatch has no bank in the repository yet: the bank is an artefact of this run, so the sweep
        # reads it from there rather than from a path a human would have had to commit between two dispatches.
        if: inputs.rules == ''
        uses: actions/download-artifact@v4
        with:
          name: alfworld-bank
          path: ${{ runner.temp }}/bank

      - name: Drive the arm
        env:
          ALFWORLD_DATA: /home/runner/.cache/alfworld
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARM: ${{ matrix.arm }}
          SHARD: ${{ matrix.shard }}
          GAMES: ${{ inputs.games }}
          MAX_STEPS: ${{ inputs.max_steps }}
          RULES: ${{ inputs.rules }}
          TOP_K: ${{ inputs.top_k }}
          GATE_SHARE: ${{ inputs.gate_share }}
          GATE_KIND: ${{ inputs.gate_kind }}
          SPLIT: ${{ inputs.split }}
          SPLIT_GAMES: ${{ inputs.split_games }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::a sweep needs DEEPSEEK_API_KEY"
            exit 1
          fi
          # The section and its own size arrive together, and a sweep may not name one without the other: twelve
          # jobs driving 134 games of a 140-game section produce a reading whose denominator is the default rather
          # than the section, and `aggregate.py --expect-split` refuses it only after the money is spent.
          SPLIT="${SPLIT:-eval_out_of_distribution}"
          if [ -z "${SPLIT_GAMES}" ]; then
            echo "::error::split ${SPLIT} needs split_games: the tiling check reads it"
            exit 1
          fi
          GAMES="${GAMES:-${SPLIT_GAMES}}"
          if [ -z "${RULES}" ]; then
            RULES="$RUNNER_TEMP/bank/bank.json"
          fi
          # The `none` arm carries no bank, so a bank path it cannot find is not its problem: checked inside the
          # treatment branch below. Run 44779423772 lost eight jobs to this line, both arms, because a `--rules`
          # path was given relative to the lane's own directory and the jobs run from the repository root.
          args=(--arm "${ARM}" --policy model --games "${GAMES}" --shard "${SHARD}/4" --max-steps "${MAX_STEPS}")
          # The section is an argument rather than a default that happens to be right: every published number in
          # this lane comes from `eval_out_of_distribution`, and a second section is only a second reading if the
          # artefact says which one it drove (AUDIT 34.251).
          args+=(--split "${SPLIT}")
          # The retrieval budget is an input because AMD measured k=1 as the global optimum and this lane's
          # default is 3; a contrast that has to be edited into a file is a contrast nobody runs twice.
          args+=(--top-k "${TOP_K:-3}")
          # The read-time gate is an input for the same reason the retrieval budget is: `arXiv:2610.07311` names
          # a repair whose direction this corpus can test in one dispatch, and a mechanism that has to be edited
          # into a file is a mechanism nobody runs twice.
          args+=(--gate-share "${GATE_SHARE:-0}")
          # The kind gate is the second half of the same question: R174.2 measured the overlap floor admitting
          # nothing on this corpus (a room description shares at most one content word with a rule about an
          # action), so the selection signal has to come from the task the game names rather than from the room
          # it starts in. It is an input for the same reason: a mechanism that has to be edited into a file is a
          # mechanism nobody runs twice.
          if [ -n "${GATE_KIND}" ]; then args+=(--gate-kind); fi
          if [ "${ARM}" != "none" ]; then
            if [ -z "${RULES}" ]; then
              echo "::error::arm ${ARM} needs a rule bank; there is nothing for it to carry"
              exit 1
            fi
            if [ ! -f "${RULES}" ]; then
              echo "::error::no bank at ${RULES}; a treatment arm cannot be run without one"
              exit 1
            fi
            args+=(--rules "${RULES}")
          fi
          python eval/drivers/alfworld/agent.py "${args[@]}" \
            --out "$RUNNER_TEMP/arm-${ARM}-${SHARD}.json" | tee "$RUNNER_TEMP/arm-${ARM}-${SHARD}.log"

      - name: Upload the slice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfworld-arm-${{ matrix.arm }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/arm-${{ matrix.arm }}-${{ matrix.shard }}.json
            ${{ runner.temp }}/arm-${{ matrix.arm }}-${{ matrix.shard }}.log
          if-no-files-found: warn

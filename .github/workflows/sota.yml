name: sota

# The public-benchmark lane.
#
# It is deliberately not a merge gate: accuracy at a few hundred questions is a
# measurement, not a verdict, and a flaky pass/fail on it would train the project
# to ignore red builds. What it *does* enforce is instrument validity — the pack
# was non-empty, evaluation did not mutate knowledge, every question was evaluated
# exactly once by a memory that never saw it, and the dataset executed. A run that
# cannot support a claim fails here rather than publishing a number.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Questions to draw (0 = every usable question)'
        required: false
        default: '0'
      folds:
        description: 'Cross-fitting folds'
        required: false
        default: '5'
      max_calls:
        description: 'Hard model-call budget'
        required: false
        default: '4000'
      generalize:
        description: 'Scope widening during distillation (false = ablation)'
        required: false
        default: 'true'
      convention:
        description: 'House convention (empty, or thousands)'
        required: false
        default: ''
      arms:
        description: 'Control arms beyond none+full (gated,duplicate,wrong-scope,stated,oracle)'
        required: false
        default: 'gated,oracle'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  bird:
    name: BIRD Mini-Dev (cross-fitted, memory on/off)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Require credentials
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is not configured for this repository"
            exit 1
          fi

      # No inventory step: the lane verifies its own data. It reads the pinned
      # manifest (`eval/manifests/bird-minidev.json`), checks the download's size and
      # SHA-256 before extracting, reads the questions from the same archive, and
      # counts the rows of every database it is about to use. A pre-flight step that
      # listed a different source would be a second opinion nobody asked for.
      # A stale artefact is worse than no artefact: the publish and upload steps run
      # with `if: always()`, so a committed result from an earlier run would be
      # reported as this run's evidence. Deleting it first makes "nothing was
      # produced" visible instead of plausible.
      - name: Drop any committed artefact
        run: rm -f eval/results/poc-sota-bird.json eval/results/poc-sota-attribution.json

      # The full split is ~2,100 model calls: 352 questions × (none + full) plus one
      # distillation call per correction. At the observed 2–3 s per call that is
      # 70–105 minutes, so the step is capped at 160 and the job at 180. A smaller
      # dispatch (limit / folds / arms) finishes in a fraction of that.
      - name: Run the benchmark
        timeout-minutes: 160
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BIRD_ARCHIVE_URL: ${{ vars.BIRD_ARCHIVE_URL }}
          SOTA_LIMIT: ${{ github.event.inputs.limit || '0' }}
          SOTA_FOLDS: ${{ github.event.inputs.folds || '5' }}
          SOTA_GENERALIZE: ${{ github.event.inputs.generalize || 'true' }}
          SOTA_ARMS: ${{ github.event.inputs.arms || 'gated,oracle' }}
          SOTA_CONVENTION: ${{ github.event.inputs.convention || '' }}
          SOTA_RESAMPLES: '10000'
          POC_MAX_CALLS: ${{ github.event.inputs.max_calls || '4000' }}
        run: pnpm eval:sota

      - name: Attribute the flips to rules
        if: always()
        run: |
          if [ -f eval/results/poc-sota-bird.json ]; then
            pnpm eval:attribute
          else
            echo "::error::no artefact: the attribution step cannot run"
            exit 1
          fi

      - name: Publish the result
        if: always()
        run: |
          node -e "
            const fs = require('node:fs');
            if (!fs.existsSync('./eval/results/poc-sota-bird.json')) {
              console.log('::error::the lane produced no artefact; nothing is published');
              process.exit(1);
            }
            const r = require('./eval/results/poc-sota-bird.json');
            const m = r.metrics;
            const p = r.paired;
            const lines = [
              '### BIRD Mini-Dev — cross-fitted, k=' + r.config.folds,
              '',
              '| Arm | Execution accuracy | n |',
              '| --- | --- | --- |',
              '| no memory | ' + (m.accuracy_without_memory * 100).toFixed(2) + '% | ' + p.n + ' |',
              '| with memory | ' + (m.accuracy_with_memory * 100).toFixed(2) + '% | ' + p.n + ' |',
              '',
              'Delta ' + p.delta_pp.toFixed(2) + 'pp [' + p.ci_low_pp.toFixed(2) + ', ' +
                p.ci_high_pp.toFixed(2) + '], McNemar p=' + p.p_value.toFixed(4) +
                ', gained ' + p.gained + ', lost ' + p.lost + '.',
              'Minimum detectable difference at this n and discordance: ' +
                p.min_detectable_pp.toFixed(2) + 'pp.',
              '',
              'Parse ' + (m.parse_rate * 100).toFixed(1) + '%, exec ' +
                (m.exec_rate * 100).toFixed(1) + '%, ' + m.knowledge_active_mean.toFixed(1) +
                ' active rules per fold, ' + m.mean_pack_ids.toFixed(2) + ' rules per question, ' +
                m.corrections_learned + ' corrections learned, ' + r.calls + ' calls (' +
                r.tokens + ' tokens, ' + r.retries + ' retries).',
              '',
              '| Gate | Result | Actual |',
              '| --- | --- | --- |',
              ...r.gates.map((g) => '| ' + g.id + (g.blocking ? '' : ' (advisory)') + ' | ' +
                (g.pass ? 'pass' : 'FAIL') + ' | ' + g.actual + ' |'),
              '',
              '| Control arm | Accuracy | Delta vs none | 95% CI | p | rules/question |',
              '| --- | --- | --- | --- | --- | --- |',
              ...r.arms.map((a) => '| ' + a.arm + ' | ' + (a.accuracy * 100).toFixed(2) + '% | ' +
                a.delta_pp.toFixed(2) + 'pp | [' + a.ci_low_pp.toFixed(2) + ', ' +
                a.ci_high_pp.toFixed(2) + '] | ' + a.p_value.toFixed(4) + ' | ' +
                a.mean_pack_ids.toFixed(2) + ' |'),
              '',
              '| Fold | eval | active | no memory | with memory | delta |',
              '| --- | --- | --- | --- | --- | --- |',
              ...r.per_fold.map((f) => '| ' + f.fold + ' | ' + f.eval + ' | ' + f.active + ' | ' +
                (f.without_memory * 100).toFixed(1) + '% | ' + (f.with_memory * 100).toFixed(1) +
                '% | ' + f.delta_pp.toFixed(2) + 'pp |'),
              '',
              r.distill_failure_samples.length === 0
                ? 'No distillation parse failures.'
                : 'Distillation failures: ' + r.distill_failure_samples.join(' | '),
            ];
            const text = lines.join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n');
            console.log(text);
          "

      - name: Upload the artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota-bird
          path: |
            eval/results/poc-sota-bird.json
            eval/results/poc-sota-attribution.json
          if-no-files-found: error

  # L4 — τ²-bench pass^4.
  #
  # Skipped until the environment exists: `TAU_DRIVER` names a module that runs the
  # two arms and returns per-task trial counts, and the tool-calling sandbox has to
  # come with it. A job that runs without either would publish a zero it did not
  # measure, so the gate is a repository variable rather than a TODO.
  l4:
    name: 'L4 tau-bench pass^4'
    if: vars.TAU_ENV_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

      # The environment, pinned by tag and cached by that tag.
      #
      # Upstream ships as a repository rather than a wheel (`uv sync` against a
      # clone, Python 3.12+), so the version is a git ref, not a semver on PyPI.
      # Nothing is vendored: a copy of someone else's agent sandbox in this
      # repository would sit outside the licence review and the secret scan, and
      # would still not tell us which upstream commit we were measuring.
      - name: Cache the tau2 environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tau2-bench
          key: tau2-${{ vars.TAU_VERSION }}-${{ runner.os }}

      - name: Install tau2-bench at the pinned ref
        env:
          TAU_VERSION: ${{ vars.TAU_VERSION }}
        run: |
          set -euo pipefail
          REF="${TAU_VERSION:-v0.2.0}"
          if [ ! -d .tau2-bench/.git ]; then
            git clone --depth 1 --branch "$REF" https://github.com/sierra-research/tau2-bench .tau2-bench \
              || { echo "tau2-clone-failed:$REF"; exit 21; }
          fi
          cd .tau2-bench
          python -m pip install --upgrade pip uv
          uv sync || { echo "tau2-sync-failed:$REF"; exit 22; }
          uv run tau2 check-data || { echo "tau2-data-missing:$REF"; exit 23; }

      - name: L4 lane
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAU_DRIVER: ${{ vars.TAU_DRIVER }}
          # A recorded run can be re-scored without the environment; the lane
          # prefers it over the driver when both are set.
          TAU_RESULTS: ${{ vars.TAU_RESULTS }}
          TAU_MODEL: ${{ vars.TAU_MODEL }}
          TAU_VERSION: ${{ vars.TAU_VERSION }}
          TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
        run: pnpm eval:l4

      # A not-run that nobody notices is a skip. The annotation is the notice: it
      # names the variable that points at nothing, and the job stays green because
      # nothing was measured rather than because something failed quietly.
      - name: Say so when nothing was measured
        if: always()
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'eval/results/poc-l4.json';
            if (!fs.existsSync(path)) { console.log('::warning::L4 wrote no artefact'); process.exit(0); }
            const r = require('./' + path);
            if (r.metrics.status_not_run === 1) {
              const why = r.metrics.status_driver_missing === 1
                ? 'TAU_DRIVER names a module that does not exist'
                : 'neither TAU_RESULTS nor TAU_DRIVER is set';
              console.log('::warning::L4 did not run: ' + why);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'L4 did not run: ' + why + '. No result is claimed.\n');
            }
          "
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-evidence
          path: eval/results

name: sota

# The public-benchmark lane.
#
# It is deliberately not a merge gate: accuracy at a few hundred questions is a
# measurement, not a verdict, and a flaky pass/fail on it would train the project
# to ignore red builds. What it *does* enforce is instrument validity — the pack
# was non-empty, evaluation did not mutate knowledge, every question was evaluated
# exactly once by a memory that never saw it, and the dataset executed. A run that
# cannot support a claim fails here rather than publishing a number.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Questions to draw (0 = every usable question)'
        required: false
        default: '0'
      folds:
        description: 'Cross-fitting folds'
        required: false
        default: '5'
      max_calls:
        description: 'Hard model-call budget; the lane forecasts the remaining folds and stops early rather than discarding a run'
        required: false
        default: '8000'
      generalize:
        description: 'Scope widening during distillation (false = ablation)'
        required: false
        default: 'true'
      convention:
        description: 'House convention (empty, or thousands)'
        required: false
        default: ''
      semantics:
        description: 'Result comparison that scores the run: multiset (BIRD official) or set (ROSE baseline); the other is computed alongside'
        required: false
        default: 'multiset'
      transfer_targets:
        description: 'Foreign cases each admitted rule is shown (0 disables the transfer measurement)'
        required: false
        default: '4'
      density_panel:
        description: 'R9.1: questions every selected rule is shown, one rule at a time (0 disables the family; 20 is the pre-registered panel)'
        required: false
        default: '0'
      density_rules_per_db:
        description: 'R9.1: rules drawn from each database, by content hash (8 per database is ~1,400 calls at a panel of 20)'
        required: false
        default: '8'
      sample_temperature:
        description: 'Temperature for the sample-N arms (0 would make every draw identical)'
        required: false
        default: '0.7'
      arms:
        description: 'Control arms beyond none+full (gated,duplicate,wrong-scope,stated,oracle)'
        required: false
        default: 'gated,oracle'
      concurrency:
        description: 'Model calls in flight at once (1 = serial)'
        required: false
        default: '6'
      bird:
        description: 'Run the BIRD lane (false = L4 only, for a smoke run)'
        required: false
        default: 'true'
      l4:
        description: 'Also run the L4 lane (needs the tau2 environment; hours of calls)'
        required: false
        default: 'false'
      l4_tasks:
        description: 'Tasks to draw for L4 (0 = the whole set; a smoke run wants 4-6)'
        required: false
        default: '0'
      probe:
        description: 'Measure whether embedding similarity separates helpful from harmful rules'
        required: false
        default: 'false'
      adjudicate:
        description: 'Re-score the answers this run produced with the evidenced cascade (costs up to 4 calls per question)'
        required: false
        default: 'false'
      validation_credit:
        description: 'How full-validated scores a rule before retiring it: absolute (one call per validation row) or counterfactual (two, and only disagreements count)'
        required: false
        default: 'absolute'
      l4_arms:
        description: 'L4 arms to run: both (memory then reference, paired), memory, or reference'
        required: false
        default: 'both'
      l4_train_share:
        description: 'Share of L4 tasks used for learning (0.4 gives retail 68 held out, above its 60 floor)'
        required: false
        default: '0.5'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  bird:
    name: BIRD Mini-Dev (cross-fitted, memory on/off)
    # A dispatch that only wants the L4 lane should not pay for a BIRD run it did
    # not ask for. Scheduled and push-triggered runs are unaffected.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.bird != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Require credentials
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is not configured for this repository"
            exit 1
          fi

      # No inventory step: the lane verifies its own data. It reads the pinned
      # manifest (`eval/manifests/bird-minidev.json`), checks the download's size and
      # SHA-256 before extracting, reads the questions from the same archive, and
      # counts the rows of every database it is about to use. A pre-flight step that
      # listed a different source would be a second opinion nobody asked for.
      # A stale artefact is worse than no artefact: the publish and upload steps run
      # with `if: always()`, so a committed result from an earlier run would be
      # reported as this run's evidence. Deleting it first makes "nothing was
      # produced" visible instead of plausible.
      - name: Drop any committed artefact
        run: rm -f eval/results/poc-sota-bird.json eval/results/poc-sota-attribution.json

      # The full split is ~1,750 model calls: 350 questions × (none + full + gated +
      # oracle) once each, plus one learning generation per question (cached across
      # folds — cross-fitting would otherwise ask the same prompt four times).
      #
      # The first full-split dispatch issued those calls serially and did not
      # finish: four folds in 160 minutes, because a fold is 560 calls at 2–5 s and
      # one provider stall added 48 minutes. Calls are now bounded-parallel
      # (SOTA_CONCURRENCY, six by default), which puts the whole run near 25–40
      # minutes. The cap stays at 160 so that a slow endpoint still fails on the
      # step rather than on the job, and a provider that stops answering trips the
      # breaker and fails with MG_E_PROVIDER_FAILED instead of publishing a number
      # produced by an outage.
      # Between dispatches, not within one. Every run distils its own rules from its own
      # replies, so `full` has been anything from -4.57pp to +0.86pp across five dispatches
      # of identical code: the treatment moved, not just the measurement. Replaying the
      # distillations makes a re-run learn the same store, which is what lets a cross-run
      # comparison vary in one thing. The key carries the run id because actions/cache never
      # overwrites an existing key, and the restore is a prefix match.
      - name: Restore the distillation cache
        uses: actions/cache@v4
        with:
          path: .cache/distill
          key: distill-${{ vars.SOTA_MODEL || 'deepseek-chat' }}-sql-prompt-3-${{ github.run_id }}
          restore-keys: |
            distill-${{ vars.SOTA_MODEL || 'deepseek-chat' }}-sql-prompt-3-

      - name: Run the benchmark
        timeout-minutes: 160
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BIRD_ARCHIVE_URL: ${{ vars.BIRD_ARCHIVE_URL }}
          SOTA_LIMIT: ${{ github.event.inputs.limit || '0' }}
          SOTA_FOLDS: ${{ github.event.inputs.folds || '5' }}
          SOTA_GENERALIZE: ${{ github.event.inputs.generalize || 'true' }}
          SOTA_ARMS: ${{ github.event.inputs.arms || 'gated,oracle' }}
          SOTA_CONCURRENCY: ${{ github.event.inputs.concurrency || '6' }}
          SOTA_SEMANTICS: ${{ github.event.inputs.semantics || 'multiset' }}
          SOTA_VALIDATION_CREDIT: ${{ github.event.inputs.validation_credit || 'absolute' }}
          SOTA_DISTILL_CACHE: ${{ github.workspace }}/.cache/distill/cache.json
          SOTA_CONVENTION: ${{ github.event.inputs.convention || '' }}
          SOTA_RESAMPLES: '10000'
          SOTA_SAMPLE_TEMPERATURE: ${{ github.event.inputs.sample_temperature || '0.7' }}
          SOTA_TRANSFER_TARGETS: ${{ github.event.inputs.transfer_targets || '4' }}
          SOTA_DENSITY_PANEL: ${{ github.event.inputs.density_panel || '0' }}
          SOTA_DENSITY_RULES_PER_DB: ${{ github.event.inputs.density_rules_per_db || '8' }}
          POC_MAX_CALLS: ${{ github.event.inputs.max_calls || '8000' }}
        run: pnpm eval:sota

      - name: Attribute the flips to rules
        if: always()
        run: |
          if [ -f eval/results/poc-sota-bird.json ]; then
            pnpm eval:attribute
          elif [ -f eval/results/poc-sota-bird.partial.json ]; then
            # The lane stopped before it could measure, and said why. Reporting that reason
            # here is the difference between a run whose cause is on screen and one whose
            # cause is forty-seven minutes into a log nobody scrolls to.
            node -e "
              const r = require('./eval/results/poc-sota-bird.partial.json');
              console.log('::error::the lane stopped before measuring: ' + r.reason +
                ' (spent ' + r.spent + ' of ' + r.cap + ', ' +
                r.folds_completed + '/' + r.folds_planned + ' folds complete)');
              process.exit(1);
            "
          else
            echo "::error::no artefact: the attribution step cannot run"
            exit 1
          fi

      # R7.0's reading, printed where the run can be read without opening anything. It exits zero
      # when the artefact carries no pool, because a run with no sampling arm has nothing to
      # describe and is not a failed run — the lane says so in its own line instead.
      - name: Describe the candidate pool
        if: always()
        run: |
          if [ -f eval/results/poc-sota-bird.json ]; then
            pnpm eval:pool
          else
            echo "no artefact, so no pool to describe"
          fi

      # R7.2a's gate, on the same pool. No calls: the signals are functions of the recorded
      # signatures, and the composite is scored on the candidates the run already produced. It
      # exits zero when nothing survives, because "no signal separates right answers from wrong
      # ones" is a finding rather than a broken step.
      - name: Gate the execution signals
        if: always()
        run: |
          if [ -f eval/results/poc-sota-bird.json ]; then
            pnpm eval:signals
          else
            echo "no artefact, so no signals to gate"
          fi

      # R7.3a's price, on the same pool: what a verifier would be worth if its extraction and
      # retrieval were perfect. It exits zero when the prior cannot beat the first draw, because
      # "memory cannot judge" is the finding that decides whether the next stage exists.
      - name: Price the memory prior
        if: always()
        run: |
          if [ -f eval/results/poc-sota-bird.json ]; then
            pnpm eval:prior
          else
            echo "no artefact, so no memory to price"
          fi

      # R9.1's reading, off the same artefact: one rule at a time, twenty questions from its own
      # database, and a foreign rule on the same panel as the floor. It exits zero when the family
      # was not measured, because a run that did not buy the stage has nothing to report and is not
      # a failed run.
      - name: Read the density family
        if: always()
        run: |
          if [ -f eval/results/poc-sota-bird.json ]; then
            pnpm eval:density
          else
            echo "no artefact, so no family to read"
          fi

      # R7.1's ceiling, read off the artefact: three generators, the union over them, and the three
      # bars that were fixed before the dispatch. It exits zero when a bar is refuted, because a
      # refuted bar is the stage's result and not a broken step.
      - name: Price the generator pool
        if: always()
        run: |
          if [ -f eval/results/poc-sota-bird.json ]; then
            pnpm eval:union
          else
            echo "no artefact, so no generator pool to price"
          fi

      # The re-score runs on the answers this job just produced, which is the point: the
      # model is not asked anything new, only a different criterion is applied to what it
      # already said. It sits before the publish step so a failure here is visible in the
      # run's own output rather than only in an artefact nobody opened.
      - name: Re-score with the evidenced cascade
        if: inputs.adjudicate == 'true' && inputs.bird == 'true'
        timeout-minutes: 90
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BIRD_DB_DIR: ${{ github.workspace }}/packages/eval/.cache/bird
          JUDGE_CONCURRENCY: '4'
        run: pnpm eval:adjudicate

      - name: Publish the result
        if: always()
        run: |
          node -e "
            const fs = require('node:fs');
            if (!fs.existsSync('./eval/results/poc-sota-bird.json')) {
              console.log('::error::the lane produced no artefact; nothing is published');
              process.exit(1);
            }
            const r = require('./eval/results/poc-sota-bird.json');
            const m = r.metrics;
            const p = r.paired;
            const lines = [
              '### BIRD Mini-Dev — cross-fitted, k=' + r.config.folds,
              '',
              '| Arm | Execution accuracy | n |',
              '| --- | --- | --- |',
              '| no memory | ' + (m.accuracy_without_memory * 100).toFixed(2) + '% | ' + p.n + ' |',
              '| with memory | ' + (m.accuracy_with_memory * 100).toFixed(2) + '% | ' + p.n + ' |',
              '',
              'Delta ' + p.delta_pp.toFixed(2) + 'pp [' + p.ci_low_pp.toFixed(2) + ', ' +
                p.ci_high_pp.toFixed(2) + '], McNemar p=' + p.p_value.toFixed(4) +
                ', gained ' + p.gained + ', lost ' + p.lost + '.',
              'Minimum detectable difference at this n and discordance: ' +
                p.min_detectable_pp.toFixed(2) + 'pp.',
              '',
              'Parse ' + (m.parse_rate * 100).toFixed(1) + '%, exec ' +
                (m.exec_rate * 100).toFixed(1) + '%, ' + m.knowledge_active_mean.toFixed(1) +
                ' active rules per fold, ' + m.mean_pack_ids.toFixed(2) + ' rules per question, ' +
                m.corrections_learned + ' corrections learned, ' + r.calls + ' calls (' +
                r.tokens + ' tokens, ' + r.retries + ' retries).',
              '',
              '| Gate | Result | Actual |',
              '| --- | --- | --- |',
              ...r.gates.map((g) => '| ' + g.id + (g.blocking ? '' : ' (advisory)') + ' | ' +
                (g.pass ? 'pass' : 'FAIL') + ' | ' + g.actual + ' |'),
              '',
              '| Control arm | Accuracy | Delta vs none | 95% CI | p | rules/question |',
              '| --- | --- | --- | --- | --- | --- |',
              ...r.arms.map((a) => '| ' + a.arm + ' | ' + (a.accuracy * 100).toFixed(2) + '% | ' +
                a.delta_pp.toFixed(2) + 'pp | [' + a.ci_low_pp.toFixed(2) + ', ' +
                a.ci_high_pp.toFixed(2) + '] | ' + a.p_value.toFixed(4) + ' | ' +
                a.mean_pack_ids.toFixed(2) + ' |'),
              '',
              '| Fold | eval | active | no memory | with memory | delta |',
              '| --- | --- | --- | --- | --- | --- |',
              ...r.per_fold.map((f) => '| ' + f.fold + ' | ' + f.eval + ' | ' + f.active + ' | ' +
                (f.without_memory * 100).toFixed(1) + '% | ' + (f.with_memory * 100).toFixed(1) +
                '% | ' + f.delta_pp.toFixed(2) + 'pp |'),
              '',
              r.distill_failure_samples.length === 0
                ? 'No distillation parse failures.'
                : 'Distillation failures: ' + r.distill_failure_samples.join(' | '),
              ...(m.density === undefined ? [] : [
                '',
                '### R9.1 — one rule at a time, ' + m.density.panel + ' questions per rule',
                '',
                '| Stratum | rules | injections | discriminating | flips | delta |',
                '| --- | --- | --- | --- | --- | --- |',
                ...['overall', 'relevant', 'irrelevant', 'cued', 'floor'].map((k) =>
                  '| ' + k + ' | ' + m.density[k].rules + ' | ' + m.density[k].injections + ' | ' +
                  ((1 - m.density[k].inertShare) * 100).toFixed(1) + '% | ' +
                  (m.density[k].flipRate * 100).toFixed(1) + '% | ' +
                  m.density[k].deltaPp.toFixed(2) + 'pp |'),
                '',
                '| Policy | shown | accuracy | delta | 95% CI |',
                '| --- | --- | --- | --- | --- |',
                ...m.density.policies.map((a) => '| ' + a.name + ' | ' + a.shown + '/' + a.injections +
                  ' | ' + (a.treatmentAccuracy * 100).toFixed(2) + '% | ' + a.deltaPp.toFixed(2) +
                  'pp | [' + a.ciLowPp.toFixed(2) + ', ' + a.ciHighPp.toFixed(2) + '] |'),
                // R9.3: the same policy fitted out of fold on repeated splits, and the foreign rules
                // fitted by the same machinery. A store that does not beat its own floor has shown
                // that the fit is doing the work rather than the content.
                ...(m.density.crossFit === undefined ? [] : [
                  '',
                  '| Cross-fit (R9.3) | shown | accuracy | delta | 95% CI | splits |',
                  '| --- | --- | --- | --- | --- | --- |',
                  ...['store', 'floor'].map((k) => '| ' + k + ' | ' +
                    m.density.crossFit[k].shown + '/' + m.density.crossFit[k].injections + ' | ' +
                    (m.density.crossFit[k].treatmentAccuracy * 100).toFixed(2) + '% | ' +
                    m.density.crossFit[k].deltaPp.toFixed(2) + 'pp | [' +
                    m.density.crossFit[k].ciLowPp.toFixed(2) + ', ' +
                    m.density.crossFit[k].ciHighPp.toFixed(2) + '] | ' +
                    m.density.crossFit[k].folds + ' x ' + m.density.crossFit[k].repeats + ' |'),
                ]),
              ]),
            ];
            const text = lines.join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n');
            console.log(text);
          "

      - name: Upload the artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota-bird
          path: |
            eval/results/poc-sota-bird.json
            eval/results/poc-sota-attribution.json
          if-no-files-found: error

      # Not evidence, and named so nobody reads it as evidence: when the budget stops a run,
      # the folds that finished are still a measurement of what a fold costs, which is what
      # sizes the next dispatch. The step stays optional because a run that completes has no
      # partial record to carry, and failing there would punish the good case.
      - name: Upload the partial record of a stopped run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota-bird-partial
          path: eval/results/poc-sota-bird.partial.json
          if-no-files-found: ignore
          retention-days: 7

      # A separate step because `if-no-files-found: error` is the right default and the
      # wrong one here: the adjudication only runs when it was asked for, and folding it
      # into the step above would fail every run that did not buy it. The first dispatch
      # that produced one uploaded nothing, so its numbers exist only in a log.
      - name: Upload the adjudication
        if: inputs.adjudicate == 'true' && inputs.bird == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sota-adjudication
          path: eval/results/sota-adjudication.json
          if-no-files-found: error

  # The retrieval-signal probe.
  #
  # Not a benchmark: it reads an artefact that already exists and asks whether a
  # semantic signal could have sorted the rules the lexical one could not. A lane
  # rebuilt around a signal that cannot separate the groups would be an expensive way
  # to learn nothing.
  probe:
    name: 'Retrieval signal probe'
    if: github.event.inputs.probe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Probe
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SOTA_ARTEFACT: eval/results/poc-sota-bird.json
        run: pnpm eval:probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-probe
          path: eval/results/poc-embed-probe.json
          if-no-files-found: warn

  # L4 — τ²-bench pass^4.
  #
  # Skipped until the environment exists: `TAU_DRIVER` names a module that runs the
  # two arms and returns per-task trial counts, and the tool-calling sandbox has to
  # come with it. A job that runs without either would publish a zero it did not
  # measure, so the gate is a repository variable rather than a TODO.
  l4:
    name: 'L4 tau-bench pass^4'
    # Two switches, because the variable is for "this repository runs L4 now" and
    # the input is for "check the wiring once". A dispatch that sets neither leaves
    # a lane that costs hours of model calls switched off.
    if: vars.TAU_ENV_READY == 'true' || github.event.inputs.l4 == 'true'
    runs-on: ubuntu-latest
    # Two arms of the same split, each ~60 minutes at concurrency 2, plus the pairing.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

      # The environment, pinned by tag and cached by that tag.
      #
      # Upstream ships as a repository rather than a wheel (`uv sync` against a
      # clone, Python 3.12+), so the version is a git ref, not a semver on PyPI.
      # Nothing is vendored: a copy of someone else's agent sandbox in this
      # repository would sit outside the licence review and the secret scan, and
      # would still not tell us which upstream commit we were measuring.
      - name: Cache the tau2 environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tau2-bench
          key: tau2-${{ vars.TAU_VERSION }}-${{ runner.os }}

      - name: Install tau2-bench at the pinned ref
        env:
          TAU_VERSION: ${{ vars.TAU_VERSION }}
        run: |
          set -euo pipefail
          REF="${TAU_VERSION:-v0.2.0}"
          if [ ! -d .tau2-bench/.git ]; then
            git clone --depth 1 --branch "$REF" https://github.com/sierra-research/tau2-bench .tau2-bench \
              || { echo "tau2-clone-failed:$REF"; exit 21; }
          fi
          cd .tau2-bench
          python -m pip install --upgrade pip uv
          uv sync || { echo "tau2-sync-failed:$REF"; exit 22; }
          # litellm imports its MCP handler eagerly on the first completion and does
          # not declare `mcp` as a hard dependency, so every model call raises
          # ModuleNotFoundError before a request is sent. Installing it here is the
          # whole fix; the alternative is pinning litellm, which would also pin the
          # provider adapters this lane depends on.
          uv pip install mcp || { echo "tau2-mcp-missing:$REF"; exit 24; }
          uv run tau2 check-data || { echo "tau2-data-missing:$REF"; exit 23; }

      # The lane, with the repository's own driver unless a variable overrides it.
      #
      # The job itself is gated on `TAU_ENV_READY`, so this does not make L4 run by
      # default — it makes the gate the only switch, which is what a lane that costs
      # hours of model calls should have. `TAU_MEMORY=false` runs the reference arm
      # on its own, which is the cheap way to check the wiring before paying for both.
      # The two arms, in one job and one configuration.
      #
      # They must share the split, the model, the trials and the concurrency, or their
      # difference is not the memory's. Running them in one job is also what makes them
      # comparable on the day: two dispatches a week apart measure two endpoints.
      - name: L4 arm — memory
        if: github.event.inputs.l4_arms != 'reference'
        timeout-minutes: 120
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAU_DRIVER: ${{ vars.TAU_DRIVER || './packages/eval/src/bin/tau2-driver.ts' }}
          TAU_RESULTS: ${{ vars.TAU_RESULTS }}
          TAU_MODEL: ${{ vars.TAU_MODEL || 'deepseek/deepseek-chat' }}
          TAU_VERSION: ${{ vars.TAU_VERSION }}
          TAU_DOMAIN: ${{ vars.TAU_DOMAIN || 'retail' }}
          TAU_TRIALS: ${{ vars.TAU_TRIALS || '4' }}
          TAU_MEMORY: 'true'
          TAU_TRAIN_SHARE: ${{ github.event.inputs.l4_train_share || vars.TAU_TRAIN_SHARE || '0.5' }}
          TAU_CONCURRENCY: ${{ vars.TAU_CONCURRENCY || '2' }}
          TAU_RETRIES: ${{ vars.TAU_RETRIES || '4' }}
          TAU_MAX_TASKS: ${{ github.event.inputs.l4_tasks || vars.TAU_MAX_TASKS || '0' }}
          TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
          # Each arm writes its own artefact: one file per arm is what a pairing step
          # needs, and `always()` on the next step means an arm that misses its bar still
          # leaves the number behind for the pair.
          POC_RESULT_DIR: eval/results/arms/memory
        run: pnpm eval:l4

      - name: L4 arm — reference
        if: always() && github.event.inputs.l4_arms != 'memory'
        timeout-minutes: 120
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAU_DRIVER: ${{ vars.TAU_DRIVER || './packages/eval/src/bin/tau2-driver.ts' }}
          TAU_RESULTS: ${{ vars.TAU_RESULTS }}
          TAU_MODEL: ${{ vars.TAU_MODEL || 'deepseek/deepseek-chat' }}
          TAU_VERSION: ${{ vars.TAU_VERSION }}
          TAU_DOMAIN: ${{ vars.TAU_DOMAIN || 'retail' }}
          TAU_TRIALS: ${{ vars.TAU_TRIALS || '4' }}
          TAU_MEMORY: 'false'
          TAU_TRAIN_SHARE: ${{ github.event.inputs.l4_train_share || vars.TAU_TRAIN_SHARE || '0.5' }}
          TAU_CONCURRENCY: ${{ vars.TAU_CONCURRENCY || '2' }}
          TAU_RETRIES: ${{ vars.TAU_RETRIES || '4' }}
          TAU_MAX_TASKS: ${{ github.event.inputs.l4_tasks || vars.TAU_MAX_TASKS || '0' }}
          TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
          POC_RESULT_DIR: eval/results/arms/reference
        run: pnpm eval:l4

      # The comparison the lane exists to make, on the intersections of the two runs.
      # Its own gate is the one that decides: memory minus reference at p<0.05.
      - name: Pair the arms
        # `''` is a push-triggered run, where no dispatch input exists and both arms ran
        # by default; without it the pairing would silently not happen on the scheduled
        # path, which is the path nobody is watching.
        if: always() && (github.event.inputs.l4_arms == 'both' || github.event.inputs.l4_arms == '')
        timeout-minutes: 10
        run: pnpm eval:l4-pair

      # A not-run that nobody notices is a skip. The annotation is the notice: it
      # names the variable that points at nothing, and the job stays green because
      # nothing was measured rather than because something failed quietly.
      - name: Say so when nothing was measured
        if: always()
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'eval/results/arms/memory/poc-l4.json';
            if (!fs.existsSync(path)) { console.log('::warning::L4 wrote no artefact'); process.exit(0); }
            const r = require('./' + path);
            if (r.metrics.status_not_run === 1) {
              const why = r.metrics.status_driver_missing === 1
                ? 'TAU_DRIVER names a module that does not exist'
                : 'neither TAU_RESULTS nor TAU_DRIVER is set';
              console.log('::warning::L4 did not run: ' + why);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'L4 did not run: ' + why + '. No result is claimed.\n');
            }
          "
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-evidence
          path: eval/results

name: sota

# The public-benchmark lane.
#
# It is deliberately not a merge gate: accuracy at a few hundred questions is a
# measurement, not a verdict, and a flaky pass/fail on it would train the project
# to ignore red builds. What it *does* enforce is instrument validity — the pack
# was non-empty, evaluation did not mutate knowledge, every question was evaluated
# exactly once by a memory that never saw it, and the dataset executed. A run that
# cannot support a claim fails here rather than publishing a number.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Questions to draw (0 = the registration''s own sample, or every usable question when there is none)'
        required: false
        default: '0'
      folds:
        description: 'Cross-fitting folds'
        required: false
        default: '5'
      max_calls:
        description: 'The model-call forecast this dispatch was sized from; the lane compares each fold against it and raises its own cap to the projection whenever the ceiling below covers that. A cap of 9,000 stopped R64 after its first fold; train at 6,600 questions over two arms needs about 14,600'
        required: false
        default: '8000'
      ceiling_calls:
        description: 'The most this dispatch authorises, when that is more than the forecast. Only this number ends a run: a forecast that is low costs a printed line rather than the folds already paid for (R74 spent 5,483 calls on fold 1 to report 29,609 against a 28,000 cap). Empty means the ceiling is the forecast'
        required: false
        default: ''
      generalize:
        description: 'Scope widening during distillation (false = ablation)'
        required: false
        default: 'true'
      prereg:
        description: 'R8.4: the pre-registration this dispatch executes, by bare id — `R63-recall-order`, not `prereg/R63-recall-order.md`, because the artefact is named from it; a dispatch without one is refused'
        required: false
        default: ''
      split:
        description: 'BIRD split — minidev (350-question slice the transfer experiments use), dev (all 1,534 questions, the only split that can reproduce a published dev cell), or train (7,829 out-of-sample questions over 58 databases; not comparable to any leaderboard row)'
        required: false
        default: 'minidev'
      learn_sample:
        description: 'Questions each fold distils from (0 = all). Dev needs ~12,000 calls at full learning; a baseline reproduction needs the evaluation and not the flywheel'
        required: false
        default: '0'
      deadline_min:
        description: 'Wall-clock limit the lane enforces itself, below the step timeout, so a stopped run writes the folds it finished instead of being killed with nothing'
        required: false
        default: '130'
      distill_concurrency:
        description: 'Distillation replies in flight at once; the batch is still applied in corpus order'
        required: false
        default: '8'
      convention:
        description: 'House convention (empty, or thousands)'
        required: false
        default: ''
      semantics:
        description: 'Result comparison that scores the run: multiset (BIRD official) or set (ROSE baseline); the other is computed alongside'
        required: false
        default: 'multiset'
      # `density_panel` is not an input any more. It is R9.1's panel size — a property of that
      # registration rather than of a run — and it holds the twenty-five-input cap that a second
      # backbone needs. It is read from `vars.SOTA_DENSITY_PANEL`, defaulting to the same `0` this
      # menu defaulted to, so no dispatch that did not set it changes behaviour.
      # `template` and `sample_temperature` are not inputs. They belong to a pre-registration rather
      # than to a dispatch menu: a foreign-rule form and a sampling temperature are properties of the
      # experiment, not of the run, and a knob nobody sets from the menu is a knob whose default is
      # the only value it ever has. Both still work, from repository variables, and the dispatch
      # limit of twenty-five inputs is what made the distinction necessary.
      # No default. The menu entry used to default to `gated,oracle`, so "leave it empty and let the
      # registration decide" was unreachable twice over: GitHub substitutes an input's default when
      # the dispatch sends an empty string, so the `||` fallback below never ran, and the default was
      # the R67 ladder besides. R72 declares `arms: full` and was dispatched with an empty field
      # twice; both times it bought two planted arms its file never names. An empty field now means
      # what it says, and `Resolve the arms` fills it from the file.
      arms:
        description: 'Control arms beyond none+full; empty reads them from the pre-registration'
        required: false
      # The backbone, per dispatch rather than per repository.
      #
      # `SOTA_MODEL` was a repository variable and the cache key above the run read the same
      # variable, so changing the backbone was a global mutation that every later dispatch
      # inherited, two backbones could not be run side by side, and a forgotten variable keyed a
      # cache on one model while the lane called another. R68 is the experiment that needs this:
      # the same scaffold on a second backbone, one variable moved.
      #
      # One input rather than three, because the model, the host and the key are one decision and
      # splitting them is how this repository ended up able to move the host while still sending
      # the other provider's key. `zhipu:<model-id>` moves all three together; the empty value
      # leaves every published run exactly where it was.
      backbone:
        description: 'Backbone for this dispatch: empty = the repository model on this provider; <model-id> = that model on this provider, which is the swap that needs no new credential; zhipu:<model-id> = that model on Zhipu, with the key and the host moving together'
        required: false
        default: ''
      concurrency:
        description: 'Model calls in flight at once (1 = serial)'
        required: false
        default: '6'
      bird:
        description: 'BIRD lane: empty = the registration decides (a τ² registration buys none), true/false = explicit override'
        required: false
        default: ''
      l4:
        description: 'Also run the L4 lane (needs the tau2 environment; hours of calls)'
        required: false
        default: 'false'
      l4_tasks:
        description: 'Tasks to draw for L4 (0 = the whole set; a smoke run wants 4-6)'
        required: false
        default: '0'
      probe:
        description: 'Measure whether embedding similarity separates helpful from harmful rules'
        required: false
        default: 'false'
      adjudicate:
        description: 'Re-score the answers this run produced with the evidenced cascade (costs up to 4 calls per question)'
        required: false
        default: 'false'
      validation_credit:
        description: 'How full-validated scores a rule before retiring it: absolute (one call per validation row) or counterfactual (two, and only disagreements count)'
        required: false
        default: 'absolute'
      l4_arms:
        description: 'L4 arms to run: both (memory then reference, paired), memory, or reference'
        required: false
        default: 'both'
      l4_train_share:
        description: 'Share of L4 tasks used for learning (0.4 gives retail 68 held out, above its 60 floor)'
        required: false
        default: '0.5'
      # The labels, which are part of the instrument rather than part of the run.
      #
      # Mini-Dev's annotation error rate was measured at 52.8% (Jin et al., PVLDB 19(5), 2026) and
      # 43.1% of this lane's transfer slice has a different gold in the corrected release, so the
      # number a dispatch produces depends on which of the two it was scored against. `vendor` is the
      # pinned corpus and every published cell; `corrected` applies the vendored revision and drops the
      # 67 questions whose text the correction also rewrote, because an answer to one question graded
      # against another question's label is a corpus revision, not a relabelling.
      gold:
        description: 'Labels to score against: vendor (the pinned corpus, every published cell) or corrected (the vendored revision, on the questions it can label)'
        required: false
        default: 'vendor'
      # The band lever, as a dispatch field rather than as an operator's memory.
      #
      # R78 was dispatched at 03:19 UTC and paid 1.90x what R79 paid for 96% of the same calls; both were
      # correct dispatches of the same science, and the difference was nine minutes of clock. `pnpm
      # eval:band` existed from the day the rate card was written and had no caller. The lesson recorded
      # then was "dispatch inside the window", which is a rule somebody has to remember at the moment they
      # are least likely to: this field is the same rule, executable, and it makes a dispatch's cost a
      # property of the file rather than of the hour it was sent.
      not_before:
        description: 'Earliest UTC start, HH:MM (empty = now). The job waits for the window instead of being dispatched twice; a wait above 240 minutes is refused'
        required: false
        default: ''
  schedule:
    # 18:00 UTC Monday, which is Tuesday 02:00 in UTC+8.
    #
    # It was `0 3 * * 1` — precisely inside the 01:00–04:00 UTC window that bills at exactly double.
    # A cron expression is a dispatch nobody re-reads, so the most expensive thing in this repository
    # was the run that needed no decision to start: once a week, at double price, whether or not
    # anyone was watching. The hour chosen here is outside the rate card's windows and also outside
    # the provider's published discount boundary, so it survives a correction to either one.
    - cron: '0 18 * * 1'

permissions:
  contents: read

# Which BIRD artefact a dispatch reads and writes, once for the whole workflow.
#
# Two splits produce two files, and every reader downstream of a run — attribution, the pool, the
# signals, the density family, the publish step, the embedding probe in the other job — has to be
# pointed at the one this dispatch measured. Naming it once is the difference between a workflow
# whose steps agree and fifteen places to forget.
#
# The design is part of the name, not only the split. Two designs on one split used to write one
# file, and R24 did: it re-ran the dev 2×2 over the artefact R8.3b's `reproduced` cell is
# recomputed from. This expression is the rule `artefacts.ts` enforces, spelled once so a
# dispatch's upload path and its write path cannot disagree.
env:
  # The chain is spelled in full for each split, with `minidev` as the final fallback rather than
  # as the default arm of a two-way choice: `split == 'dev' && A || B` answers B for `train`, and B
  # is the Mini-Dev artefact — the file a train dispatch would have overwritten, which is exactly
  # the loss this variable exists to prevent.
  SOTA_ARTEFACT: ${{ github.event.inputs.prereg != '' && format('{0}-{1}.json', github.event.inputs.split == 'dev' && 'poc-sota-bird-dev' || (github.event.inputs.split == 'train' && 'poc-sota-bird-train' || 'poc-sota-bird'), github.event.inputs.prereg) || (github.event.inputs.split == 'dev' && 'poc-sota-bird-dev.json' || (github.event.inputs.split == 'train' && 'poc-sota-bird-train.json' || 'poc-sota-bird.json')) }}

jobs:
  # Which lane this dispatch buys, decided once and before anything is spent.
  #
  # The two lanes measure different corpora and their gates were written without knowing about
  # each other: `bird` defaulted to `true` for every dispatch, so a τ² dispatch bought a 1,768-call,
  # seventeen-minute BIRD measurement of an arm nobody grades (42524907557). The rule is the one the
  # rest of the lane already follows for the recall floor and the facade pair — the registration
  # decides the experiment — and it lives in `packages/eval/src/lane-scope.ts` rather than in an
  # `if:` because a workflow expression cannot be unit-tested and this one is.
  #
  # It reads the registration and nothing else. A job gated on its output is a job whose gate has
  # cases; when the input default was `true`, a dispatch that meant to buy the lane and one that
  # never thought about it were the same string.
  scope:
    name: 'Which lane this dispatch buys'
    runs-on: ubuntu-latest
    outputs:
      bird: ${{ steps.scope.outputs.bird }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve the scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BIRD_INPUT: ${{ github.event.inputs.bird || '' }}
          SPLIT: ${{ github.event.inputs.split || 'minidev' }}
          PREREG: ${{ github.event.inputs.prereg || '' }}
        run: |
          pnpm --silent eval:lane-scope
          echo "### Lane scope" >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/^reason=//p' "$GITHUB_OUTPUT" | tail -1 >> "$GITHUB_STEP_SUMMARY"

  arms:
    # The planted arms this registration runs, as a matrix.
    #
    # R57 dispatched its three distractor arms one at a time, because the arm lived in
    # `TAU_PLANTED_RULES`, a variable is global, and the dispatch menu has no slot left at
    # twenty-five inputs. Three arms then meant three six-hour runs that could not overlap —
    # and the next experiment was one forgotten variable away from measuring a distractor it
    # never asked for. An arm is a property of the experiment, so the registration declares the
    # list (`plantedArms:`) and this job turns it into one leg per arm.
    #
    # A registration with no such header emits `[""]`: one leg, no plant, which is what every
    # dispatch before R57 was. The empty leg is not a special case anywhere downstream because
    # `""` is the value the driver already reads as "plant nothing".
    name: 'Which arms this registration runs'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.arms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fan the registration's arms out
        id: arms
        env:
          PREREG: ${{ github.event.inputs.prereg || '' }}
        run: |
          set -euo pipefail
          FILE="prereg/${PREREG}.md"
          if [ ! -f "$FILE" ]; then
            # A dispatch with no registration runs one unplanted leg. Refusing here would break
            # every scheduled run, and the prereg is refused by its own gate a step later.
            echo 'matrix=[""]' >> "$GITHUB_OUTPUT"
            echo "### Arms" >> "$GITHUB_STEP_SUMMARY"
            echo "no registration named, so one unplanted leg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ARMS=$(pnpm --silent eval:prereg-arms "$FILE")
          echo "matrix=$ARMS" >> "$GITHUB_OUTPUT"
          {
            echo "### Arms"
            echo
            echo "\`$FILE\` runs $ARMS"
          } >> "$GITHUB_STEP_SUMMARY"

  bird:
    # The split is in the title, not only in the inputs: a run list that calls all of them Mini-Dev
    # is a run list a reader has to open to tell apart, and the two splits measure different cells.
    #
    # The label is the split input with `minidev` as its default, and not a nested ternary, because a
    # job that is skipped never evaluates this expression: `42534241219` printed
    # `BIRD ${{ (((github.event.inputs.split == 'dev') && 'dev') || …` into the run list, which is
    # longer than the name it was replacing and unreadable precisely where a reader is trying to work
    # out why the lane is missing. One expression, two words.
    #
    # `train` loses the `(out-of-sample)` suffix the ternary used to add. The warning it carried is in
    # the `split` input's own description, which the run page shows beside the title, and in the
    # artefact's name (`poc-sota-bird-train`); a conditional that survives into the run list as source
    # text protects nobody from quoting the number.
    name: BIRD ${{ github.event.inputs.split || 'minidev' }} (cross-fitted, memory on/off)
    # Decided by `scope`, which reads the registration: a τ² registration buys no BIRD lane, an
    # explicit `bird: false` buys none, and a BIRD-only split buys one regardless. Scheduled and
    # push-triggered runs keep the lane, because their scope resolves to it.
    needs: scope
    if: needs.scope.outputs.bird == 'true'
    runs-on: ubuntu-latest
    # Measured, not guessed: dev at 1,534 questions over four arms is 6,504 calls in 130 minutes,
    # so the cap has to cover the largest dispatch anyone actually runs. Train at 6,600 questions
    # over two arms is about 14,600 calls — 2.3x dev — and 340 minutes is that ratio applied to the
    # measured dev wall clock, rounded up. The job limit is six hours, and the lane stops itself
    # earlier than this on `deadline_min`, writing the folds it finished.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # The train archive is 8.9 GB and unpacks to a 9.3 GB nested zip, whose databases come to
      # 2.4 GB once the manifest's selection is applied. The peak is the download plus the nested
      # archive — 18.3 GB — and a standard runner offers about 14 GB of free space with its
      # preinstalled toolchains in place. Removing the ones this job never invokes is the
      # documented way to get that space back, and it is why the split is runnable at all rather
      # than an optimisation: without it the run fails at the unpack, after paying for the download.
      #
      # The tool cache is deliberately left alone. It holds the Node this job runs on, and deleting
      # it to gain five gigabytes would trade a disk error at a known step for a missing interpreter
      # at an unknown one.
      - name: Free disk space for the train archive
        if: github.event.inputs.split == 'train'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Resolve the backbone and require its credential
        # Three values decide where a run's tokens are bought: the model, the host and the key. They
        # are resolved together here because splitting them is how this repository became able to
        # point the lane at a foreign host while still sending this provider's key — a combination
        # that does not fail as a rejection but as a refusal per prompt, a tripped breaker, and an
        # artefact saying the endpoint stopped answering.
        id: backbone
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          BACKBONE: ${{ github.event.inputs.backbone || '' }}
          PREREG: ${{ github.event.inputs.prereg || '' }}
          DEFAULT_MODEL: ${{ vars.SOTA_MODEL || 'deepseek-flash' }}
        run: |
          set -euo pipefail
          # The registration may fix the model, and when it does it is the default: a dispatch that names
          # a file and no backbone runs the model that file declares, rather than the repository variable
          # the file was written to replace. An explicit `backbone:` still wins and the lane refuses a
          # disagreement against the header, so the two representations cannot diverge in silence.
          DECLARED=""
          if [ -n "$PREREG" ]; then
            DECLARED=$(pnpm --silent eval:prereg-population --field backbone "prereg/${PREREG}.md")
          fi
          if [ -z "$BACKBONE" ] && [ -n "$DECLARED" ]; then
            BACKBONE="$DECLARED"
          fi
          case "$BACKBONE" in
            '')
              if [ -z "$DEEPSEEK_API_KEY" ]; then
                echo "::error::DEEPSEEK_API_KEY is not configured for this repository"
                exit 1
              fi
              {
                echo "model=$DEFAULT_MODEL"
                echo "endpoint="
                echo "credential=default"
              } >> "$GITHUB_OUTPUT"
              ;;
            zhipu:*)
              MODEL="${BACKBONE#zhipu:}"
              if [ -z "$MODEL" ]; then
                echo "::error::backbone=zhipu: names no model"
                exit 1
              fi
              if [ -z "$ZHIPU_API_KEY" ]; then
                echo "::error::ZHIPU_API_KEY is not configured for this repository"
                exit 1
              fi
              {
                echo "model=$MODEL"
                echo "endpoint=https://open.bigmodel.cn/api/paas/v4/chat/completions"
                echo "credential=zhipu"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              # A bare model id on the default host. This is the one backbone swap that needs no new
              # credential — the same host serves both models under the same key — and until now it was
              # the swap that could not be dispatched, because the vocabulary was closed to `zhipu:` and
              # the repository variable was the only way to name a model, which is the repository-wide
              # mutation R68 closed. The catalogue probe below is what makes the open vocabulary safe:
              # a typo fails in ten seconds with the served list printed.
              case "$BACKBONE" in
                *:*)
                  echo "::error::backbone=$BACKBONE names a provider prefix this workflow does not know; it is empty, <model-id> on this provider, or zhipu:<model-id>"
                  exit 1
                  ;;
              esac
              if [ -z "$DEEPSEEK_API_KEY" ]; then
                echo "::error::DEEPSEEK_API_KEY is not configured for this repository"
                exit 1
              fi
              {
                echo "model=$BACKBONE"
                echo "endpoint="
                echo "credential=default"
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Ask the host what it serves, ten seconds before the first call.
      #
      # The lane's own failure mode for a model id the host does not serve is quiet and expensive: a
      # `4xx` per prompt, which `verdictOf` classifies as a refusal, which trips the eight-prompt
      # breaker, and the run then reports "the endpoint stopped answering" about a host that answered
      # every time — twenty minutes and about a dollar to learn that a string was wrong.
      #
      # It cannot veto on "I could not tell": a host may serve chat completions and no catalogue at all,
      # and the probe records `unlistable` for that rather than failing the step. Only a catalogue that
      # *answered* and did not list the model refuses, and it prints the list it did serve so the fix is
      # in the log rather than in a second dispatch.
      - name: Ask the host whether it serves the model
        env:
          SOTA_MODEL: ${{ steps.backbone.outputs.model }}
          SOTA_ENDPOINT: ${{ steps.backbone.outputs.endpoint }}
          # The same two variables the lane is given, so `planCredential` reports the same source here as
          # it does for the run: a `zhipu:` dispatch spends the lane key, and everything else spends
          # DeepSeek's borrowed one. Passing the borrowed key as `SOTA_API_KEY` would relabel the account
          # that paid in an artefact whose whole purpose is to name it.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SOTA_API_KEY: ${{ (steps.backbone.outputs.credential == 'zhipu' && secrets.ZHIPU_API_KEY) || '' }}
        run: pnpm eval:backbone-probe --out eval/results/.volatile/backbone-probe.json

      # No inventory step: the lane verifies its own data. It reads the pinned manifest for its
      # split (`bird-minidev.json`, `bird-dev.json` or `bird-train.json`), checks the download's
      # size and SHA-256 before extracting, reads the questions from the same archive, and counts
      # the rows of every database it is about to use. A pre-flight step that listed a different
      # source would be a second opinion nobody asked for — which is why the precheck in
      # `bin/split-precheck.ts` reuses the lane's own loader rather than restating it.
      # A stale artefact is worse than no artefact: the publish and upload steps run
      # with `if: always()`, so a committed result from an earlier run would be
      # reported as this run's evidence. Deleting it first makes "nothing was
      # produced" visible instead of plausible.
      # R8.4. A run whose prediction was not written down before it started is a run whose
      # result can only be read as a description of what happened, so the dispatch refuses one.
      # The check is a step rather than a gate inside the run because it has to fail before the
      # first model call: a gate that fires at the end has already spent the budget.
      - name: Require a pre-registration
        if: github.event_name == 'workflow_dispatch'
        env:
          PREREG: ${{ github.event.inputs.prereg || '' }}
        run: |
          if [ -z "$PREREG" ]; then
            echo "::error::this dispatch names no pre-registration; set the 'prereg' input to a bare id such as R63-recall-order (see prereg/TEMPLATE.md)"
            exit 1
          fi
          # A bare id, and the refusal names the form. The field was documented as `prereg/<id>.md`,
          # which reads like a path, so a dispatch that passed the path built
          # `prereg/prereg/R63-recall-order.md.md` and failed with "no such pre-registration" about a
          # file that existed. The artefact is also named from this string, so a path would write into
          # a subdirectory of eval/results that the publish step never looks in — a silent loss of a
          # twenty-minute run rather than a loud refusal of a one-word mistake.
          case "$PREREG" in
            */*|*.md)
              echo "::error::the 'prereg' input is a bare id, not a path: pass '${PREREG##*/}' without the directory and without .md"
              exit 1
              ;;
          esac
          pnpm eval:prereg "prereg/$PREREG.md"

      # Only this split's artefact. Deleting the other one would erase the evidence for every
      # reading that quotes it — the Mini-Dev rows in the comparison table are recomputed from
      # their own artefact by the protocol gate, and a gate with nothing to recompute is a gate
      # that silently passes.
      - name: Drop the committed artefact for this split
        run: |
          rm -f "eval/results/$SOTA_ARTEFACT" "eval/results/poc-sota-attribution.json"
          rm -f "eval/results/${SOTA_ARTEFACT%.json}.partial.json"

      # The full split is ~1,750 model calls: 350 questions × (none + full + gated +
      # oracle) once each, plus one learning generation per question (cached across
      # folds — cross-fitting would otherwise ask the same prompt four times).
      #
      # The first full-split dispatch issued those calls serially and did not
      # finish: four folds in 160 minutes, because a fold is 560 calls at 2–5 s and
      # one provider stall added 48 minutes. Calls are now bounded-parallel
      # (SOTA_CONCURRENCY, six by default), which puts the whole run near 25–40
      # minutes. The cap stays at 160 so that a slow endpoint still fails on the
      # step rather than on the job, and a provider that stops answering trips the
      # breaker and fails with MG_E_PROVIDER_FAILED instead of publishing a number
      # produced by an outage.
      # Between dispatches, not within one. Every run distils its own rules from its own
      # replies, so `full` has been anything from -4.57pp to +0.86pp across five dispatches
      # of identical code: the treatment moved, not just the measurement. Replaying the
      # distillations makes a re-run learn the same store, which is what lets a cross-run
      # comparison vary in one thing. The key carries the run id because actions/cache never
      # overwrites an existing key, and the restore is a prefix match.
      - name: Restore the distillation cache
        uses: actions/cache@v4
        with:
          path: .cache/distill
          key: distill-${{ steps.backbone.outputs.model }}-sql-prompt-3-${{ github.run_id }}
          restore-keys: |
            distill-${{ steps.backbone.outputs.model }}-sql-prompt-3-

      # What R73's writer said, kept between dispatches.
      #
      # The writer costs one call per question and its reply is a function of the prompt, which
      # carries the schema and the question: a replay of the same split should pay nothing for the
      # assertions and measure the same ones, and a writer whose output moved between two runs would
      # make the arm's delta a statement about sampling. Keyed on the prompt hash inside the file, so
      # the cache key itself can be coarse.
      - name: Restore the assertion cache
        uses: actions/cache@v4
        with:
          path: .cache/assertions
          key: assertions-${{ steps.backbone.outputs.model }}-${{ github.run_id }}
          restore-keys: |
            assertions-${{ steps.backbone.outputs.model }}-

      # The temperature a registration declares, or the lane's default.
      #
      # `SOTA_SAMPLE_TEMPERATURE` is a repository variable, and a variable is global: R70 measures the
      # same arms at T = 1.0 that R69 measures at 0.7, so on a variable the second experiment is a
      # mutation every queued run inherits — including one dispatched in between, which would then
      # measure neither temperature and report the lane's. The arms already come from the
      # registration for exactly this reason; this reads the second knob from the same file. A
      # registration that declares none leaves the variable's own default in place, so nothing that
      # was dispatched before R70 changes behaviour.
      - name: Resolve the sampling temperature
        id: temperature
        env:
          PREREG: ${{ github.event.inputs.prereg || '' }}
        run: |
          set -euo pipefail
          VALUE=""
          if [ -n "$PREREG" ]; then
            VALUE=$(pnpm --silent eval:prereg-temperature "prereg/${PREREG}.md")
          fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          # No `${VALUE:-word}` here, and that is a fix rather than a style: inside the `word` part
          # of a parameter expansion the shell parses quotes even though the whole thing sits inside
          # double quotes, so the apostrophe in an English sentence opened a string that never
          # closed. R69's and R68's first dispatches both died on it in one second, before a single
          # model call - a shell expansion is not inside the quotes it appears to be inside.
          {
            echo "### Sampling temperature"
            echo
            if [ -n "$VALUE" ]; then
              echo "declared by the registration: $VALUE"
            else
              echo "the lane default, from vars.SOTA_SAMPLE_TEMPERATURE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The arms a registration declares, or the lane's own two baselines.
      #
      # The menu entry used to fall back to a hard-coded `gated,oracle`, which is the R67 ladder and
      # not a default at all: R72's header declares `arms: full`, nothing was typed into the menu, and
      # the dispatch measured two planted arms the file never asked for — 7,235 calls of a different
      # experiment, stopped only when the budget forecast added up the remaining folds. The default
      # is a property of the registration for the same reason the temperature is, and the arm check
      # is a net rather than the plan: an empty header now resolves to "the two baselines", which is
      # what a file with nothing to say about arms actually describes.
      - name: Resolve the arms
        id: registration
        env:
          PREREG: ${{ github.event.inputs.prereg || '' }}
        run: |
          set -euo pipefail
          VALUE=""
          if [ -n "$PREREG" ]; then
            VALUE=$(pnpm --silent eval:prereg-arms --csv "prereg/${PREREG}.md")
          fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          {
            echo "### Arms"
            echo
            if [ -n "$VALUE" ]; then
              echo "declared by the registration: $VALUE"
            elif [ -n "$PREREG" ]; then
              echo "the registration declares no arm beyond the two baselines"
            else
              echo "no registration; the two baselines and nothing else"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The population a registration scores, or the menu's own number.
      #
      # `sample` has been in every header since the first registration and nothing compared it with
      # what the lane drew: `limit` defaulted to `0` ("every usable question"), the number was typed
      # by hand when somebody remembered, and the artefact reported a population the file had not
      # sized. Same defect as R67's arm list, same fix. `offset` is the other half: a `loo` draw is a
      # (rule, question) pair and cannot be drawn twice, so a top-up of draws is a claim about
      # *different* questions, and a prefix can never deliver them — the reason R78 was first written
      # as "the same questions, more draws" and would have re-bought every pair R77 had spent.
      #
      # An explicit non-zero `limit` still wins, because a hand run of a registration at a smaller
      # population is a legitimate thing to do — and the lane refuses it against the header, so the
      # two representations cannot disagree in silence.
      - name: Resolve the population
        id: population
        env:
          PREREG: ${{ github.event.inputs.prereg || '' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          set -euo pipefail
          SAMPLE=""
          OFFSET=""
          if [ -n "$PREREG" ]; then
            SAMPLE=$(pnpm --silent eval:prereg-population --field sample "prereg/${PREREG}.md")
            OFFSET=$(pnpm --silent eval:prereg-population --field offset "prereg/${PREREG}.md")
          fi
          if [ "$LIMIT" != "0" ] && [ -n "$LIMIT" ]; then
            SAMPLE="$LIMIT"
          fi
          echo "sample=$SAMPLE" >> "$GITHUB_OUTPUT"
          echo "offset=$OFFSET" >> "$GITHUB_OUTPUT"
          {
            echo "### Population"
            echo
            if [ -n "$SAMPLE" ]; then echo "- questions: $SAMPLE"; else echo "- questions: every usable one"; fi
            if [ -n "$OFFSET" ]; then echo "- skipped before the slice: $OFFSET"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # What the clock costs, before anything is spent.
      #
      # The provider bills in two bands and peak is exactly double. R77 ran at 23:19 UTC and paid
      # $0.531 for 6,946 calls; R78 ran the same experiment at 03:19 UTC and paid $1.111 for 6,943, of
      # which $1.054 was peak — the identical dispatch at 1.9x for the same tokens. `bandOf` and
      # `nextOffPeak` had existed unused since the rate card was written, which this repository treats
      # as a defect: a mechanism that only exists in a document is not a mechanism.
      #
      # It warns rather than refuses. A guard that stops a dispatch and says "try again at 16:30" is a
      # guard an operator overrides, and an experiment that was ready to run is a real thing to lose.
      - name: Name the price of the clock
        id: band
        run: |
          set -euo pipefail
          pnpm --silent eval:band | tee band.txt
          {
            echo "### Cost band"
            echo
            cat band.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the band, when the dispatch named one
        id: wait
        if: ${{ github.event.inputs.not_before != '' }}
        env:
          NOT_BEFORE: ${{ github.event.inputs.not_before }}
        # The arithmetic is `planBandWait`'s and is tested there. It lived here as twenty lines of `date`,
        # which is why the L4 job -- the one that pays for an hour of τ² calls -- never ran it: two
        # dispatches on 2026-11-12 named 04:00, started at 02:01, and were refused by the runner at
        # `--require-off-peak` two minutes later, because the wait reached one of the two jobs.
        run: pnpm --silent eval:wait-band

      - name: Say which band the run started in
        if: ${{ github.event.inputs.not_before != '' }}
        # Printed after the wait, so the summary says which band the run actually started in rather than
        # which band the dispatch was sent in. Unmasked on purpose: the audit refuses a swallowed failure,
        # and `eval:band` does not fail -- it prints the band and warns. A step that cannot fail loudly is a
        # step whose silence is indistinguishable from a pass.
        run: |
          set -euo pipefail
          pnpm --silent eval:band | tee band-after-wait.txt
          {
            echo "### Cost band after the wait"
            echo
            cat band-after-wait.txt
          } >> "$GITHUB_STEP_SUMMARY"

      # The step timeout used to be the literal 200 and the lane's own deadline a dispatch input
      # whose default was 130. Those two numbers were the same claim about the same run, and nothing
      # tied them together: R68's third attempt was dispatched with `deadline_min: 300`, spent 2,961
      # calls over four folds, and was killed by the runner at 200 minutes with **no artefact at
      # all** — the one outcome the lane's self-stop exists to prevent, produced by a dispatch field
      # the workflow accepted without reading. The timeout is now derived from the deadline, so the
      # backstop is always above the clock, and a dispatch whose deadline cannot fit the job fails
      # here, before the first call.
      - name: Require a deadline the job can honour
        id: deadline
        env:
          DEADLINE_MIN: ${{ github.event.inputs.deadline_min || '130' }}
          WAIT_MIN: ${{ steps.wait.outputs.wait_min || '0' }}
        run: |
          set -euo pipefail
          # 25 minutes of headroom for the last fold to finish writing, and 340 for the job. The wait is
          # part of the 340: a dispatch that sleeps for 140 minutes and then asks for a 300-minute deadline
          # is killed with no artefact, which is the failure this check exists for.
          CAP=$((335 - 25 - WAIT_MIN))
          if [ "$DEADLINE_MIN" -gt "$CAP" ]; then
            echo "::error::deadline_min ${DEADLINE_MIN} cannot fit the job: the job limit is 340 minutes, the step needs 25 of headroom and this dispatch waited ${WAIT_MIN}, so the largest deadline this lane may take is ${CAP}. A run dispatched above it is killed by the runner with no artefact, which is what happened to R68 at deadline 300."
            exit 1
          fi
          # The timeout is computed here rather than in the step's own expression, because GitHub's
          # parser refuses arithmetic inside `timeout-minutes`: `fromJSON(...) + 25` was rejected with
          # "Unexpected symbol: '+'" and the dispatch failed with HTTP 422 before the run existed.
          echo "timeout=$((DEADLINE_MIN + 25))" >> "$GITHUB_OUTPUT"
          echo "deadline ${DEADLINE_MIN} min, step timeout $((DEADLINE_MIN + 25)) min, job limit 340 min"

      - name: Run the benchmark
        # Above the lane's own deadline with room for the last fold to finish writing, and below the
        # job's. The step timeout is a backstop, not a plan: the run that died here at 160 minutes had
        # finished three folds and left no artefact.
        timeout-minutes: ${{ fromJSON(steps.deadline.outputs.timeout) }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # The lane's own default was `deepseek-chat` until this round: a retired name that the
          # endpoint keeps answering by routing it somewhere else, so every artefact recorded a model
          # the lane had not asked for. It is set here as well as in the source because the cache key
          # two steps above already reads this variable, and a cache keyed on one model while the run
          # calls another is a cache that never hits.
          SOTA_MODEL: ${{ steps.backbone.outputs.model }}
          # Empty leaves the client on its own default, which is this provider. A value here is what
          # makes a backbone swap possible, and `planCredential` refuses the combination that would
          # spend the default key on it.
          SOTA_ENDPOINT: ${{ steps.backbone.outputs.endpoint }}
          SOTA_API_KEY: ${{ (steps.backbone.outputs.credential == 'zhipu' && secrets.ZHIPU_API_KEY) || '' }}
          # What the catalogue said about the model this run is about to call. The probe ran above,
          # before the first model call; the artefact records its verdict, so a number produced by a
          # model the host confirmed is distinguishable from one produced by a model id nobody checked.
          SOTA_BACKBONE_PROBE: eval/results/.volatile/backbone-probe.json
          # Empty leaves the provider's default, which for this model is to think. Thinking is billed
          # at the output rate and is invisible in every field except a count nothing was reading, so
          # the `off` switch is available from here and the usage line reports the reasoning share —
          # the decision is taken on a number rather than on an assumption about either direction.
          #
          # R84 moved the regime out of this variable and into the registration's header, which the lane
          # reads before its first call. An empty value here therefore means "the file decides", and a
          # stated value that disagrees with the file is refused by the lane instead of one of the two
          # overwriting the other in silence — the same arrangement `backbone` has, and for the same
          # reason: a variable is one experiment's setting applied to every queued dispatch.
          SOTA_THINKING: ${{ vars.SOTA_THINKING || '' }}
          # From the registration, so the number that sizes the run and the number the run reports
          # are one fact. A dispatch that types a different one still wins here and is refused by the
          # lane against the header, which is the loud version of the same disagreement.
          SOTA_LIMIT: ${{ steps.population.outputs.sample || '0' }}
          SOTA_OFFSET: ${{ steps.population.outputs.offset || '0' }}
          SOTA_FOLDS: ${{ github.event.inputs.folds || '5' }}
          SOTA_GENERALIZE: ${{ github.event.inputs.generalize || 'true' }}
          SOTA_DEADLINE_MIN: ${{ github.event.inputs.deadline_min || '130' }}
          SOTA_DISTILL_CONCURRENCY: ${{ github.event.inputs.distill_concurrency || '8' }}
          # The lane writes this into the artefact so the numbers and the prediction they test
          # travel in one file. The step above refuses a dispatch that names no file; this is what
          # makes the refusal leave a trace a reader can follow.
          SOTA_PREREG: ${{ github.event.inputs.prereg || '' }}
          # Typed arms win; otherwise the registration decides, and an empty result means the two
          # baselines. A literal default here would be a third representation of one fact.
          SOTA_ARMS: ${{ github.event.inputs.arms || steps.registration.outputs.value }}
          SOTA_CONCURRENCY: ${{ github.event.inputs.concurrency || '6' }}
          SOTA_SEMANTICS: ${{ github.event.inputs.semantics || 'multiset' }}
          SOTA_VALIDATION_CREDIT: ${{ github.event.inputs.validation_credit || 'absolute' }}
          SOTA_DISTILL_CACHE: ${{ github.workspace }}/.cache/distill/cache.json
          # Empty when the run buys no writer, which is every run before R73 and every arm after it
          # that does not read assertions.
          SOTA_ASSERTION_CACHE: ${{ github.workspace }}/.cache/assertions/cache.json
          SOTA_CONVENTION: ${{ github.event.inputs.convention || '' }}
          SOTA_RESAMPLES: '10000'
          # The registration's own declaration when it makes one, so an experiment that moves the
          # temperature does not move it for every other queued dispatch.
          SOTA_SAMPLE_TEMPERATURE: ${{ steps.temperature.outputs.value || vars.SOTA_SAMPLE_TEMPERATURE || '0.7' }}
          # The transfer and density knobs are configuration rather than per-dispatch form fields.
          # Forty registrations never varied them, and a dispatch input nobody varies spends one of
          # GitHub's twenty-five slots on a constant — the cap that `ceiling_calls` needed, and that
          # the checker refused to let this file exceed.
          SOTA_TRANSFER_TARGETS: ${{ vars.SOTA_TRANSFER_TARGETS || '4' }}
          SOTA_DENSITY_PANEL: ${{ vars.SOTA_DENSITY_PANEL || '0' }}
          SOTA_DENSITY_RULES_PER_DB: ${{ vars.SOTA_DENSITY_RULES_PER_DB || '8' }}
          SOTA_TRANSFER_PANEL: ${{ vars.SOTA_TRANSFER_PANEL || '10' }}
          # R10. Empty on a schedule, which the lane reads as the incumbent form: a dispatch that
          # says nothing repeats R9.4 rather than silently becoming the new arm.
          SOTA_TEMPLATE: ${{ vars.SOTA_TEMPLATE || '' }}
          SOTA_SPLIT: ${{ github.event.inputs.split || 'minidev' }}
          SOTA_LEARN_SAMPLE: ${{ github.event.inputs.learn_sample || '0' }}
          POC_MAX_CALLS: ${{ github.event.inputs.max_calls || '8000' }}
          POC_CEILING_CALLS: ${{ github.event.inputs.ceiling_calls || '' }}
          # Which labels the run is scored against: the pinned corpus's own, or the correction
          # published against them (43.1% of this slice's gold differs). An input rather than a
          # variable for the same reason the temperature is: it is a property of the experiment, and a
          # repository variable set for one dispatch would silently move every queued run's score.
          POC_GOLD: ${{ github.event.inputs.gold || 'vendor' }}
        run: pnpm eval:sota

      - name: Attribute the flips to rules
        if: always()
        run: |
          if [ -f "eval/results/$SOTA_ARTEFACT" ]; then
            pnpm eval:attribute
          elif [ -f "eval/results/${SOTA_ARTEFACT%.json}.partial.json" ]; then
            # The lane stopped before it could measure, and said why. Reporting that reason
            # here is the difference between a run whose cause is on screen and one whose
            # cause is forty-seven minutes into a log nobody scrolls to.
            node -e "
              const r = require('./eval/results/' + process.env.SOTA_ARTEFACT.replace(/\.json$/, '.partial.json'));
              console.log('::error::the lane stopped before measuring: ' + r.reason +
                ' (spent ' + r.spent + ' of ' + r.cap + ', ' +
                r.folds_completed + '/' + r.folds_planned + ' folds complete)');
              process.exit(1);
            "
          else
            echo "::error::no artefact: the attribution step cannot run"
            exit 1
          fi

      # R7.0's reading, printed where the run can be read without opening anything. It exits zero
      # when the artefact carries no pool, because a run with no sampling arm has nothing to
      # describe and is not a failed run — the lane says so in its own line instead.
      - name: Describe the candidate pool
        if: always()
        run: |
          if [ -f "eval/results/$SOTA_ARTEFACT" ]; then
            pnpm eval:pool
          else
            echo "no artefact, so no pool to describe"
          fi

      # R7.2a's gate, on the same pool. No calls: the signals are functions of the recorded
      # signatures, and the composite is scored on the candidates the run already produced. It
      # exits zero when nothing survives, because "no signal separates right answers from wrong
      # ones" is a finding rather than a broken step.
      - name: Gate the execution signals
        if: always()
        run: |
          if [ -f "eval/results/$SOTA_ARTEFACT" ]; then
            pnpm eval:signals
          else
            echo "no artefact, so no signals to gate"
          fi

      # R7.3a's price, on the same pool: what a verifier would be worth if its extraction and
      # retrieval were perfect. It exits zero when the prior cannot beat the first draw, because
      # "memory cannot judge" is the finding that decides whether the next stage exists.
      - name: Price the memory prior
        if: always()
        run: |
          if [ -f "eval/results/$SOTA_ARTEFACT" ]; then
            pnpm eval:prior
          else
            echo "no artefact, so no memory to price"
          fi

      # R9.1's reading, off the same artefact: one rule at a time, twenty questions from its own
      # database, and a foreign rule on the same panel as the floor. It exits zero when the family
      # was not measured, because a run that did not buy the stage has nothing to report and is not
      # a failed run.
      - name: Read the density family
        if: always()
        run: |
          if [ -f "eval/results/$SOTA_ARTEFACT" ]; then
            pnpm eval:density
          else
            echo "no artefact, so no family to read"
          fi

      # R7.1's ceiling, read off the artefact: three generators, the union over them, and the three
      # bars that were fixed before the dispatch. It exits zero when a bar is refuted, because a
      # refuted bar is the stage's result and not a broken step.
      - name: Price the generator pool
        if: always()
        run: |
          if [ -f "eval/results/$SOTA_ARTEFACT" ]; then
            pnpm eval:union
          else
            echo "no artefact, so no generator pool to price"
          fi

      # The re-score runs on the answers this job just produced, which is the point: the
      # model is not asked anything new, only a different criterion is applied to what it
      # already said. It sits before the publish step so a failure here is visible in the
      # run's own output rather than only in an artefact nobody opened.
      - name: Re-score with the evidenced cascade
        if: inputs.adjudicate == 'true'
        timeout-minutes: 90
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BIRD_DB_DIR: ${{ github.workspace }}/packages/eval/.cache/bird
          JUDGE_CONCURRENCY: '4'
        run: pnpm eval:adjudicate

      - name: Publish the result
        if: always()
        run: |
          node -e "
            const fs = require('node:fs');
            if (!fs.existsSync('./eval/results/' + process.env.SOTA_ARTEFACT)) {
              console.log('::error::the lane produced no artefact; nothing is published');
              process.exit(1);
            }
            const r = require('./eval/results/' + process.env.SOTA_ARTEFACT);
            const m = r.metrics;
            const p = r.paired;
            const lines = [
              '### ' + r.dataset + ' — cross-fitted, k=' + r.config.folds,
              '',
              '| Arm | Execution accuracy | n |',
              '| --- | --- | --- |',
              '| no memory | ' + (m.accuracy_without_memory * 100).toFixed(2) + '% | ' + p.n + ' |',
              '| with memory | ' + (m.accuracy_with_memory * 100).toFixed(2) + '% | ' + p.n + ' |',
              '',
              'Delta ' + p.delta_pp.toFixed(2) + 'pp [' + p.ci_low_pp.toFixed(2) + ', ' +
                p.ci_high_pp.toFixed(2) + '], McNemar p=' + p.p_value.toFixed(4) +
                ', gained ' + p.gained + ', lost ' + p.lost + '.',
              'Minimum detectable difference at this n and discordance: ' +
                p.min_detectable_pp.toFixed(2) + 'pp.',
              '',
              'Parse ' + (m.parse_rate * 100).toFixed(1) + '%, exec ' +
                (m.exec_rate * 100).toFixed(1) + '%, ' + m.knowledge_active_mean.toFixed(1) +
                ' active rules per fold, ' + m.mean_pack_ids.toFixed(2) + ' rules per question, ' +
                m.corrections_learned + ' corrections learned, ' + r.calls + ' calls (' +
                r.tokens + ' tokens, ' + r.retries + ' retries).',
              '',
              '| Gate | Result | Actual |',
              '| --- | --- | --- |',
              ...r.gates.map((g) => '| ' + g.id + (g.blocking ? '' : ' (advisory)') + ' | ' +
                (g.pass ? 'pass' : 'FAIL') + ' | ' + g.actual + ' |'),
              '',
              '| Control arm | Accuracy | Delta vs none | 95% CI | p | rules/question |',
              '| --- | --- | --- | --- | --- | --- |',
              ...r.arms.map((a) => '| ' + a.arm + ' | ' + (a.accuracy * 100).toFixed(2) + '% | ' +
                a.delta_pp.toFixed(2) + 'pp | [' + a.ci_low_pp.toFixed(2) + ', ' +
                a.ci_high_pp.toFixed(2) + '] | ' + a.p_value.toFixed(4) + ' | ' +
                a.mean_pack_ids.toFixed(2) + ' |'),
              '',
              '| Fold | eval | active | no memory | with memory | delta |',
              '| --- | --- | --- | --- | --- | --- |',
              ...r.per_fold.map((f) => '| ' + f.fold + ' | ' + f.eval + ' | ' + f.active + ' | ' +
                (f.without_memory * 100).toFixed(1) + '% | ' + (f.with_memory * 100).toFixed(1) +
                '% | ' + f.delta_pp.toFixed(2) + 'pp |'),
              '',
              r.distill_failure_samples.length === 0
                ? 'No distillation parse failures.'
                : 'Distillation failures: ' + r.distill_failure_samples.join(' | '),
              ...(m.density === undefined ? [] : [
                '',
                '### R9.1 — one rule at a time, ' + m.density.panel + ' questions per rule',
                '',
                '| Stratum | rules | injections | discriminating | flips | delta |',
                '| --- | --- | --- | --- | --- | --- |',
                ...['overall', 'relevant', 'irrelevant', 'cued', 'floor'].map((k) =>
                  '| ' + k + ' | ' + m.density[k].rules + ' | ' + m.density[k].injections + ' | ' +
                  ((1 - m.density[k].inertShare) * 100).toFixed(1) + '% | ' +
                  (m.density[k].flipRate * 100).toFixed(1) + '% | ' +
                  m.density[k].deltaPp.toFixed(2) + 'pp |'),
                '',
                '| Policy | shown | accuracy | delta | 95% CI |',
                '| --- | --- | --- | --- | --- |',
                ...m.density.policies.map((a) => '| ' + a.name + ' | ' + a.shown + '/' + a.injections +
                  ' | ' + (a.treatmentAccuracy * 100).toFixed(2) + '% | ' + a.deltaPp.toFixed(2) +
                  'pp | [' + a.ciLowPp.toFixed(2) + ', ' + a.ciHighPp.toFixed(2) + '] |'),
                // R9.3: the same policy fitted out of fold on repeated splits, and the foreign rules
                // fitted by the same machinery. A store that does not beat its own floor has shown
                // that the fit is doing the work rather than the content.
                ...(m.density.crossFit === undefined ? [] : [
                  '',
                  '| Cross-fit (R9.3) | shown | accuracy | delta | 95% CI | splits |',
                  '| --- | --- | --- | --- | --- | --- |',
                  ...['store', 'floor'].map((k) => '| ' + k + ' | ' +
                    m.density.crossFit[k].shown + '/' + m.density.crossFit[k].injections + ' | ' +
                    (m.density.crossFit[k].treatmentAccuracy * 100).toFixed(2) + '% | ' +
                    m.density.crossFit[k].deltaPp.toFixed(2) + 'pp | [' +
                    m.density.crossFit[k].ciLowPp.toFixed(2) + ', ' +
                    m.density.crossFit[k].ciHighPp.toFixed(2) + '] | ' +
                    m.density.crossFit[k].folds + ' x ' + m.density.crossFit[k].repeats + ' |'),
                ]),
                // R9.4: the same rules away from home. The two rates travel with the delta because
                // R6 closed on the break rate: a repair rate whose denominator drops every trial the
                // rule damages can only go up, and a foreign reading that quotes only the repair
                // rate would repeat that mistake in a new place.
                ...(m.density.transfer === undefined ? [] : [
                  '',
                  '| Transfer (R9.4) | rules | trials | delta | 95% CI | repair | break | home delta |',
                  '| --- | --- | --- | --- | --- | --- | --- | --- |',
                  ...[...m.density.transfer.strata, m.density.transfer.overall].map((t) => '| ' +
                    t.kind + ' | ' + t.rules + ' | ' + t.trials + ' | ' + t.deltaPp.toFixed(2) +
                    'pp | [' + t.ciLowPp.toFixed(2) + ', ' + t.ciHighPp.toFixed(2) + '] | ' +
                    t.repaired + '/' + t.informative + ' | ' + t.broke + '/' + t.breakable + ' | ' +
                    t.home.deltaPp.toFixed(2) + 'pp |'),
                ]),
                // R9.5: how many observations the fit was allowed to see, and what that was worth.
                ...(m.density.evidence === undefined ? [] : [
                  '',
                  '| Evidence (R9.5) | fit sees | shown | delta | 95% CI | + / - |',
                  '| --- | --- | --- | --- | --- | --- |',
                  ...m.density.evidence.map((e) => '| m=' + e.cap + ' | ' + e.cap +
                    ' observation(s) | ' + e.shown + '/' + e.injections + ' | ' +
                    e.deltaPp.toFixed(2) + 'pp | [' + e.ciLowPp.toFixed(2) + ', ' +
                    e.ciHighPp.toFixed(2) + '] | +' + e.gained + ' / -' + e.lost + ' |'),
                ]),
              ]),
            ];
            const text = lines.join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n');
            console.log(text);
          "

      - name: Upload the artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota-bird
          path: |
            eval/results/${{ env.SOTA_ARTEFACT }}
            eval/results/poc-sota-attribution.json
          if-no-files-found: error

      # Not evidence, and named so nobody reads it as evidence: when the budget stops a run,
      # the folds that finished are still a measurement of what a fold costs, which is what
      # sizes the next dispatch. The step stays optional because a run that completes has no
      # partial record to carry, and failing there would punish the good case.
      - name: Upload the partial record of a stopped run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota-bird-partial
          path: eval/results/poc-sota-bird*.partial.json
          if-no-files-found: ignore
          retention-days: 7

      # A separate step because `if-no-files-found: error` is the right default and the
      # wrong one here: the adjudication only runs when it was asked for, and folding it
      # into the step above would fail every run that did not buy it. The first dispatch
      # that produced one uploaded nothing, so its numbers exist only in a log.
      - name: Upload the adjudication
        if: inputs.adjudicate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sota-adjudication
          path: eval/results/sota-adjudication.json
          if-no-files-found: error

  # The retrieval-signal probe.
  #
  # Not a benchmark: it reads an artefact that already exists and asks whether a
  # semantic signal could have sorted the rules the lexical one could not. A lane
  # rebuilt around a signal that cannot separate the groups would be an expensive way
  # to learn nothing.
  probe:
    name: 'Retrieval signal probe'
    if: github.event.inputs.probe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Probe
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: pnpm eval:probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-probe
          path: eval/results/poc-embed-probe.json
          if-no-files-found: warn

  # L4 — τ²-bench pass^4.
  #
  # Skipped until the environment exists: `TAU_DRIVER` names a module that runs the
  # two arms and returns per-task trial counts, and the tool-calling sandbox has to
  # come with it. A job that runs without either would publish a zero it did not
  # measure, so the gate is a repository variable rather than a TODO.
  l4:
    # The arm is in the title because a run list with three legs called the same thing is a run
    # list a reader has to open three times to tell apart — and the leg that measures `adversarial`
    # is a different experiment from the leg that measures `far`.
    name: "L4 tau-bench pass^4 — ${{ matrix.arm || 'no plant' }}"
    # Two switches, because the variable is for "this repository runs L4 now" and
    # the input is for "check the wiring once". A dispatch that sets neither leaves
    # a lane that costs hours of model calls switched off.
    if: vars.TAU_ENV_READY == 'true' || github.event.inputs.l4 == 'true'
    needs: [arms]
    # One leg per arm the registration declares. `fail-fast: false` because the arms are independent
    # readings: a leg that misses its gate must not cancel the legs whose numbers are still worth
    # having, which is the same reason the pair step runs under `always()`.
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(needs.arms.outputs.matrix) }}
    runs-on: ubuntu-latest
    # R49 runs TWO recall facades inside the memory arm's single driver run,
    # so that arm pays for two evaluations against one shared store. Two arms of
    # the same split plus the pairing, with headroom for a provider retry.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The same wait the BIRD job runs, from the same tested function. It used to live in that job's step
      # list, so a dispatch that named a window queued here for nothing and was refused two minutes later by
      # the runner's own `--require-off-peak` -- the guard existed and reached one of the two jobs.
      - name: Wait for the band, when the dispatch named one
        id: wait
        if: ${{ github.event.inputs.not_before != '' }}
        env:
          NOT_BEFORE: ${{ github.event.inputs.not_before }}
        run: pnpm --silent eval:wait-band
      # The deadline has to fit what is left of the job, and the wait is part of it: a dispatch that sleeps
      # 120 minutes and then asks for a 200-minute run is killed with no artefact, which is the failure this
      # check exists for in the other job.
      - name: Require a deadline the job can honour
        id: deadline
        env:
          DEADLINE_MIN: ${{ github.event.inputs.deadline_min || '130' }}
          WAIT_MIN: ${{ steps.wait.outputs.wait_min || '0' }}
        run: |
          set -euo pipefail
          CAP=$((340 - 25 - WAIT_MIN))
          if [ "$DEADLINE_MIN" -gt "$CAP" ]; then
            echo "::error::deadline_min ${DEADLINE_MIN} cannot fit the job: 340 minutes of job, 25 of headroom and ${WAIT_MIN} waited leave ${CAP}. A run dispatched above it is killed by the runner with no artefact."
            exit 1
          fi
          echo "deadline ${DEADLINE_MIN} min, waited ${WAIT_MIN} min, job limit 340 min"

      - name: Build
        run: pnpm build

      # The environment, pinned by tag and cached by that tag.
      #
      # Upstream ships as a repository rather than a wheel (`uv sync` against a
      # clone, Python 3.12+), so the version is a git ref, not a semver on PyPI.
      # Nothing is vendored: a copy of someone else's agent sandbox in this
      # repository would sit outside the licence review and the secret scan, and
      # would still not tell us which upstream commit we were measuring.
      - name: Cache the tau2 environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .tau2-bench
          key: tau2-${{ vars.TAU_VERSION }}-${{ runner.os }}

      - name: Install tau2-bench at the pinned ref
        env:
          TAU_VERSION: ${{ vars.TAU_VERSION }}
        run: |
          set -euo pipefail
          REF="${TAU_VERSION:-v0.2.0}"
          if [ ! -d .tau2-bench/.git ]; then
            git clone --depth 1 --branch "$REF" https://github.com/sierra-research/tau2-bench .tau2-bench \
              || { echo "tau2-clone-failed:$REF"; exit 21; }
          fi
          cd .tau2-bench
          python -m pip install --upgrade pip uv
          uv sync || { echo "tau2-sync-failed:$REF"; exit 22; }
          # litellm imports its MCP handler eagerly on the first completion and does
          # not declare `mcp` as a hard dependency, so every model call raises
          # ModuleNotFoundError before a request is sent. Installing it here is the
          # whole fix; the alternative is pinning litellm, which would also pin the
          # provider adapters this lane depends on.
          uv pip install mcp || { echo "tau2-mcp-missing:$REF"; exit 24; }
          uv run tau2 check-data || { echo "tau2-data-missing:$REF"; exit 23; }

      # What the corpus carries, counted before anything is learned from it.
      #
      # The labels are the part of this experiment the repository does not control, and two published
      # sentences about τ² already had the two scenarios' shapes the wrong way round — a claim made
      # from a run's counters that the corpus itself contradicts. Counting the files at the pinned ref
      # beside the run that consumes them makes the corpus a measurement: at v0.2.0 no task in either
      # scenario declares `reward_basis`, so the grade is `DB` (a hash compared to a target derived by
      # replaying the reference calls) times `COMMUNICATE`; the prose rubrics and the call list *as a
      # trajectory* never enter it. A step rather than a paragraph, so the next reader inherits the
      # number instead of the recollection.
      - name: Count the corpus's labels
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/.tau2-bench/data"
          mkdir -p eval/results
          pnpm eval:label-census \
            --corpus "retail=$DATA/tau2/domains/retail/tasks.json" \
            --corpus "airline=$DATA/tau2/domains/airline/tasks.json" \
            --out eval/results/tau2-label-census.json \
            | tee eval/results/tau2-label-census.md
          {
            echo "### What the corpus carries"
            echo
            echo "Pinned at \`$(git -C .tau2-bench rev-parse HEAD)\`."
            echo
            cat eval/results/tau2-label-census.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The lane, with the repository's own driver unless a variable overrides it.
      #
      # The job itself is gated on `TAU_ENV_READY`, so this does not make L4 run by
      # default — it makes the gate the only switch, which is what a lane that costs
      # hours of model calls should have. `TAU_MEMORY=false` runs the reference arm
      # on its own, which is the cheap way to check the wiring before paying for both.
      # The two arms, in one job and one configuration.
      #
      # They must share the split, the model, the trials and the concurrency, or their
      # difference is not the memory's. Running them in one job is also what makes them
      # comparable on the day: two dispatches a week apart measure two endpoints.
      # What the two arms are about to measure, on the run's own page. A cross-domain dispatch is
      # one line of variables away from a within-scenario run and the two produce different
      # artefacts, so the configuration is printed rather than inferred from the file name.
      - name: State the scenario pair
        run: |
          set -euo pipefail
          LEARN="${{ vars.TAU_TRAIN_DOMAIN || vars.TAU_DOMAIN || 'retail' }}"
          TEST="${{ vars.TAU_TEST_DOMAIN || vars.TAU_DOMAIN || 'retail' }}"
          RECALL="${{ vars.TAU_RECALL_DOMAIN || vars.TAU_TRAIN_DOMAIN || vars.TAU_DOMAIN || 'retail' }}"
          {
            echo "### L4 — learn \`$LEARN\`, answer \`$TEST\`, recall under \`$RECALL\` (repository variables; a registration that pins a pair overrides them, and the step below prints the pair that ran)"
            echo "Tasks: train cap \`${{ vars.TAU_TRAIN_TASKS || '0' }}\`, evaluation cap \`${{ vars.TAU_TEST_TASKS || '0' }}\` (0 = all), ${{ vars.TAU_TRIALS || '4' }} trial(s), floor \`${{ vars.TAU_MIN_TASKS || '60' }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # U3's only treatment knob comes from the run's own pre-registration, not
      # from the dispatch menu. A registration with no recallFloor header emits
      # 0, so every earlier dispatch keeps the as-is configuration. The checker
      # recomputes a declared floor from the committed R47 histogram under the
      # registered cost weights and refuses a mismatch, so a floor cannot be
      # supplied or revised after the readout. Only the memory arm consumes it;
      # the reference arm is memory-free and stays untouched.
      - name: Read the registered recall floor
        id: recall_floor
        if: github.event.inputs.prereg != ''
        env:
          PREREG: ${{ github.event.inputs.prereg }}
          # The two values the form check compares. Passed in rather than read by the script, because
          # the script has no business knowing which repository variable feeds which lane, and because
          # a check that read the variable itself could not be executed against a candidate value.
          TAU_FORM_VAR: ${{ vars.TAU_DISTILL_FORM }}
          TAU_UNIT_VAR: ${{ vars.TAU_DISTILL_UNIT }}
          TAU_SCOPE_VAR: ${{ vars.TAU_DISTILL_SCOPE }}
          TAU_CLAIMS_VAR: ${{ vars.TAU_TRACE_CLAIMS }}
        run: |
          set -euo pipefail
          # The input is the registration ID, not the file name. A stray `.md`
          # once produced `prereg/<id>.md.md`, failed here with an opaque
          # ENOENT and silently skipped the memory arm while the reference arm
          # still paid for an hour. Refuse it with the fix in the message, and
          # check the file before any model call is made.
          if [[ "$PREREG" == *.md ]]; then
            echo "::error::prereg must be the registration id without the .md suffix, received '$PREREG'"
            exit 1
          fi
          FILE="prereg/$PREREG.md"
          if [ ! -f "$FILE" ]; then
            echo "::error::no such pre-registration: $FILE"
            exit 1
          fi
          FLOOR=$(pnpm --silent eval:prereg-floor "$FILE")
          PAIR=$(pnpm --silent eval:prereg-pair "$FILE")
          # R53: three note levels over ONE store. The arm cannot be dispatched by the menu
          # for the same reason the pair cannot: the registration is the only source of truth,
          # and a run that chose its levels after the readout would be choosing its contrasts.
          NOTES=$(pnpm --silent eval:prereg-notes "$FILE")
          # R54: the scenario pair is a property of the experiment, like the floor. R51's
          # readback graded a retail store's rules on airline questions because this value
          # lived in a repository variable set for the transfer arm, and nothing in the
          # registration said which pair the predictions were about. A registration that
          # pins nothing prints three empty lines and the variables stand, exactly as before.
          # R56: the distiller's form is the registration's, for the same reason the floor and the
          # scenario pair are. `vars.TAU_DISTILL_FORM` is global, so a registration that fixed
          # `procedure` and a dispatch whose variable still said `lesson` would publish the control
          # under the treatment's name; the script refuses that, and refuses a trace dispatch that
          # would replace the form the registration pinned.
          # R62: the teaching population is the fifth switch of the same family and the last one the
          # lane still resolved from a variable. A registration whose store is built from every
          # trajectory has to be able to say so, and a dispatch that says otherwise is refused rather
          # than silently preferred.
          pnpm --silent eval:prereg-form "$FILE" "${TAU_FORM_VAR:-}" "${TAU_UNIT_VAR:-}" \
            "${TAU_SCOPE_VAR:-}" "${TAU_CLAIMS_VAR:-}" > "$RUNNER_TEMP/distill.env"
          UNIT=$(sed -n 's/^unit=//p' "$RUNNER_TEMP/distill.env")
          FORM=$(sed -n 's/^form=//p' "$RUNNER_TEMP/distill.env")
          SCOPE=$(sed -n 's/^scope=//p' "$RUNNER_TEMP/distill.env")
          CLAIMS=$(sed -n 's/^claims=//p' "$RUNNER_TEMP/distill.env")
          pnpm --silent eval:prereg-scenario "$FILE" > "$RUNNER_TEMP/scenario.env"
          TRAIN=$(sed -n 's/^train=//p' "$RUNNER_TEMP/scenario.env")
          TEST=$(sed -n 's/^test=//p' "$RUNNER_TEMP/scenario.env")
          RECALL=$(sed -n 's/^recall=//p' "$RUNNER_TEMP/scenario.env")
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"
          echo "pair=$PAIR" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "recall=$RECALL" >> "$GITHUB_OUTPUT"
          echo "form=$FORM" >> "$GITHUB_OUTPUT"
          echo "unit=$UNIT" >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "claims=$CLAIMS" >> "$GITHUB_OUTPUT"
          echo "Registered floor \`$FLOOR\`, paired facade \`$PAIR\`, note levels \`$NOTES\`, scenario \`${TRAIN:-inherited}/${TEST:-inherited}/${RECALL:-inherited}\`, distiller \`${UNIT:-inherited}/${FORM:-inherited}\` over \`${SCOPE:-inherited}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: L4 arm — memory
        if: github.event.inputs.l4_arms != 'reference'
        # Two facades of ONE run: one learn, one store, two evaluations.
        timeout-minutes: 240
        env:
          TAU_MIN_COVERAGE: ${{ steps.recall_floor.outputs.floor }}
          # Both values come from the dispatch's own pre-registration. A push
          # run has no prereg input, so both render empty and the single-facade
          # path is preserved verbatim. `TAU_PREREG` is what `facadeScope`
          # attests as the one registration both facades execute.
          TAU_FACADE_PAIR: ${{ steps.recall_floor.outputs.pair }}
          # R53's arm. Enabling it also declares `budgetBasis: note-excluded`, because at a
          # fixed budget the hardened sentence is longer than the standard one and used to
          # buy that room by dropping the last rule -- the arms would differ in their packs.
          TAU_FACADE_NOTES: ${{ steps.recall_floor.outputs.notes }}
          TAU_PREREG: ${{ github.event.inputs.prereg }}
          # Defect 27: a bounded pre-flight probe, registered by R49. An
          # outage writes an explicit no-measurement artefact instead of a zero.
          TAU_PROVIDER_PROBE: ${{ steps.recall_floor.outputs.pair == 'true' && 'true' || 'false' }}
          # Common random numbers: both facades get the same explicit seed.
          TAU_EVAL_SEED: '300'
          # U6's write-side switch. A repository variable rather than a dispatch
          # input for the same reason `template` is: which claims a store admits is
          # a property of the experiment, not a menu item, and the dispatch input
          # count is already at the platform's limit of twenty-five. Unset means
          # off, which is the store every artefact before this switch measured.
          TAU_WRITE_ADMISSION: ${{ vars.TAU_WRITE_ADMISSION }}
          # The four switches a registration owns rather than the dispatch menu. Each is a
          # repository variable for the reason `template` is: which claims a store admits, which
          # sentence a pack opens with, which form the distiller is asked for and which seed the
          # recall draws from are properties of the experiment, not of the run.
          #
          # R53's whole treatment is `TAU_INJECTION_NOTE` (none / standard / hardened) and R56's was
          # `TAU_DISTILL_FORM`. Both were read by the driver, resolved through a tested function and
          # recorded in the artefact -- and neither was passed here, so neither could be varied by
          # any dispatch. `scripts/audit.mjs` now fails on a `TAU_*` the source reads and no workflow
          # can set, which is what makes that a build error rather than a review habit.
          #
          # Unset means empty means the default the lane has always run: `standard` with
          # `declared: false`, `lesson`, seed 7, 400 calls, and the published admission threshold.
          # The single-level note sentence. It is *not* the `facadeNotes` switch: `notes` is the
          # three-arm flag (`TAU_FACADE_NOTES`, above) and passes `false` when a header names nothing,
          # which is not a level. Wiring this line to it made every dispatch fail before its first
          # model call -- `TAU_INJECTION_NOTE must be unset or one of none, standard, hardened, not
          # 'false'` -- which is the driver being right about a switch the workflow got wrong. A level
          # has no header key yet; R53's three-arm path is `facadeNotes`.
          TAU_INJECTION_NOTE: ${{ vars.TAU_INJECTION_NOTE }}
          # R56's one variable, from the registration when it names one and from the variable
          # otherwise. The read step refuses a disagreement before any model call, so the two can
          # never both be in force: one of them is empty by the time this line is evaluated.
          TAU_DISTILL_FORM: ${{ steps.recall_floor.outputs.form || vars.TAU_DISTILL_FORM }}
          # R58: `correction` (the unit every published arm measured) or `trace` (the attempt beside
          # the reference trajectory, with the recurrence pass over the store it produces). Not a
          # dispatch input, because a unit is a property of the experiment rather than of the run.
          TAU_DISTILL_UNIT: ${{ steps.recall_floor.outputs.unit || vars.TAU_DISTILL_UNIT }}
          # R62: `edited` (the corrections every published arm distils) or `all` (also every task that
          # passed, asked for the rule its successful trajectory follows). Unset is `edited`, so an
          # artefact committed before this variable produced the store it always did. From the
          # registration's header when it names one, which is the fifth switch of this family.
          TAU_DISTILL_SCOPE: ${{ steps.recall_floor.outputs.scope || vars.TAU_DISTILL_SCOPE }}
          # R60: how many claims one trace may teach. Unset means three, which is what every
          # committed trace artefact ran at; a run at six is a different treatment and the ceiling
          # travels into the artefact so a readback can tell the two apart.
          TAU_TRACE_CLAIMS: ${{ steps.recall_floor.outputs.claims || vars.TAU_TRACE_CLAIMS }}
          # R57: which controlled distractor this leg plants, and nothing else. It comes from the
          # registration's `plantedArms` header by way of the `arms` job, not from a repository
          # variable: a variable is global, so three arms meant three dispatches in sequence and a
          # fourth experiment was one forgotten `PATCH` from measuring a distractor nobody asked for.
          # The empty leg is the control, which is what every artefact committed before R57 is; the
          # rules themselves are committed in eval/planted/retail.json and their digest travels into
          # the artefact, which is what stops an arm being authored after its episodes are known.
          TAU_PLANTED_RULES: ${{ matrix.arm }}
          TAU_SEED: ${{ vars.TAU_SEED }}
          TAU_MAX_CALLS: ${{ vars.TAU_MAX_CALLS }}
          TAU_WRITE_ADMISSION_THRESHOLD: ${{ vars.TAU_WRITE_ADMISSION_THRESHOLD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAU_DRIVER: ${{ vars.TAU_DRIVER || './packages/eval/src/bin/tau2-driver.ts' }}
          TAU_RESULTS: ${{ vars.TAU_RESULTS }}
          TAU_MODEL: ${{ vars.TAU_MODEL || 'deepseek/deepseek-flash' }}
          # Reasoning is billed at the output rate and tau-bench's agent makes one tool call per turn,
          # so a few hundred tokens of deliberation before `get_order_status` is paid on every turn of
          # every episode and cannot change the reward. `deepseek-flash` runs in thinking mode by
          # default; this lane asks for it off, and `run_split` records the request in the artefact.
          TAU_THINKING: ${{ vars.TAU_THINKING || 'disabled' }}
          # The distiller's model, in the REST id the endpoint serves. τ²'s Python half is a litellm
          # caller and names its model `deepseek/deepseek-flash`; the TypeScript client that distils
          # the corrections posts that name to `api.deepseek.com`, which answers 400 to it. Empty
          # means "read TAU_MODEL and translate the provider alias", which is the default.
          TAU_DISTILL_MODEL: ${{ vars.TAU_DISTILL_MODEL }}
          TAU_VERSION: ${{ vars.TAU_VERSION }}
          # The scenario pair, stated once per arm so both arms cannot disagree about it. An
          # unset pair is a within-scenario run; a pair that differs is the transfer arm, whose
          # treatment is the store recalled under its *own* scenario and served to another.
          TAU_TRAIN_DOMAIN: ${{ steps.recall_floor.outputs.train || vars.TAU_TRAIN_DOMAIN || vars.TAU_DOMAIN || 'retail' }}
          TAU_TEST_DOMAIN: ${{ steps.recall_floor.outputs.test || vars.TAU_TEST_DOMAIN || vars.TAU_DOMAIN || 'retail' }}
          TAU_RECALL_DOMAIN: ${{ steps.recall_floor.outputs.recall || vars.TAU_RECALL_DOMAIN || vars.TAU_TRAIN_DOMAIN || vars.TAU_DOMAIN || 'retail' }}
          TAU_TRAIN_TASKS: ${{ vars.TAU_TRAIN_TASKS || '0' }}
          TAU_TEST_TASKS: ${{ vars.TAU_TEST_TASKS || '0' }}
          # The split floor, from the dispatch rather than from the scenario the lane shipped with:
          # a sixty-task floor chosen for retail reports every smaller scenario as too short.
          TAU_MIN_TASKS: ${{ vars.TAU_MIN_TASKS || '60' }}
          TAU_TRIALS: ${{ vars.TAU_TRIALS || '4' }}
          TAU_MEMORY: 'true'
          TAU_TRAIN_SHARE: ${{ github.event.inputs.l4_train_share || vars.TAU_TRAIN_SHARE || '0.5' }}
          # One task at a time, because the two numbers are in different units.
          #
          # `max_concurrency` is tau2's TASK count; the provider's limit is a REQUEST count, and one
          # episode holds an agent call, a user-simulator call and an evaluator call at once. So a
          # task-level 2 arrives at the provider as five or six requests, and DeepSeek answers
          # `your current concurrency is 6, which exceeds your concurrency limit of 5` — a limit that
          # is itself a function of the account balance, so it falls exactly when a run is expensive.
          # Both arms of `42568927112` died this way at 06:36, one minute apart, after fifty minutes of
          # work. A task-level 1 cannot exceed a request-level 2 for this workload, which is the only
          # value that is safe at any balance.
          TAU_CONCURRENCY: ${{ vars.TAU_CONCURRENCY || '1' }}
          TAU_RETRIES: ${{ vars.TAU_RETRIES || '4' }}
          TAU_MAX_TASKS: ${{ github.event.inputs.l4_tasks || vars.TAU_MAX_TASKS || '0' }}
          # Peak-rate windows are exactly double, and UTC 01:00-10:00 is 09:00-18:00 in UTC+8 --
          # which is when the operator is awake, and therefore when every long run of this lane has
          # been dispatched. A `l4` dispatch is a reading somebody is going to quote, so it is
          # refused before its first provider call unless `TAU_ALLOW_PEAK=1` is set as a repository
          # variable. Scheduled and push runs are not guarded: they are small regression runs whose
          # whole purpose is to be green, and a guard that reddens CI at 09:00 Beijing time would be
          # turned off within a week.
          TAU_REQUIRE_OFF_PEAK: ${{ github.event.inputs.l4 == 'true' && vars.TAU_ALLOW_PEAK != '1' && '1' || '' }}
          TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
          # Each arm writes its own artefact: one file per arm is what a pairing step
          # needs, and `always()` on the next step means an arm that misses its bar still
          # leaves the number behind for the pair.
          POC_RESULT_DIR: eval/results/arms/memory
        run: pnpm eval:l4

      - name: L4 arm — reference
        # A failed registration check must not buy an hour of reference calls:
        # that is a configuration error, not an arm that failed to measure.
        if: >-
          !cancelled() && github.event.inputs.l4_arms != 'memory' &&
          steps.recall_floor.outcome != 'failure'
        timeout-minutes: 120
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # The reference arm is memory-free and never runs a paired facade, but
          # it uses the same provider, so it takes the same pre-flight gate.
          TAU_PROVIDER_PROBE: ${{ steps.recall_floor.outputs.pair == 'true' && 'true' || 'false' }}
          TAU_DRIVER: ${{ vars.TAU_DRIVER || './packages/eval/src/bin/tau2-driver.ts' }}
          TAU_RESULTS: ${{ vars.TAU_RESULTS }}
          TAU_MODEL: ${{ vars.TAU_MODEL || 'deepseek/deepseek-flash' }}
          # Same value as the memory arm, and it has to be: the two arms must differ in the store and
          # in nothing else. An arm that reasoned and a control that did not would differ in cost,
          # in latency and in answer, and the delta would belong to none of them.
          TAU_THINKING: ${{ vars.TAU_THINKING || 'disabled' }}
          TAU_VERSION: ${{ vars.TAU_VERSION }}
          # The scenario pair, stated once per arm so both arms cannot disagree about it. An
          # unset pair is a within-scenario run; a pair that differs is the transfer arm, whose
          # treatment is the store recalled under its *own* scenario and served to another.
          TAU_TRAIN_DOMAIN: ${{ steps.recall_floor.outputs.train || vars.TAU_TRAIN_DOMAIN || vars.TAU_DOMAIN || 'retail' }}
          TAU_TEST_DOMAIN: ${{ steps.recall_floor.outputs.test || vars.TAU_TEST_DOMAIN || vars.TAU_DOMAIN || 'retail' }}
          TAU_RECALL_DOMAIN: ${{ steps.recall_floor.outputs.recall || vars.TAU_RECALL_DOMAIN || vars.TAU_TRAIN_DOMAIN || vars.TAU_DOMAIN || 'retail' }}
          TAU_TRAIN_TASKS: ${{ vars.TAU_TRAIN_TASKS || '0' }}
          TAU_TEST_TASKS: ${{ vars.TAU_TEST_TASKS || '0' }}
          # The split floor, from the dispatch rather than from the scenario the lane shipped with:
          # a sixty-task floor chosen for retail reports every smaller scenario as too short.
          TAU_MIN_TASKS: ${{ vars.TAU_MIN_TASKS || '60' }}
          TAU_TRIALS: ${{ vars.TAU_TRIALS || '4' }}
          TAU_MEMORY: 'false'
          # The same four switches, empty. The two arms must share every setting that is not the
          # memory, and an arm that read a different seed would differ in more than its store.
          TAU_INJECTION_NOTE: ${{ vars.TAU_INJECTION_NOTE }}
          # The same registration values the memory arm reads. This arm distils nothing -- the memory is
          # off -- but the two arms are one experiment, and a control whose artefact records `lesson`
          # beside a treatment that recorded `procedure` is two experiments in one file. The previous
          # wiring read the variables here, which is why the test that guards this only looked at the
          # first assignment of each key.
          TAU_DISTILL_FORM: ${{ steps.recall_floor.outputs.form || vars.TAU_DISTILL_FORM }}
          TAU_DISTILL_UNIT: ${{ steps.recall_floor.outputs.unit || vars.TAU_DISTILL_UNIT }}
          TAU_DISTILL_SCOPE: ${{ steps.recall_floor.outputs.scope || vars.TAU_DISTILL_SCOPE }}
          TAU_TRACE_CLAIMS: ${{ steps.recall_floor.outputs.claims || vars.TAU_TRACE_CLAIMS }}
          TAU_SEED: ${{ vars.TAU_SEED }}
          TAU_MAX_CALLS: ${{ vars.TAU_MAX_CALLS }}
          TAU_TRAIN_SHARE: ${{ github.event.inputs.l4_train_share || vars.TAU_TRAIN_SHARE || '0.5' }}
          # One task at a time, for the reason spelled out on the memory arm above: `max_concurrency`
          # counts tasks and the provider limits requests, and an episode holds three at once.
          TAU_CONCURRENCY: ${{ vars.TAU_CONCURRENCY || '1' }}
          TAU_RETRIES: ${{ vars.TAU_RETRIES || '4' }}
          TAU_MAX_TASKS: ${{ github.event.inputs.l4_tasks || vars.TAU_MAX_TASKS || '0' }}
          TAU_REQUIRE_OFF_PEAK: ${{ github.event.inputs.l4 == 'true' && vars.TAU_ALLOW_PEAK != '1' && '1' || '' }}
          TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
          POC_RESULT_DIR: eval/results/arms/reference
        run: pnpm eval:l4

      # The comparison the lane exists to make, on the intersections of the two runs.
      # Its own gate is the one that decides: memory minus reference at p<0.05.
      - name: Pair the arms
        # `''` is a push-triggered run, where no dispatch input exists and both arms ran
        # by default; without it the pairing would silently not happen on the scheduled
        # path, which is the path nobody is watching.
        if: always() && (github.event.inputs.l4_arms == 'both' || github.event.inputs.l4_arms == '')
        timeout-minutes: 10
        run: pnpm eval:l4-pair

      # R49: the floor's contribution has its OWN artefact and its own three
      # terminal states. This is a facade-contrast, never the l4-paired
      # memory-versus-reference gate the R45 revert rule grades. The readback
      # refuses a missing or unknown state rather than defaulting to PAIRED.
      - name: Read back the paired facades
        if: always()
        timeout-minutes: 5
        env:
          POC_RESULT_DIR: eval/results/arms/memory
        run: pnpm eval:facade-pair-readback

      # R53: three note levels over one store is its own artefact and its own three states.
      # `IDENTITY_BROKEN` blocks: an arm whose levels served different items differed in
      # something the registration did not name, and no delta from it is interpretable.
      - name: Read back the note levels
        if: always()
        timeout-minutes: 5
        env:
          POC_RESULT_DIR: eval/results/arms/memory
        run: pnpm eval:note-facade-readback

      # A not-run that nobody notices is a skip. The annotation is the notice: it
      # names the variable that points at nothing, and the job stays green because
      # nothing was measured rather than because something failed quietly.
      - name: Say so when nothing was measured
        if: always()
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'eval/results/arms/memory/poc-l4.json';
            if (!fs.existsSync(path)) { console.log('::warning::L4 wrote no artefact'); process.exit(0); }
            const r = require('./' + path);
            if (r.metrics.status_no_measurement === 1) {
              console.log('::warning::L4 stopped before measuring: the provider failed its pre-flight probe');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'L4 produced NO MEASUREMENT: the provider failed its pre-flight probe. No result is claimed.\n');
            } else if (r.metrics.status_not_run === 1) {
              const why = r.metrics.status_driver_missing === 1
                ? 'TAU_DRIVER names a module that does not exist'
                : 'neither TAU_RESULTS nor TAU_DRIVER is set';
              console.log('::warning::L4 did not run: ' + why);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'L4 did not run: ' + why + '. No result is claimed.\n');
            }
          "
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-evidence-${{ matrix.arm || 'none' }}
          path: eval/results
